# نبضة Supabase — تمنع إيقاف المشاريع المجانية بسبب الخمول.
#
# لماذا: مشروع Supabase المجاني يتوقف بعد ٧ أيام بلا نشاط API — وأي
# طلب واحد يصفّر العدّاد. ونحن نملك مشروعين مجانيين:
#   • zol-adcraft — بوابة توليد الإعلانات (يُستعمل متقطعاً، فهو الأعرض
#     للتوقف؛ وتوقّفه يكسر شاشة «الإعلانات ✨» في لوحة الإدارة).
#   • الذراع الخادمية — تدقيق الأسعار الليلي (له نشاط ليلي مجدول، لكن
#     الاعتماد على ذلك افتراضٌ لا ضمان).
#
# **لماذا لا تُخفي الفشل؟** لأن ورشةً تنجح بلا عمل تُعلّمك تجاهل
# الأخضر. فهي تنجح **فقط** إن نبضت مشروعاً واحداً على الأقل فعلاً،
# وتفشل إن لم يكن أي سرّ مضبوطاً — والفشل هنا رسالة «أكمل الإعداد».
#
# الإعداد (مرة واحدة) في Settings ← Secrets and variables ← Actions:
#   ZOL_SUPABASE_URL       + ZOL_SUPABASE_ANON_KEY
#   ARM_SUPABASE_URL       + ARM_SUPABASE_ANON_KEY
# ويكفي زوجٌ واحد لتنجح الورشة (والزوج القديم SUPABASE_URL/
# SUPABASE_ANON_KEY ما زال مقبولاً — يُعامل معاملة zol).
#
# مفتاح anon مصمَّم ليكون علنياً (هو داخل التطبيقات أصلاً) — وضعه
# سرّاً هنا نظافةُ ترتيبٍ لا حمايةُ خزنة.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '41 5 */2 * *' # كل يومين 05:41 UTC — بعيداً عن زحام الدقيقة صفر
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: نبضة قواعد البيانات
        env:
          ZOL_URL: ${{ secrets.ZOL_SUPABASE_URL || secrets.SUPABASE_URL }}
          ZOL_KEY: ${{ secrets.ZOL_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          ARM_URL: ${{ secrets.ARM_SUPABASE_URL }}
          ARM_KEY: ${{ secrets.ARM_SUPABASE_ANON_KEY }}
        run: |
          set +e   # فشل مشروع لا يمنع نبض الآخر
          ok=0

          ping_project() {
            name="$1"; url="$2"; key="$3"
            if [ -z "$url" ] || [ -z "$key" ]; then
              echo "⏭️  $name — سرّاه غير مضبوطين، يُتخطّى"
              return
            fi
            # REST وحده يكفي لتصفير عدّاد الخمول، وهو الغاية.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   "$url/rest/v1/" -H "apikey: $key" -H "Authorization: Bearer $key")
            case "$code" in
              200|404)
                echo "✅ $name — نبضة ناجحة (HTTP $code)"
                ok=$((ok+1)) ;;
              401|403)
                # الطلب **وصل المشروع وردّ** — وهذا وحده ما يصفّر عدّاد
                # الخمول، وهو غاية النبضة. لكن رفض المصادقة يعني مفتاحاً
                # خاطئاً أو ناقص النسخ، فيُرفع تحذيرٌ ظاهر لا يُبتلع.
                echo "⚠️  $name — وصلت النبضة (HTTP $code) لكن المفتاح مرفوض"
                echo "::warning::$name — راجع مفتاح anon: انسخه كاملاً بلا مسافات"
                ok=$((ok+1)) ;;
              000)
                echo "::warning::$name — تعذّر الوصول (مهلة أو عنوان خاطئ)" ;;
              *)
                echo "::warning::$name — ردّ غير متوقع (HTTP $code)" ;;
            esac
          }

          ping_project "zol-adcraft" "$ZOL_URL" "$ZOL_KEY"
          ping_project "الذراع الخادمية" "$ARM_URL" "$ARM_KEY"

          echo
          if [ "$ok" -eq 0 ]; then
            echo "::error::لم تنجح أي نبضة. أضف زوج أسرار واحداً على الأقل:"
            echo "::error::ZOL_SUPABASE_URL + ZOL_SUPABASE_ANON_KEY (أو ARM_*)"
            exit 1
          fi
          echo "نبض $ok مشروعاً — $(date -u '+%Y-%m-%d %H:%M') UTC"
