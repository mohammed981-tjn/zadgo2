name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties

      - name: Clean previous builds
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: List all build outputs
        if: always()
        run: |
          echo "=== Contents of android/app/build/outputs ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "outputs folder not found"
          echo "=== Contents of build/ ==="
          find build -type f -name "*.apk" 2>/dev/null || echo "no apk in build/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn