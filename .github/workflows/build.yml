name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK directly via Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/release/ || echo "Directory not found"
          find . -name "*.apk" 2>/dev/null

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error