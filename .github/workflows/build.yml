name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (first attempt via flutter tool)
        run: flutter build apk --release || echo "flutter build reported failure, continuing to check for APK"

      - name: Try direct gradle build if APK missing
        run: |
          if ! find build/app/outputs android/app/build/outputs -type f -name "*release*.apk" 2>/dev/null | grep -q .; then
            echo "APK missing, retrying with gradlew directly"
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "APK already exists, skipping direct gradle retry"
          fi

      - name: Resolve APK artifact path
        id: resolve_apk
        run: |
          apk_path="$(find build/app/outputs android/app/build/outputs -type f -name "*release*.apk" 2>/dev/null | head -n 1 || true)"
          if [ -z "$apk_path" ]; then
            echo "No release APK found after build"
            exit 1
          fi
          echo "Resolved APK path: $apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Final APK search
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: ${{ steps.resolve_apk.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 1
