name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (first attempt via flutter tool)
        run: flutter build apk --release || echo "flutter build reported failure, continuing to check for APK"

      - name: Try direct gradle build if APK missing
        run: |
          if ! find build/app/outputs/flutter-apk android/app/build/outputs/apk/release -name "*.apk" -print -quit 2>/dev/null | grep -q .; then
            echo "APK missing, retrying with gradlew directly"
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "APK already exists, skipping direct gradle retry"
          fi

      - name: Final APK search
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Verify APK exists
        run: |
          find build/app/outputs/flutter-apk android/app/build/outputs/apk/release -name "*.apk" -print 2>/dev/null
          find build/app/outputs/flutter-apk android/app/build/outputs/apk/release -name "*.apk" -print -quit 2>/dev/null | grep -q .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 1
