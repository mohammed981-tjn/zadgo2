name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT:-$FLUTTER_HOME}" > android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=4.0.0" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (first attempt via flutter tool)
        run: flutter build apk --release || echo "flutter build reported failure, continuing to check for APK"

      - name: Try direct gradle build if APK missing
        run: |
          apk_path="$(find build android/app/build -name "*.apk" -type f -print -quit 2>/dev/null || true)"

          if [ -z "$apk_path" ]; then
            echo "APK missing, retrying with gradlew directly"
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "APK already exists at $apk_path, skipping direct gradle retry"
          fi

      - name: Normalize APK path
        run: |
          apk_path="$(find build android/app/build -name "*.apk" -type f -print -quit 2>/dev/null || true)"

          if [ -n "$apk_path" ] && [ "$apk_path" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            mkdir -p build/app/outputs/flutter-apk
            cp "$apk_path" build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Final APK search
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1
