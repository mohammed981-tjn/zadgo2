# نشر «ووركر» الإشعارات على Cloudflare Workers — بضغطة زرّ لا بسطر أوامر.
#
# لماذا CI بدل `npx wrangler` من جهاز المالك؟ النشر المباشر يحتاج
# `wrangler login` (مصادقة متصفّح تفاعلية) وتعلّم أداة سطر أوامر —
# والمالك غير مبرمج. هذا المسار يجعله كمسار القواعد تماماً: سرٌّ واحد
# في GitHub ثم Run workflow، فالبنية التحتية تُدار عبر الكود لا يدوياً.
#
# يدويٌّ فقط (workflow_dispatch): النشر خطوةٌ يقصدها المالك، لا أثرٌ
# جانبيٌّ لكل دفعة — بخلاف القواعد التي تلزم مزامنتها الدائمة مع الكود.
#
# الإعداد مرة واحدة (التفاصيل بالصورة في dev-docs/guides/نشر-الووركر.md):
#   1) أنشئ حساب Cloudflare مجاني.
#   2) My Profile → API Tokens → Create Token → قالب «Edit Cloudflare
#      Workers» → Continue → Create → انسخ الرمز.
#   3) GitHub → Settings → Secrets and variables → Actions → New secret:
#        CLOUDFLARE_API_TOKEN = الرمز المنسوخ.
#      (اختياري: CLOUDFLARE_ACCOUNT_ID إن ملكت أكثر من حساب.)
#   السرّ SERVICE_ACCOUNT للووركر يُعاد استخدامه من FIREBASE_SERVICE_ACCOUNT
#   الموجود أصلاً — فلا سرّ ثانٍ. (اختياري: MOYASAR_SECRET_KEY للتحقق من الدفع.)
#   4) شغّل هذا الـworkflow. في نهايته يُطبع عنوان الووركر.
#   5) انسخ العنوان واضبطه متغيّراً في GitHub (Variables, لا Secrets):
#        ZADGO_NOTIFY_URL = https://zadgo-notify.<نطاقك>.workers.dev/notify.php
#   6) ابنِ نسخة جديدة (dart.yml) فيلتقطها التطبيق.
name: Deploy Notify Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4

      - name: فحص وجود سرّ Cloudflare
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -z "$CF" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$SA" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing — راجع dev-docs/guides/نشر-الووركر.md"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # النشر ينشئ الووركر (أو يحدّثه) على شبكة Cloudflare. wrangler
      # مثبَّتٌ بإصدار مربوط كي لا يتغيّر السلوك بترقية صامتة.
      - name: نشر الووركر
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy | tee deploy.log

      # الأسرار تُحقن بعد وجود سكربت الووركر. SERVICE_ACCOUNT يُعاد
      # استخدامه من سرّ فيربيز نفسه (نفس مفتاح حساب الخدمة الكامل).
      - name: حقن سرّ حساب الخدمة
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" | npx --yes wrangler@3 secret put SERVICE_ACCOUNT

      # مفتاح ميسر اختياري: يُحقن فقط إن وُجد السرّ، وبدونه يردّ التحقق 503.
      - name: حقن مفتاح ميسر (إن وُجد)
        if: ${{ secrets.MOYASAR_SECRET_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MK: ${{ secrets.MOYASAR_SECRET_KEY }}
        run: printf '%s' "$MK" | npx --yes wrangler@3 secret put MOYASAR_SECRET_KEY

      # يُبرز العنوان في ملخّص التشغيل كي ينسخه المالك إلى ZADGO_NOTIFY_URL.
      - name: أبرز عنوان الووركر
        run: |
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          {
            echo "## ✅ نُشر ووركر الإشعارات"
            if [ -n "$url" ]; then
              echo ""
              echo "**عنوان الووركر:**"
              echo '```'
              echo "$url"
              echo '```'
              echo ""
              echo "اضبط في GitHub → Settings → Secrets and variables → Actions → **Variables**:"
              echo '```'
              echo "ZADGO_NOTIFY_URL = ${url}/notify.php"
              echo '```'
              echo ""
              echo "ثم ابنِ نسخة جديدة (Actions → dart.yml → Run)."
            else
              echo ""
              echo "⚠️ تعذّر استخراج العنوان تلقائياً — انظر سجلّ خطوة «نشر الووركر»."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
