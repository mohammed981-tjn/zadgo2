name: Build Flutter APK

on:
  push:
    branches: [ main, copilot/split-customer-app ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'النكهة المطلوب بناؤها'
        type: choice
        default: 'all'
        options:
          - customer
          - driver
          - restaurant
          - admin
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.set.outputs.flavors }}
    steps:
      - name: Determine flavors to build
        id: set
        shell: bash
        run: |
          selected="${{ github.event.inputs.flavor }}"
          if [ -z "$selected" ] || [ "$selected" = "all" ]; then
            echo 'flavors=["customer","driver","restaurant","admin"]' >> "$GITHUB_OUTPUT"
          else
            echo "flavors=[\"$selected\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.prepare.outputs.flavors) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Verify Flutter installation
        run: flutter doctor -v

      # رقم الإصدار يتصاعد مع كل بناء (رقم التشغيل): أندرويد يرفض تثبيت
      # نسخة برقم أقدم، وكان الرقم مثبَّتاً على 1 في كل بناء فلا يميّز
      # النظام جديداً من قديم — ومتجر جوجل يرفض رفع نسخة برقم مكرّر.
      - name: Create android/local.properties
        shell: bash
        run: |
          # اسم الإصدار من pubspec لا رقماً مكرّراً هنا — مصدر واحد للحقيقة،
          # فلا يتخلّف الرقم المعروض للمستخدم عن الرقم المعلَن في المشروع.
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          [ -z "$VER" ] && VER=4.0.0
          echo "flutter.versionCode=${{ github.run_number }}" > android/local.properties
          echo "flutter.versionName=$VER" >> android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          # يُحقن في الشيفرة أيضاً لتقارن به بوابة الحدّ الأدنى للإصدار.
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "إصدار البناء: $VER (رمز ${{ github.run_number }})"

      # بصمة التوقيع الثابتة — سببُ رفض التحديثات سابقاً.
      #
      # بلا مفتاح إصدار كان Gradle يوقّع بمفتاح التصحيح (debug)، وخادم
      # البناء يولّد مفتاح تصحيح **جديداً في كل تشغيل**. فكل APK يحمل بصمة
      # مختلفة، وأندرويد يرفض تحديثاً ببصمة تخالف المثبَّت («لم يتم تثبيت
      # التطبيق») — فلا سبيل للتحديث إلا بحذف النسخة القديمة كل مرة.
      #
      # المفتاح يصل من أسرار المستودع لا من الشيفرة (ملف .jks لا يُودَع
      # إطلاقاً). وإن لم يُضبط السرّ يعمل البناء بالسلوك القديم بدل أن
      # يفشل — فلا ينكسر شيء قبل ضبط الأسرار.
      - name: Decode release keystore
        shell: bash
        env:
          KS: ${{ secrets.ZADGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::لا مفتاح إصدار مضبوط — التوقيع بمفتاح التصحيح، والتحديثات فوق نسخة سابقة ستُرفض"
            exit 0
          fi
          echo "$KS" | base64 -d > android/zadgo-release.jks
          # يُمرَّر لخطوة البناء عبر البيئة، فيلتقطه build.gradle.
          echo "ZADGO_KEYSTORE_FILE=zadgo-release.jks" >> "$GITHUB_ENV"
          echo "✅ مفتاح الإصدار جاهز ($(wc -c < android/zadgo-release.jks) بايت)"

      - name: Deep clean before build
        run: |
          rm -f pubspec.lock
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf build
          rm -rf ~/.pub-cache
          rm -rf ~/.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos | tee flutter_analyze.log

      # الاختبارات الآلية — أول حارس فعلي للمسارات المالية (مدقق البطاقة).
      # فشل أي اختبار يوقف البناء قبل إنتاج APK معطوب.
      - name: Flutter test
        shell: bash
        run: flutter test

      - name: Build APK (${{ matrix.flavor }} flavor)
        # مفتاح بوابة الدفع يُحقن وقت البناء من أسرار المستودع، فلا يُخزَّن في
        # الشيفرة. إن لم يُضبط السرّ يبقى فارغاً، فيختفي خيار الدفع بالبطاقة
        # من التطبيق تلقائياً بدل أن يظهر خياراً معطّلاً.
        #
        # ZADGO_NOTIFY_URL: العنوان الكامل لنقطة إشعارات الخادم المرافق
        # (مثل https://api.zadgo.co/notify.php على استضافة PHP، أو عنوان
        # Cloudflare Worker) — يُضبط كمتغيّر مستودع (Variables لا Secrets،
        # فهو ليس سراً). إن لم يُضبط تُتجاهل نداءات الإشعارات بصمت ويعمل
        # التطبيق كالسابق. راجع server/README-ar.md.
        #
        # --obfuscate + --split-debug-info (طلب المالك ٢٠٢٦-٠٨-١٢):
        # شيفرة Dart تُترجَم أصلاً إلى لغة الآلة في بناء الإصدار، لكن
        # **أسماء** الأصناف والدوال تبقى في الحزمة، وأدوات معروفة تستخرج
        # منها هيكل التطبيق كاملاً. هذان الخياران يستبدلان الأسماء برموز
        # بلا معنى، ويُخرجان جدول الترجمة إلى ملفات symbols تُرفع أثراً
        # منفصلاً — فمن فكّ الحزمة وجد رموزاً، ومن يملك الملفات وحده
        # يقرأ آثار الانهيار.
        run: >
          flutter build apk --release --no-shrink
          --obfuscate --split-debug-info=build/symbols/${{ matrix.flavor }}
          --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart
          --dart-define=MOYASAR_PUBLISHABLE_KEY=${{ secrets.MOYASAR_PUBLISHABLE_KEY }}
          --dart-define=ZADGO_NOTIFY_URL=${{ vars.ZADGO_NOTIFY_URL }}
          --dart-define=ORS_API_KEY=${{ secrets.ORS_API_KEY }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}
        env:
          # build.gradle يقرأ هذه المتغيّرات حين لا يوجد key.properties،
          # فيوقّع بمفتاح الإصدار الثابت. ZADGO_KEYSTORE_FILE تضبطه خطوة
          # فكّ المفتاح أعلاه، ووجودها كلها شرط التوقيع بمفتاح الإصدار —
          # وإلا عاد لمفتاح التصحيح كما كان.
          ZADGO_KEYSTORE_PASSWORD: ${{ secrets.ZADGO_KEYSTORE_PASSWORD }}
          ZADGO_KEY_ALIAS: ${{ secrets.ZADGO_KEY_ALIAS }}
          ZADGO_KEY_PASSWORD: ${{ secrets.ZADGO_KEY_PASSWORD }}

      # تأكيد البصمة في السجلّ: لو عاد التوقيع لمفتاح التصحيح يوماً يظهر
      # هنا فوراً بدل أن يُكتشف بفشل تثبيت على جهاز المالك.
      - name: Verify APK signature
        if: always()
        shell: bash
        run: |
          APK=$(find build -name "*-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "لا يوجد APK للفحص"
            exit 0
          fi
          BT=$(ls "$ANDROID_HOME/build-tools/" 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "apksigner غير متاح — تُخطّى"
            exit 0
          fi
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | grep -iE "certificate DN|SHA-256 digest" || true

      - name: Final APK search
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK Artifact (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-${{ matrix.flavor }}-app-release
          path: |
            build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
            android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: warn
          retention-days: 3

      # جدول ترجمة الرموز — بدونه تصير آثار الانهيار في Crashlytics رموزاً
      # لا تُقرأ. يُحفظ ٩٠ يوماً (أطول من الحزمة نفسها) لأن انهياراً يظهر
      # بعد أسابيع يحتاج جدول **نسخته هو** لا الأحدث:
      #   flutter symbolize -i <stack.txt> -d build/symbols/<flavor>/app.android-arm64.symbols
      - name: Upload debug symbols (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-${{ matrix.flavor }}-symbols
          path: build/symbols/${{ matrix.flavor }}
          if-no-files-found: warn
          retention-days: 3