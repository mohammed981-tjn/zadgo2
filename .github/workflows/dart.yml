name: Build Flutter APK

on:
  push:
    branches: [ main, copilot/split-customer-app ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'النكهة المطلوب بناؤها'
        type: choice
        default: 'all'
        options:
          - customer
          - driver
          - restaurant
          - admin
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.set.outputs.flavors }}
    steps:
      - name: Determine flavors to build
        id: set
        shell: bash
        run: |
          selected="${{ github.event.inputs.flavor }}"
          if [ -z "$selected" ] || [ "$selected" = "all" ]; then
            echo 'flavors=["customer","driver","restaurant","admin"]' >> "$GITHUB_OUTPUT"
          else
            echo "flavors=[\"$selected\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.prepare.outputs.flavors) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Create android/local.properties
        run: |
          echo "flutter.versionCode=1" > android/local.properties
          echo "flutter.versionName=2.0.0" >> android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Deep clean before build
        run: |
          rm -f pubspec.lock
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf build
          rm -rf ~/.pub-cache
          rm -rf ~/.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos | tee flutter_analyze.log

      # الاختبارات الآلية — أول حارس فعلي للمسارات المالية (مدقق البطاقة).
      # فشل أي اختبار يوقف البناء قبل إنتاج APK معطوب.
      - name: Flutter test
        shell: bash
        run: flutter test

      - name: Build APK (${{ matrix.flavor }} flavor)
        # مفتاح بوابة الدفع يُحقن وقت البناء من أسرار المستودع، فلا يُخزَّن في
        # الشيفرة. إن لم يُضبط السرّ يبقى فارغاً، فيختفي خيار الدفع بالبطاقة
        # من التطبيق تلقائياً بدل أن يظهر خياراً معطّلاً.
        #
        # ZADGO_NOTIFY_URL: العنوان الكامل لنقطة إشعارات الخادم المرافق
        # (مثل https://api.zadgo.co/notify.php على استضافة PHP، أو عنوان
        # Cloudflare Worker) — يُضبط كمتغيّر مستودع (Variables لا Secrets،
        # فهو ليس سراً). إن لم يُضبط تُتجاهل نداءات الإشعارات بصمت ويعمل
        # التطبيق كالسابق. راجع server/README-ar.md.
        run: >
          flutter build apk --release --no-shrink
          --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart
          --dart-define=MOYASAR_PUBLISHABLE_KEY=${{ secrets.MOYASAR_PUBLISHABLE_KEY }}
          --dart-define=ZADGO_NOTIFY_URL=${{ vars.ZADGO_NOTIFY_URL }}

      - name: Final APK search
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK Artifact (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-${{ matrix.flavor }}-app-release
          path: |
            build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
            android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: warn
          retention-days: 7