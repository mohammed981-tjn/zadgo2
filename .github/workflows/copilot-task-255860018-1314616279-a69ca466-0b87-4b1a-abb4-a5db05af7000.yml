name: Build Flutter APK

on:
  push:
    branches: [ copilot/split-customer-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Create android/local.properties
        run: |
          echo "flutter.versionCode=1" > android/local.properties
          echo "flutter.versionName=2.0.0" >> android/local.properties

      - name: Deep clean before build
        run: |
          rm -f pubspec.lock
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf build

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee flutter_analyze.log

      - name: Build APK
        run: flutter build apk --release --no-shrink --target-platform android-arm64

      - name: Final APK search
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zadgo-app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1




