name: zadam_delivery
description: ZadGo - نظام إدارة توصيل طلبات
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: 3.8.0
  firebase_auth: 5.3.3
  cloud_firestore: 5.5.0
  firebase_messaging: 15.1.5

  provider: ^6.1.2

  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  fl_chart: ^0.69.0

  uuid: ^4.5.1
  intl: ^0.19.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_square.png
  # ═══════════════════════════════════════════════════════════════════
  # خط Cairo معطَّل مؤقتاً — تشخيص اختفاء كل النصوص في التطبيق.
  #
  # السبب: Cairo-Variable.ttf خط متغيّر (Variable Font)، ودعم Flutter له
  # على Android إشكالي، خصوصاً حين يُسجَّل نفس الملف ثلاث مرات بأوزان
  # مختلفة (400/600/700) كما كان هنا. النتيجة فشل صامت في رسم النص: لا
  # خطأ ولا استثناء، فقط نص غير مرئي بينما تُرسم الحاويات والحدود
  # والألوان طبيعياً — وهو ما ظهر كبطاقات أصناف بيضاء فارغة وأزرار بلا
  # عناوين في تطبيق العميل.
  #
  # بتعطيله يسقط Flutter للخط الافتراضي للنظام (يدعم العربية بالكامل).
  #
  # الحل الدائم لاحقاً: تنزيل ملفات ثابتة منفصلة من Google Fonts
  # (Cairo-Regular.ttf / Cairo-SemiBold.ttf / Cairo-Bold.ttf) ووضع كل
  # وزن في ملفه الخاص بدل ملف متغيّر واحد مكرَّر.
  # ═══════════════════════════════════════════════════════════════════
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Variable.ttf
  #         weight: 400
  #       - asset: assets/fonts/Cairo-Variable.ttf
  #         weight: 600
  #       - asset: assets/fonts/Cairo-Variable.ttf
  #         weight: 700