name: zadam_delivery
description: ZadGo - نظام إدارة توصيل طلبات
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: 3.8.0
  firebase_auth: 5.3.3
  cloud_firestore: 5.5.0
  firebase_messaging: 15.1.5
  # مثبّت على 12.3.6 عمداً: الإصدارات 12.3.7+ تتطلّب firebase_core ^3.8.1،
  # بينما بقية حزم Firebase هنا مثبّتة على إصدارات محدّدة مع firebase_core
  # 3.8.0. ترقية firebase_core كانت ستجرّ ترقية auth وfirestore وmessaging
  # معاً — تغيير واسع لا مبرّر له لإضافة التخزين وحده.
  firebase_storage: 12.3.6

  # تسجيل الانهيارات — مجاني بالكامل على خطة Spark (لا علاقة له بـBlaze).
  #
  # مثبّت على 4.1.5 بالتحقّق لا بالتخمين: هو **آخر** إصدار يشترط
  # `firebase_core ^3.8.0` — وهو بالضبط المثبَّت أعلاه. الإصدار 4.1.6+
  # يقفز إلى `^3.9.0`، و5.x إلى `^4.7.0`، وأيّهما يجرّ ترقية firebase_core
  # ومعها auth وfirestore وmessaging — وهو ما رُفض عمداً عند إضافة
  # firebase_storage للسبب نفسه.
  firebase_crashlytics: 4.1.5

  # اختيار صور الأصناف والمطاعم من الجهاز ورفعها من داخل لوحة الإدارة.
  image_picker: ^1.1.2

  # بوابة الدفع «ميسر» — تدعم mada وVisa وMastercard وApple Pay.
  #
  # مثبّتة على 2.0.16 عمداً: الإصدارات 2.0.17+ (ومنها 3.x) تعتمد
  # webview_flutter ^4.13.0 الذي يتطلّب Dart ‏3.6، بينما البناء هنا على
  # Flutter 3.24.0 = Dart ‏3.5.0. الإصدار 2.0.16 يعتمد webview_flutter
  # ^4.10.0 وهو متوافق مع 3.5.
  #
  # الفروق بين 2.0.16 و3.x لا تمسّ ما نستخدمه: PaymentConfig و
  # CreditCardConfig و CreditCard و PaymentResponse و PaymentStatus
  # متطابقة نصّاً في الإصدارين؛ الإضافات في 3.x هي Samsung Pay و
  # Union Pay وتقسيم المدفوعات — ولا نستعمل شيئاً منها.
  moyasar: 2.0.16

  provider: ^6.1.2

  # نداءات «الخادم المرافق» للإشعارات (lib/providers/notify_relay.dart).
  # النطاق ^1.3.0 يطابق ما تشترطه moyasar نفسها فلا يضيف قيداً جديداً.
  http: ^1.3.0

  # إبقاء شاشة جهاز المطعم مضاءة — الجهاز يعمل «شاشة طلبات» طوال الدوام.
  # مثبّتة على 1.3.3 تحديداً: 1.4.0 تجرّ package_info_plus 9.x التي كسرت
  # بناء أندرويد فعلاً (compileSdkVersion is not specified)، و1.5.0+ تتطلّب
  # Dart 3.10 والبناء هنا على 3.5. هذه تقبل package_info_plus 8.x المتوافقة.
  wakelock_plus: 1.3.3

  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  fl_chart: ^0.69.0

  uuid: ^4.5.1
  intl: ^0.19.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  geolocator: ^13.0.1

  # ⭐ إضافة ضرورية لحل خطأ نقل العنوان
  geocoding: ^2.1.0

  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6

  # تخزين صور الشبكة على القرص (قوائم الأصناف والبنرات) — بدونها تُعاد
  # كل الصور من الشبكة مع كل فتح للتطبيق. مثبّتة على 3.4.1: متوافقة مع
  # Dart 3.5 (تشترط ^3.4) وflutter_cache_manager 3.4.x.
  cached_network_image: 3.4.1

  # كشف انقطاع الاتصال لشريط «لا يوجد اتصال بالإنترنت» — بدونه تظهر أخطاء
  # تقنية أو شاشات فارغة بلا تفسير. مثبّتة على 6.1.0 (تشترط Dart >=3.3).
  connectivity_plus: 6.1.0
  share_plus: ^10.1.2

  # خدمة أمامية تمنع أندرويد من قتل تطبيق الكابتن وهو يقود (دفعة و2).
  #
  # مثبّتة على 9.2.2 بالتحقّق: هو آخر إصدار يقبل قيدنا (Dart 3.5 /
  # Flutter 3.24) — الإصدار 10.0.0 يشترط Flutter أحدث. وتستعملها نكهة
  # الكابتن وحدها، لكن الحزمة في `dependencies` المشتركة لأن pubspec
  # واحد للنكهات الأربع؛ وأثرها على الثلاث الأخرى صفر لأنها لا تُنادى.
  flutter_foreground_task: 9.2.2

  # حركات دخول بسطر واحد (دفعة ز3) — لم تكن في المشروع أي حزمة حركة،
  # وكل الحركة القائمة مكتوبة يدوياً في السبلاش وبطاقة التتبّع. مثبّتة
  # على 4.5.2 (MIT، تقبل Dart >=2.17 فلا قيد علينا). القاعدة المتبعة في
  # استعمالها: حركة **دخول** قصيرة (≤400مللي) عند بناء العنصر أول مرة
  # فقط — لا حركات دائمة تستهلك بطارية ولا تكرار عند كل إعادة بناء.
  flutter_animate: 4.5.2

  # المسارات الحقيقية (دفعة و3): مسافة الطريق وزمنه من openrouteservice
  # بدل الخط المستقيم × ٢٠ كم/س. مثبّتة على 1.2.8 (MIT، تقبل Dart 3.0+).
  # تعمل فقط إن مُرّر ORS_API_KEY وقت البناء — وإلا سقط كل شيء على
  # haversine كما كان، فلا كسر بانتظار المفتاح.
  open_route_service: 1.2.8

  # إشعار محلي بصوت واهتزاز حقيقيين للعروض (دفعة و4) — بدل SystemSound
  # الباهت الذي لا يظهر في لوحة الإشعارات أصلاً. مثبّتة على 19.5.0: آخر
  # إصدار يقبل قيدنا (الأحدث 22.x يشترط Dart 3.10). تتطلب تفعيل
  # desugaring في Gradle — مفعَّل في android/app/build.gradle.
  flutter_local_notifications: 19.5.0

  # هياكل تحميل من الواجهة الحقيقية نفسها (دفعة و5) — تغليف الودجت
  # الفعلي بدل صيانة ودجت هيكل موازٍ يتقادم مع كل تعديل تصميم.
  # مثبّتة على 1.4.3: آخر ما يقبل قيدنا (2.x تشترط Dart 3.7).
  skeletonizer: 1.4.3

  # حركة كاميرا سلسة على خرائط flutter_map (دفعة و5) — بدل قفزة move()
  # الحادة عند إعادة التمركز. متوافقة مع flutter_map 7 المثبّت عندنا.
  flutter_map_animations: 0.10.0

dependency_overrides:
  geolocator_android: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_square.png
    # الشعار الكتابي الرسمي بخلفية شفافة — شاشات البداية لكل النكهات.
    - assets/images/logo_wordmark.png
    # بوستر افتتاح تطبيق العميل (الشعار + السائق + العبارة التسويقية).
    - assets/images/splash_customer.jpg
    # البنر الترويجي الافتراضي — يظهر حين لا بنرات فعّالة من الإدارة.
    - assets/images/banner_promo_1.jpg
    # خلفية افتتاح تطبيق الكابتن (طريق ليلي بهوية النكهة الكحلية).
    - assets/images/bg_splash_driver.jpg
    # خط التصدير (PDF): يبقى الملف المتغيّر مُعلَناً كأصل عادي لأن حزمة
    # pdf تقرؤه مباشرة بـrootBundle ولا تمرّ بنظام خطوط Flutter، فلا
    # يصيبها عطل الأوزان الذي عطّل الخط في الواجهة.
    - assets/fonts/Cairo-Variable.ttf
  fonts:
    # أربعة **ملفات ثابتة** مستخرَجة من الملف المتغيّر (wght مثبَّت وslnt=0)
    # لا ملفٌ واحد مكرَّر بثلاثة أوزان — وذاك التكرار هو ما عطّل رسم النص
    # صامتاً على أندرويد فعُطِّل الخط كلّه، فبقي التطبيق بخط النظام.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800