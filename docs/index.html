<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZadGo — زادقو</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #1a5c46 0%, #0e3a2c 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 560px; }
    h1 { font-size: 3rem; margin-bottom: 12px; letter-spacing: 1px; }
    h1 span { color: #ffc93c; }
    p.tag { font-size: 1.3rem; opacity: .9; margin-bottom: 28px; }
    p.soon {
      display: inline-block;
      background: rgba(255, 201, 60, .15);
      border: 1px solid #ffc93c;
      color: #ffc93c;
      border-radius: 999px;
      padding: 10px 28px;
      font-size: 1.05rem;
    }
    footer { margin-top: 40px; font-size: .85rem; opacity: .6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Zad<span>Go</span> — زادقو</h1>
    <p class="tag">توصيل طلباتك من مطاعمك المفضلة إلى باب بيتك</p>
    <p class="soon">التطبيق قادم قريباً</p>
    <footer>© ZadGo 2026 — zadgo.co</footer>
  </div>
</body>
</html>
