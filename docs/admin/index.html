/* ---------------- عارض المستند ---------------- */
let vRot = 0, vZoom = 1, vUrl = '';
async function openViewer(src, cap) {
  const url = await loadAppDoc(src);
  if (!url) { alert('تعذّر تحميل الصورة'); return; }
  vUrl = url; vRot = 0; vZoom = 1;
  $('vTitle').textContent = cap || '';
  $('vImg').src = url;
  applyView();
  $('viewer').classList.remove('hidden');
}
function applyView() { $('vImg').style.transform = `rotate(${vRot}deg) scale(${vZoom})`; }
document.getElementById('viewer').addEventListener('click', (e) => {
  const b = e.target.closest('[data-v]');
  if (!b) return;
  const a = b.dataset.v;
  if (a === 'rot+') vRot += 90;
  else if (a === 'rot-') vRot -= 90;
  else if (a === 'in') vZoom = Math.min(6, vZoom * 1.35);
  else if (a === 'out') vZoom = Math.max(0.3, vZoom / 1.35);
  else if (a === 'reset') { vRot = 0; vZoom = 1; }
  else if (a === 'close') { $('viewer').classList.add('hidden'); $('vImg').removeAttribute('src'); return; }
  else if (a === 'tab') {
    // فتح data: في تبويب أعلى محظور في المتصفحات — يُحوَّل إلى blob أولاً.
    if (vUrl.startsWith('data:')) {
      const bin = atob(vUrl.split(',')[1]);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([u8], { type: 'image/jpeg' })), '_blank');
    } else window.open(vUrl, '_blank');
    return;
  }
  applyView();
});

/* القبول: الطلب وكود التسجيل في **معاملة واحدة**. تحذير المواصفات صريح —
 * كتابة `issuedCode` بلا إنشاء الكود فعلاً تجعل المتقدّم «مقبولاً» بكودٍ لا
 * يعمل، ولا شيء يكشف ذلك حتى يحاول التسجيل ويفشل. */
async function approveApplication(a) {
  const days = Math.max(0, Math.round(Number(document.getElementById('ap_days').value) || 0));
  let code = makeCode();
  for (let i = 0; i < 5 && S.regCodes.some((c) => c.id === code); i++) code = makeCode();
  if (!confirm(`قبول «${a.name}» وإصدار كود التسجيل ${code}؟`
    + (days > 0 ? `\nصالح ${days} يوماً.` : '\nبلا تاريخ انتهاء.')
    + (a.referredByCode ? `\nكود الداعي ${a.referredByCode} سينتقل معه تلقائياً.` : ''))) return;
  try {
    await runTransaction(db, async (tx) => {
      const aRef = doc(db, 'driver_applications', a.id);
      const cRef = doc(db, 'registrationCodes', code);
      const aSnap = await tx.get(aRef);
      if (!aSnap.exists()) throw new Error('الطلب لم يعد موجوداً');
      if ((aSnap.data().status || 'pending') !== 'pending') throw new Error('عولج هذا الطلب بالفعل — حدّث الصفحة');
      const cSnap = await tx.get(cRef);
      if (cSnap.exists()) throw new Error('تصادم في الكود — أعد المحاولة');
      tx.set(cRef, {
        code, role: 'driver', restaurantId: '', restaurantName: '',
        isUsed: false, createdAt: serverTimestamp(),
        usedAt: null, usedByUid: null, usedByName: null,
        ...(days > 0 ? { expiresAt: Timestamp.fromDate(new Date(Date.now() + days * 86400000)) } : {}),
        // بدونه تضيع مكافأة الداعي بصمت — التطبيق يلتقطه من الكود لا من المتقدّم.
        ...(a.referredByCode ? { referredByCode: a.referredByCode } : {}),
      });
      tx.update(aRef, { status: 'approved', issuedCode: code, reviewedAt: serverTimestamp() });
    });
    audit('application.approve', `قبل طلب «${a.name}» وأصدر الكود ${code}`,
      { target: 'driver_applications/' + a.id });
    toast('قُبل الطلب — الكود ' + code);
    closeModal();
    setTimeout(() => shareCode(code), 250);
  } catch (err) { alert('تعذر القبول: ' + (err.message || err.code)); }
}

async function rejectApplication(a) {
  const reason = (prompt('سبب الرفض (يُعرض للمتقدّم — اكتبه بوضوح):', '') || '').trim();
  if (!reason) { alert('السبب إلزامي — المتقدّم يستحق معرفة ما ينقصه'); return; }
  if (!confirm(`رفض طلب «${a.name}»؟\nالسبب: ${reason}`)) return;
  try {
    await updateDoc(doc(db, 'driver_applications', a.id),
      { status: 'rejected', reviewNote: reason, reviewedAt: serverTimestamp() });
    audit('application.reject', `رفض طلب «${a.name}» — ${reason}`,
      { target: 'driver_applications/' + a.id });
    toast('رُفض الطلب');
    closeModal();
  } catch (err) { alert('تعذر الرفض: ' + (err.code || err.message)); }
}

function renderUsersPage() {
  const filters = [['all', 'الكل'], ['customer', 'العملاء'], ['driver', 'السائقون'],

  if (userFilter !== 'all') list = list.filter((u) => u.role === userFilter);
  if (userSearch) {
    const q2 = userSearch.toLowerCase();
    list = list.filter((u) => [u.name, u.email, u.phone].some((v) => String(v || '').toLowerCase().includes(q2)));
  }
  $('main').innerHTML = `
    <div class="toolbar">
      ${filters.map(([k, l]) => `<button class="chip ${k === userFilter ? 'active' : ''}" data-uf="${k}">${l}</button>`).join('')}
      <input class="search" id="userSearch" placeholder="🔍 بحث بالاسم أو البريد أو الجوال…" value="${esc(userSearch)}">
    </div>
    ${list.map((u) => `
      <div class="card">
        <div class="row1">
          <span class="title">${esc(u.name || '—')}</span>
          <span>${badge(ROLE_AR[u.role] || u.role || '؟', '#2471a3')}
          ${u.isActive === false ? badge('موقوف', '#c0392b') : ''}</span>
        </div>
        <div class="meta">${esc(u.email || '')}${u.phone ? ' — 📞 ' + esc(u.phone) : ''}
          ${u.restaurantName ? '<br>🍽️ ' + esc(u.restaurantName) : ''}
          ${u.createdAt ? '<br>انضم: ' + esc(fmtTime(u.createdAt)) : ''}</div>
        ${u.role !== 'admin' ? `<div class="row1" style="margin-top:8px">
          <button class="toggle-btn ${u.isActive === false ? 'off' : 'on'}" data-utoggle="${u.id}"
            data-active="${u.isActive === false ? 0 : 1}">
            ${u.isActive === false ? 'تفعيل الحساب' : 'إيقاف الحساب'}</button>
          ${u.email ? `<button class="toggle-btn" data-ureset="${esc(u.email)}">🔑 رابط استعادة كلمة المرور</button>` : ''}
        </div>` : ''}
      </div>`).join('') || '<div class="empty">لا يوجد مستخدمون مطابقون</div>'}`;

  /* استعادة كلمة المرور — «نسيت كلمة المرور» أكثر مكالمات الدعم تكراراً،
   * وكانت اللوحة تعجز عنها فيضطر المالك لفتح كونسول Firebase.
   *
   * الرابط يذهب لصندوق المستخدم لا للمالك: لا كلمة مرور تُقرأ ولا تُملى
   * صوتياً، ولا يستطيع المالك دخول حساب غيره — يفتحه صاحبه وحده. */
  $('main').querySelectorAll('[data-ureset]').forEach((b) => b.addEventListener('click', async () => {
    const email = b.dataset.ureset;
    if (!confirm(`إرسال رابط استعادة كلمة المرور إلى:\n${email}\n\nيصل الرابط لصندوقه هو، ولا يمكنك قراءة كلمته.`)) return;
    b.disabled = true;
    try {
      await sendPasswordResetEmail(auth, email);
      audit('user.reset', `أرسل رابط استعادة كلمة المرور إلى ${email}`, { target: 'auth/' + email });
      toast('أُرسل الرابط — تحقّق معه من صندوق البريد والمهملات');
    } catch (err) {
      const m = { 'auth/user-not-found': 'لا يوجد حساب دخول بهذا البريد — قد يكون سجّل برقم جواله',
        'auth/invalid-email': 'صيغة البريد غير صحيحة',
        'auth/too-many-requests': 'محاولات كثيرة متتالية — انتظر دقائق' }[err.code];
      alert(m || ('تعذر الإرسال: ' + (err.code || err.message)));
    }
    b.disabled = false;
  }));

  $('main').querySelectorAll('[data-uf]').forEach((b) =>
    b.addEventListener('click', () => { userFilter = b.dataset.uf; renderUsersPage(); }));
  const si = $('userSearch');
  si.addEventListener('input', () => {
    userSearch = si.value; renderUsersPage();
    const ni = $('userSearch'); ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length);
  });
  $('main').querySelectorAll('[data-utoggle]').forEach((b) => b.addEventListener('click', async () => {
    const activating = b.dataset.active !== '1';
    if (!confirm(activating ? 'تفعيل هذا الحساب؟' : 'إيقاف هذا الحساب عن استخدام التطبيق؟')) return;
    try {
      await updateDoc(doc(db, 'users', b.dataset.utoggle), { isActive: activating });
      const u = S.users.find((x) => x.id === b.dataset.utoggle) || {};
      audit('user.toggle', `${activating ? 'فعّل' : 'أوقف'} المستخدم «${u.name || u.phone || b.dataset.utoggle}»`,
        { target: 'users/' + b.dataset.utoggle });
      toast('تم التحديث');
    }
    catch (err) { alert('تعذر التعديل: ' + (err.code || err.message)); }
  }));
}

/* محادثة الشكوى — نفس المجموعة التي يقرؤها التطبيق (`complaint_messages`).
 *
 * انتبه: حقل الربط اسمه `orderId` لكنه يحمل **معرّف الشكوى** لا الطلب —
 * تسمية قديمة أُبقيت كما هي لأن التطبيق يقرأ بها؛ تغييرها هنا وحدها يقطع
 * الخيط بين اللوحتين.
 *
 * تُشترك المحادثة لحظياً عند الفتح فقط، وتُلغى عند الإغلاق: لا داعي لإبقاء
 * مستمع مفتوح على كل شكوى في الخلفية.
 */
function openComplaintChat(complaintId) {
  const c = S.complaints.find((x) => x.id === complaintId);
  openModal(`
    <h3>محادثة الشكوى${c?.orderNumber ? ` — طلب #${esc(c.orderNumber)}` : ''}</h3>
    <p class="meta">${esc(c?.customerName || '')}${c?.description ? ` — «${esc(c.description)}»` : ''}</p>
    <div id="chatBox" style="max-height:46vh;overflow-y:auto;margin:12px 0">
      <div class="meta">…جارٍ التحميل</div>
    </div>
    <div class="field"><textarea id="chatText" rows="3" placeholder="اكتب ردّك على مقدّم الشكوى…"></textarea></div>
    <button class="btn block" id="chatSend">إرسال الرد</button>
  `);

  if (chatUnsub) { try { chatUnsub(); } catch (_) {} }
  chatUnsub = onSnapshot(
    query(collection(db, 'complaint_messages'), where('orderId', '==', complaintId)),
    (qs) => {
      const box = document.getElementById('chatBox');
      if (!box) return;
      const rows = qs.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (da ? da.getTime() : 0) - (dbb ? dbb.getTime() : 0);
        });
      box.innerHTML = rows.map((m) => {
        const mine = m.senderRole === 'admin';
        return `
          <div style="margin:8px 0;display:flex;justify-content:${mine ? 'flex-start' : 'flex-end'}">
            <div style="max-width:82%;background:${mine ? '#e8f0fb' : '#eef2f0'};
                        border-radius:14px;padding:10px 14px">
              <div class="meta" style="margin-bottom:2px">
                ${esc(m.senderName || (mine ? 'الإدارة' : 'المستخدم'))} · ${esc(fmtTime(m.createdAt))}</div>
              <div>${esc(m.text || '')}</div>
            </div>
          </div>`;
      }).join('') || '<div class="empty">لا رسائل بعد — ابدأ بالرد</div>';
      box.scrollTop = box.scrollHeight;
    },
    (err) => {
      const box = document.getElementById('chatBox');
      if (box) box.innerHTML = `<div class="meta" style="color:var(--red)">تعذّر تحميل المحادثة: ${esc(err.code || err.message)}</div>`;
    });

  document.getElementById('chatSend').addEventListener('click', async () => {
    const ta = document.getElementById('chatText');
    const text = ta.value.trim();
    if (!text) { alert('اكتب نص الرد'); return; }
    try {
      await addDoc(collection(db, 'complaint_messages'), {
        orderId: complaintId,          // معرّف الشكوى — انظر التعليق أعلاه
        senderId: adminUser.uid,
        senderName: adminUser.name || 'الإدارة',
        senderRole: 'admin',
        text,
        createdAt: serverTimestamp(),
      });
      ta.value = '';
      audit('complaint.reply', `ردّ على شكوى الطلب #${c?.orderNumber || ''}: ${text}`,
        { target: 'complaints/' + complaintId });
      // الرد يعني أن الشكوى قيد المعالجة فعلاً — نرفعها من «مفتوحة» تلقائياً.
      if (c && c.status === 'open') {
        await updateDoc(doc(db, 'complaints', complaintId), { status: 'inProgress' });
      }
    } catch (err) { alert('تعذر الإرسال: ' + (err.code || err.message)); }
  });
}

/* ================= رسالة جماعية ================= */
/* ================= إدارة المنيو =================
 *
 * الأصناف والأقسام مجموعات فرعية تحت المطعم:
 *   restaurants/{rid}/categories/{cid}  و  restaurants/{rid}/items/{iid}
 *
 * تُحمَّل لمطعم **واحد** عند اختياره لا لكل المطاعم معاً — منيو واحد قد يبلغ
 * مئات الأصناف، وتحميلها كلها في الخلفية يُثقل اللوحة ويُفوتر قراءات بلا داعٍ.
 * المستمعان يُلغيان عند تبديل المطعم أو مغادرة الصفحة.
 *
 * الكتابة تطابق شكل أداة الاستيراد حقلاً بحقل — فما يُعدَّل هنا وما يُستورد
 * هناك ينتجان نفس المستند تماماً.
 */
function stopMenuListeners() {
  menuUnsub.forEach((u) => { try { u(); } catch (_) {} });
  menuUnsub = [];
}

function loadMenu(rid) {
  stopMenuListeners();
  menuRid = rid; menuCats = []; menuItems = [];
  if (!rid) { renderMenuPage(); return; }
  menuUnsub.push(onSnapshot(collection(db, 'restaurants', rid, 'categories'),
    (qs) => { menuCats = qs.docs.map((d) => ({ id: d.id, ...d.data() })); if (page === 'menu') renderMenuPage(); },
    (err) => console.error('categories', err)));
  menuUnsub.push(onSnapshot(collection(db, 'restaurants', rid, 'items'),
    (qs) => { menuItems = qs.docs.map((d) => ({ id: d.id, ...d.data() })); if (page === 'menu') renderMenuPage(); },
    (err) => console.error('items', err)));
}

function renderMenuPage() {
  const restOptions = [...S.restaurants]
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'))
    .map((r) => `<option value="${esc(r.id)}" ${r.id === menuRid ? 'selected' : ''}>${esc(restName(r))}</option>`).join('');

  const cats = [...menuCats].sort((a, b) => (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0));
  const unavailable = menuItems.filter((i) => i.isAvailable === false).length;

  $('main').innerHTML = `
    <div class="panel">
      <div class="field"><label>المطعم</label>
        <select id="menuRest"><option value="">— اختر مطعماً —</option>${restOptions}</select></div>
      ${menuRid ? `
        <div class="kpi-grid">
          <div class="kpi"><div class="num">${menuItems.length}</div><div class="lbl">صنف</div></div>
          <div class="kpi"><div class="num">${cats.length}</div><div class="lbl">قسم</div></div>
          <div class="kpi" style="border-color:${unavailable ? '#ca6f1e' : 'var(--green)'}">
            <div class="num">${unavailable}</div><div class="lbl">غير متوفر</div></div>
        </div>
        <div class="row1" style="margin-top:12px;gap:6px">
          <button class="toggle-btn on" id="addItemBtn">➕ صنف جديد</button>
          <button class="toggle-btn" id="addCatBtn">➕ قسم جديد</button>
          <button class="toggle-btn" data-page="import">📥 استيراد منيو كامل</button>
        </div>` : '<p class="meta">اختر مطعماً لعرض منيوه وتعديله.</p>'}
    </div>
    ${menuRid ? cats.map((c) => {
      const items = menuItems.filter((i) => i.categoryId === c.id)
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      return `
        <div class="panel">
          <div class="row1" style="margin-bottom:8px">
            <h3 style="margin:0">${esc(c.name || 'قسم')} <span class="meta">(${items.length})</span></h3>
            <button class="toggle-btn" data-catedit="${esc(c.id)}">✎ تعديل</button>
          </div>
          ${items.map((i) => `
            <div class="card">
              <div class="row1">
                <span class="title">${esc(i.emoji || '🍽️')} ${esc(i.name || '')}</span>
                ${i.isAvailable === false ? badge('نفد', '#c0392b') : badge('متوفر', '#1e8449')}
              </div>
              <div class="meta">
                <b>${fmtMoney(i.price)} ${SAR}</b>
                ${i.kcal ? ` · ${Number(i.kcal)} سعرة` : ''}
                ${i.imageUrl ? ' · 🖼️ بصورة' : ' · بلا صورة'}
                ${i.description ? `<br>${esc(i.description)}` : ''}
              </div>
              <div class="row1" style="margin-top:8px;gap:6px">
                <button class="toggle-btn ${i.isAvailable === false ? 'on' : ''}" data-itoggle="${esc(i.id)}">
                  ${i.isAvailable === false ? '▶️ أعده للتوفر' : '⏸ نفد الصنف'}</button>
                <button class="toggle-btn" data-iedit="${esc(i.id)}">✎ تعديل</button>
                <button class="toggle-btn" data-idel="${esc(i.id)}">🗑</button>
              </div>
            </div>`).join('') || '<div class="empty">لا أصناف في هذا القسم</div>'}
        </div>`;
    }).join('') : ''}
    ${menuRid && !cats.length ? '<div class="panel"><div class="empty">لا أقسام بعد — أضف قسماً أو استورد منيو كاملاً</div></div>' : ''}`;

  document.getElementById('menuRest').addEventListener('change', (e) => loadMenu(e.target.value));
  const ai = document.getElementById('addItemBtn');
  if (ai) ai.addEventListener('click', () => openItemForm(null));
  const ac = document.getElementById('addCatBtn');
  if (ac) ac.addEventListener('click', () => openCatForm(null));
  $('main').querySelectorAll('[data-iedit]').forEach((b) =>
    b.addEventListener('click', () => openItemForm(b.dataset.iedit)));
  $('main').querySelectorAll('[data-itoggle]').forEach((b) =>
    b.addEventListener('click', () => toggleItem(b.dataset.itoggle)));
  $('main').querySelectorAll('[data-idel]').forEach((b) =>
    b.addEventListener('click', () => deleteItem(b.dataset.idel)));
  $('main').querySelectorAll('[data-catedit]').forEach((b) =>
    b.addEventListener('click', () => openCatForm(b.dataset.catedit)));
}

/* اسم المطعم المفتوح في صفحة المنيو — يُذكر في سجل التدقيق حتى لا يصير
 * القيد «أضاف صنف جبن» بلا معرفة أي مطعم. */
function menuRestName() {
  const r = S.restaurants.find((x) => x.id === menuRid);
  return r ? restName(r) : menuRid;
}

function openCatForm(catId) {
  const c = catId ? menuCats.find((x) => x.id === catId) : null;
  openModal(`
    <h3>${c ? 'تعديل قسم' : 'قسم جديد'}</h3>
    <div class="field"><label>اسم القسم</label>
      <input id="ct_name" value="${esc(c?.name || '')}" placeholder="الفطائر الحلوة"></div>
    <div class="field"><label>الترتيب (الأصغر أولاً)</label>
      <input id="ct_order" type="number" step="1" value="${Number(c?.sortOrder) || menuCats.length}"></div>
    <button class="btn block" id="ct_save">حفظ</button>
    ${c ? '<button class="btn block danger" id="ct_del" style="margin-top:8px">🗑 حذف القسم</button>' : ''}
  `);
  document.getElementById('ct_save').addEventListener('click', async () => {
    const name = document.getElementById('ct_name').value.trim();
    const sortOrder = Math.round(Number(document.getElementById('ct_order').value) || 0);
    if (!name) { alert('اكتب اسم القسم'); return; }
    try {
      if (c) {
        await updateDoc(doc(db, 'restaurants', menuRid, 'categories', c.id), { name, sortOrder });
      } else {
        await addDoc(collection(db, 'restaurants', menuRid, 'categories'),
          { name, restaurantId: menuRid, sortOrder });
      }
      audit('menu.category', `${c ? 'عدّل' : 'أضاف'} قسم «${name}» في ${menuRestName()}`,
        { target: 'restaurants/' + menuRid });
      toast('حُفظ القسم'); closeModal();
    } catch (err) { alert('تعذر الحفظ: ' + (err.code || err.message)); }
  });
  const del = document.getElementById('ct_del');
  if (del) del.addEventListener('click', async () => {
    const n = menuItems.filter((i) => i.categoryId === c.id).length;
    if (n) { alert(`لا يمكن حذف قسم فيه ${n} صنفاً.\nانقل أصنافه أو احذفها أولاً.`); return; }
    if (!confirm(`حذف القسم «${c.name}»؟`)) return;
    try {
      await deleteDoc(doc(db, 'restaurants', menuRid, 'categories', c.id));
      audit('menu.category', `حذف قسم «${c.name}» من ${menuRestName()}`, { target: 'restaurants/' + menuRid });
      toast('حُذف القسم'); closeModal();
    } catch (err) { alert('تعذر الحذف: ' + (err.code || err.message)); }
  });
}

function openItemForm(itemId) {
  const i = itemId ? menuItems.find((x) => x.id === itemId) : null;
  const catOptions = [...menuCats]
    .sort((a, b) => (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0))
    .map((c) => `<option value="${esc(c.id)}" ${c.id === i?.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  if (!menuCats.length) { alert('أضف قسماً أولاً — كل صنف ينتمي إلى قسم'); return; }
  openModal(`
    <h3>${i ? 'تعديل صنف' : 'صنف جديد'}</h3>
    <div class="field"><label>القسم</label><select id="it_cat">${catOptions}</select></div>
    <div class="field"><label>الاسم</label>
      <input id="it_name" value="${esc(i?.name || '')}" placeholder="فطيرة جبن"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div class="field"><label>السعر (${SAR})</label>
        <input id="it_price" type="number" min="0" step="any" value="${Number(i?.price) || ''}"></div>
      <div class="field"><label>السعرات (اختياري)</label>
        <input id="it_kcal" type="number" min="0" step="1" value="${i?.kcal ?? ''}"></div>
    </div>
    <div class="field"><label>الوصف (اختياري)</label>
      <input id="it_desc" value="${esc(i?.description || '')}"></div>
    <div class="field"><label>رابط الصورة (اختياري)</label>
      <input id="it_img" value="${esc(i?.imageUrl || '')}" style="direction:ltr;text-align:left"
             placeholder="https://zadgo.co/images/item.jpg"></div>
    <div class="field"><label>الرمز التعبيري (اختياري)</label>
      <input id="it_emoji" value="${esc(i?.emoji || '')}" maxlength="4" placeholder="🥐"></div>
    <button class="btn block" id="it_save">حفظ</button>
  `);
  document.getElementById('it_save').addEventListener('click', async () => {
    const name = document.getElementById('it_name').value.trim();
    const price = Number(document.getElementById('it_price').value);
    const kcalRaw = document.getElementById('it_kcal').value.trim();
    const categoryId = document.getElementById('it_cat').value;
    const imageUrl = document.getElementById('it_img').value.trim();
    if (!name) { alert('اكتب اسم الصنف'); return; }
    if (!(price > 0)) { alert('أدخل سعراً أكبر من صفر'); return; }
    if (imageUrl && !/^https:\/\/\S+$/i.test(imageUrl)) { alert('رابط الصورة يجب أن يبدأ بـ https://'); return; }
    // نفس الحقول التي تكتبها أداة الاستيراد — فلا يختلف صنف مُعدَّل عن مُستورَد.
    const payload = {
      restaurantId: menuRid, categoryId, name, price,
      description: document.getElementById('it_desc').value.trim(),
      emoji: document.getElementById('it_emoji').value.trim(),
      imageUrl: imageUrl || null,
      kcal: kcalRaw === '' ? null : Math.round(Number(kcalRaw) || 0),
    };
    try {
      if (i) {
        await updateDoc(doc(db, 'restaurants', menuRid, 'items', i.id), payload);
      } else {
        await addDoc(collection(db, 'restaurants', menuRid, 'items'),
          { ...payload, isAvailable: true, trackStock: false, totalSold: 0 });
      }
      audit('menu.item', `${i ? 'عدّل' : 'أضاف'} صنف «${name}» بسعر ${fmtMoney(price)} ${SAR} في ${menuRestName()}`,
        { target: 'restaurants/' + menuRid, amount: price });
      toast('حُفظ الصنف'); closeModal();
    } catch (err) { alert('تعذر الحفظ: ' + (err.code || err.message)); }
  });
}

/* «نفد الصنف» يخفيه عن العميل فوراً دون حذفه — أهم زر في الصفحة عملياً،
 * فالمطعم ينفد منه صنف يومياً ويعود غداً. */
async function toggleItem(itemId) {
  const i = menuItems.find((x) => x.id === itemId);
  if (!i) return;
  try {
    await updateDoc(doc(db, 'restaurants', menuRid, 'items', itemId),
      { isAvailable: i.isAvailable === false });
    audit('menu.item', `${i.isAvailable === false ? 'أعاد توفّر' : 'أخفى'} صنف «${i.name || ''}» في ${menuRestName()}`,
      { target: 'restaurants/' + menuRid });
    toast(i.isAvailable === false ? 'عاد الصنف للتوفر' : 'أُخفي الصنف عن العملاء');
  } catch (err) { alert('تعذر التغيير: ' + (err.code || err.message)); }
}

async function deleteItem(itemId) {
  const i = menuItems.find((x) => x.id === itemId);
  if (!confirm(`حذف «${i?.name}» نهائياً؟\n(«نفد الصنف» يخفيه مؤقتاً دون فقدانه — وهو الأنسب غالباً)`)) return;
  try {
    await deleteDoc(doc(db, 'restaurants', menuRid, 'items', itemId));
    audit('menu.item', `حذف صنف «${i?.name || itemId}» من ${menuRestName()}`, { target: 'restaurants/' + menuRid });
    toast('حُذف الصنف');
  } catch (err) { alert('تعذر الحذف: ' + (err.code || err.message)); }
}

/* ================= أكواد التسجيل =================
 *
 * حسابا السائق ومدير المطعم لا يُنشآن بتسجيل ذاتي — يحتاجان كوداً تُصدره
 * الإدارة. هذا قرار تصميمي مقصود: القبول إداري لا ذاتي.
 *
 * أبجدية الكود بلا 0/O و1/I/L — الحروف الملتبسة تُقرأ خطأً حين يُملى الكود
 * صوتياً أو يُنسخ من صورة، فيشتكي المتقدّم أن «الكود لا يعمل».
 *
 * `referredByCode` يُحمَّل على الكود نفسه عند إصداره لطلب انضمام، فيلتقطه
 * التطبيق تلقائياً عند التسجيل ولا تضيع مكافأة الداعي إن نسي المتقدّم نقلها.
 */
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

function makeCode(len = 6) {
  const a = new Uint32Array(len);
  crypto.getRandomValues(a);
  return Array.from(a, (n) => CODE_ALPHABET[n % CODE_ALPHABET.length]).join('');
}

function codeState(c) {
  if (c.isUsed) return ['مُستخدم', '#7f8c8d'];
  const exp = toDate(c.expiresAt);
  if (exp && exp < new Date()) return ['منتهي', '#c0392b'];
  return ['صالح', '#1e8449'];
}

function renderCodesPage() {
  const filters = [['unused', 'الصالحة'], ['all', 'الكل'], ['used', 'المستخدمة']];
  let list = [...S.regCodes].sort((a, b) => {
    const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
    return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
  });
  if (codeFilter === 'unused') list = list.filter((c) => codeState(c)[0] === 'صالح');
  if (codeFilter === 'used') list = list.filter((c) => c.isUsed);

  const valid = S.regCodes.filter((c) => codeState(c)[0] === 'صالح').length;

  $('main').innerHTML = `
    <div class="panel">
      <div class="row1" style="margin-bottom:10px">
        <h3 style="margin:0">أكواد التسجيل</h3>
        <button class="btn" id="newCodeBtn">➕ توليد كود</button>
      </div>
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${valid}</div><div class="lbl">كود صالح</div></div>
        <div class="kpi"><div class="num">${S.regCodes.filter((c) => c.isUsed).length}</div><div class="lbl">استُخدم</div></div>
      </div>
      <p class="meta" style="margin-top:10px">حسابا السائق ومدير المطعم لا يُنشآن إلا بكود من هنا — لا تسجيل ذاتي.</p>
      <div class="toolbar" style="margin-top:10px">${filters.map(([k, l]) =>
        `<button class="chip ${codeFilter === k ? 'active' : ''}" data-kf="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="panel">
      ${list.map((c) => {
        const [stTxt, stColor] = codeState(c);
        const exp = toDate(c.expiresAt);
        return `
          <div class="card">
            <div class="row1">
              <span class="title" style="direction:ltr;display:inline-block;letter-spacing:2px">${esc(c.id)}</span>
              ${badge(stTxt, stColor)}
            </div>
            <div class="meta">
              الدور: <b>${c.role === 'driver' ? 'سائق' : c.role === 'restaurantManager' ? 'مدير مطعم' : esc(c.role || '—')}</b>
              ${c.restaurantName ? ` · ${esc(c.restaurantName)}` : ''}
              <br>أُنشئ: ${esc(fmtTime(c.createdAt))}
              ${exp ? ` · ينتهي: ${esc(fmtTime(c.expiresAt))}` : ' · بلا انتهاء'}
              ${c.isUsed ? `<br>استخدمه: ${esc(c.usedByName || '—')} في ${esc(fmtTime(c.usedAt))}` : ''}
              ${c.referredByCode ? `<br>إحالة من: <b style="direction:ltr;display:inline-block">${esc(c.referredByCode)}</b>` : ''}
            </div>
            ${!c.isUsed ? `
              <div class="row1" style="margin-top:8px;gap:6px">
                <button class="toggle-btn" data-kshare="${esc(c.id)}">📤 نسخ نص الدعوة</button>
                <button class="toggle-btn" data-kdel="${esc(c.id)}">🗑 حذف</button>
              </div>` : ''}
          </div>`;
      }).join('') || '<div class="empty">لا توجد أكواد في هذا التصنيف</div>'}
    </div>`;

  document.querySelectorAll('[data-kf]').forEach((b) =>
    b.addEventListener('click', () => { codeFilter = b.dataset.kf; renderCodesPage(); }));
  document.getElementById('newCodeBtn').addEventListener('click', openCodeForm);
  $('main').querySelectorAll('[data-kshare]').forEach((b) =>
    b.addEventListener('click', () => shareCode(b.dataset.kshare)));
  $('main').querySelectorAll('[data-kdel]').forEach((b) =>
    b.addEventListener('click', () => deleteCode(b.dataset.kdel)));
}

function openCodeForm() {
  const restOptions = [...S.restaurants]
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'))
    .map((r) => `<option value="${esc(r.id)}">${esc(restName(r))}</option>`).join('');
  openModal(`
    <h3>توليد كود تسجيل</h3>
    <div class="field"><label>الدور</label>
      <select id="k_role">
        <option value="driver">سائق (كابتن)</option>
        <option value="restaurantManager">مدير مطعم</option>
      </select></div>
    <div class="field" id="k_rest_wrap" style="display:none"><label>المطعم</label>
      <select id="k_rest"><option value="">—</option>${restOptions}</select>
      <p class="meta">يُربط مدير المطعم بهذا الفرع تلقائياً عند تسجيله.</p></div>
    <div class="field"><label>صلاحية الكود</label>
      <select id="k_exp">
        <option value="7">7 أيام</option>
        <option value="30">30 يوماً</option>
        <option value="3">3 أيام</option>
        <option value="0">بلا انتهاء</option>
      </select></div>
    <div class="field"><label>كود الداعي (اختياري)</label>
      <input id="k_ref" placeholder="A1B2C3" style="direction:ltr;text-align:left" maxlength="6">
      <p class="meta">إن كان هذا الكابتن جاء بدعوة كابتن آخر، ضع كوده هنا فتنتقل الإحالة تلقائياً عند تسجيله.</p></div>
    <button class="btn block" id="k_save">توليد الكود</button>
  `);
  const role = document.getElementById('k_role');
  const wrap = document.getElementById('k_rest_wrap');
  const sync = () => { wrap.style.display = role.value === 'restaurantManager' ? '' : 'none'; };
  role.addEventListener('change', sync); sync();
  document.getElementById('k_save').addEventListener('click', saveCode);
}

async function saveCode() {
  const role = document.getElementById('k_role').value;
  const restaurantId = role === 'restaurantManager' ? document.getElementById('k_rest').value : '';
  const days = Number(document.getElementById('k_exp').value);
  const ref = document.getElementById('k_ref').value.trim().toUpperCase();
  if (role === 'restaurantManager' && !restaurantId) { alert('اختر المطعم'); return; }
  if (ref && !/^[A-Z0-9]{4,8}$/.test(ref)) { alert('كود الداعي غير صحيح'); return; }

  const r = S.restaurants.find((x) => x.id === restaurantId);
  // تصادم الكود مستبعد لكنه ممكن — نولّد بديلاً بدل الكتابة فوق كود قائم.
  let code = makeCode();
  for (let i = 0; i < 5 && S.regCodes.some((c) => c.id === code); i++) code = makeCode();

  const expiresAt = days > 0
    ? Timestamp.fromDate(new Date(Date.now() + days * 86400000)) : null;
  try {
    await setDoc(doc(db, 'registrationCodes', code), {
      code, role,
      restaurantId, restaurantName: r ? restName(r) : '',
      isUsed: false,
      createdAt: serverTimestamp(),
      usedAt: null, usedByUid: null, usedByName: null,
      ...(expiresAt ? { expiresAt } : {}),
      ...(ref ? { referredByCode: ref } : {}),
    });
    audit('code.create', `أصدر كود تسجيل ${code} لـ${role === 'restaurantManager' ? 'مدير مطعم' : 'كابتن'}`
      + (r ? ` — ${restName(r)}` : '') + (days > 0 ? ` (صالح ${days} يوماً)` : ' (بلا انتهاء)'),
      { target: 'registrationCodes/' + code });
    closeModal();
    toast('أُنشئ الكود ' + code);
    setTimeout(() => shareCode(code), 200);
  } catch (err) { alert('تعذر التوليد: ' + (err.code || err.message)); }
}

/* نصّ دعوة جاهز للّصق في واتساب — أوفر من إملاء الكود صوتياً. */
function shareCode(code) {
  const c = S.regCodes.find((x) => x.id === code) || { id: code };
  const roleAr = c.role === 'restaurantManager' ? 'مدير مطعم' : 'كابتن';
  const exp = toDate(c.expiresAt);
  const text = `مرحباً بك في زادقو ZadGo 👋
كود تسجيلك ك${roleAr}:

${code}

حمّل التطبيق، واختر «لدي كود تسجيل»، وأدخل الكود أعلاه.${exp ? `\nالكود صالح حتى ${fmtTime(c.expiresAt)}.` : ''}`;
  openModal(`
    <h3>نص الدعوة</h3>
    <div class="field"><textarea id="k_text" rows="9" style="direction:rtl">${esc(text)}</textarea></div>
    <button class="btn block" id="k_copy">📋 نسخ النص</button>
    <p class="meta" style="margin-top:8px">الصقه في واتساب وأرسله للمتقدّم.</p>

  document.getElementById('k_copy').addEventListener('click', () => {

      .then(() => toast('نُسخ النص'))
      .catch(() => toast('حدّد النص وانسخه يدوياً'));

}

async function deleteCode(code) {
  if (!confirm(`حذف الكود ${code}؟\n(إن كنتَ أرسلته لأحد فلن يعمل بعد الحذف)`)) return;
  try {
    await deleteDoc(doc(db, 'registrationCodes', code));
    audit('code.delete', `حذف كود التسجيل ${code}`, { target: 'registrationCodes/' + code });
    toast('حُذف الكود');

}

 *
 * رصيد العميل في `users.walletBalance`، ودفتره في `wallet_transactions`.
 * القاعدة نفسها المطبَّقة على دفتر السائق: **لا رصيد بلا حركة تفسّره** —
 * فالتسوية اليدوية هنا تُنفَّذ داخل معاملة ذرّية تكتب الاثنين معاً.
 */
const WALLET_TYPE_AR = {
  refund: ['استرداد شكوى', '#1e8449'],
  orderPayment: ['دفع طلب', '#ca6f1e'],
  orderReversal: ['إعادة رصيد (إلغاء)', '#2471a3'],
  adjustment: ['تسوية يدوية', '#8e44ad'],
};

function renderWalletsPage() {
  const q = walletSearch.trim();
  let list = S.users.filter((u) => (u.role || 'customer') === 'customer');
  if (q) {
    list = list.filter((u) => [u.name, u.email, u.phone]
      .some((v) => String(v || '').toLowerCase().includes(q.toLowerCase())));
  }
  // الأصحاب رصيداً أولاً — هم من يحتاجون النظر.
  list = list.sort((a, b) => (Number(b.walletBalance) || 0) - (Number(a.walletBalance) || 0));

  const totalHeld = S.users.reduce((s, u) => s + (Number(u.walletBalance) || 0), 0);
  const withBalance = S.users.filter((u) => (Number(u.walletBalance) || 0) > 0.009).length;

  $('main').innerHTML = `
    <div class="panel">
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${fmtMoney(totalHeld)}</div>
          <div class="lbl">إجمالي أرصدة العملاء (${SAR})</div></div>
        <div class="kpi"><div class="num">${withBalance}</div><div class="lbl">عميل له رصيد</div></div>
      </div>
      <p class="meta" style="margin-top:10px">إجمالي الأرصدة <b>التزام عليك</b> — مال للعملاء عندك يُنفَق على طلبات قادمة.</p>
      <div class="toolbar" style="margin-top:10px">
        <input class="search" id="walletSearch" placeholder="🔍 بحث بالاسم أو الجوال أو البريد…" value="${esc(walletSearch)}">
      </div>
    </div>
    <div class="panel">
      ${list.slice(0, 60).map((u) => {
        const bal = Number(u.walletBalance) || 0;
        const count = S.walletTxns.filter((t) => t.userId === u.id).length;
        return `
          <div class="card">
            <div class="row1">
              <span class="title">${esc(u.name || 'عميل')}</span>
              ${bal > 0.009 ? badge(`${fmtMoney(bal)} ${SAR}`, '#1e8449') : badge('بلا رصيد', '#7f8c8d')}
            </div>
            <div class="meta">${esc(u.phone || u.email || '')}${count ? ` · ${count} حركة` : ''}</div>
            <div class="row1" style="margin-top:8px;gap:6px">
              <button class="toggle-btn" data-wtxns="${esc(u.id)}">📒 دفتر المحفظة</button>
              <button class="toggle-btn" data-wadjust="${esc(u.id)}">⚖️ تسوية يدوية</button>
            </div>
          </div>`;
      }).join('') || '<div class="empty">لا توجد نتائج</div>'}
      ${list.length > 60 ? `<div class="meta" style="text-align:center">تُعرض أول 60 من ${list.length} — استخدم البحث</div>` : ''}
    </div>`;

  const si = document.getElementById('walletSearch');
  si.addEventListener('input', () => {
    walletSearch = si.value;
    renderWalletsPage();
    const n = document.getElementById('walletSearch');
    n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  });
  $('main').querySelectorAll('[data-wtxns]').forEach((b) =>
    b.addEventListener('click', () => openWalletLedger(b.dataset.wtxns)));
  $('main').querySelectorAll('[data-wadjust]').forEach((b) =>
    b.addEventListener('click', () => openWalletAdjust(b.dataset.wadjust)));
}

function openWalletLedger(userId) {
  const u = S.users.find((x) => x.id === userId);
  const rows = S.walletTxns.filter((t) => t.userId === userId)
    .sort((a, b) => {
      const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
      return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
    });
  openModal(`
    <h3>دفتر محفظة ${esc(u?.name || 'عميل')}</h3>

        <div class="card">
          <div class="row1">
            <span class="title" style="color:${amt >= 0 ? 'var(--ok)' : 'var(--orange)'}">
              ${amt >= 0 ? '+' : '−'} ${fmtMoney(Math.abs(amt))} ${SAR}</span>
            ${badge(lbl, color)}
          </div>

            الرصيد بعدها: ${fmtMoney(t.balanceAfter)} ${SAR}
            ${t.orderNumber ? ` · طلب #${esc(t.orderNumber)}` : ''}

function openWalletAdjust(userId) {
  const u = S.users.find((x) => x.id === userId);
  if (!u) return;
  const bal = Number(u.walletBalance) || 0;
  openModal(`
    <h3>تسوية محفظة ${esc(u.name || 'عميل')}</h3>
    <div class="kv"><span>الرصيد الحالي</span><b class="money">${fmtMoney(bal)} ${SAR}</b></div>
    <div class="field"><label>المبلغ (موجب يزيد، سالب ينقص)</label>
      <input id="wa_amount" type="number" step="any" placeholder="25 أو -10"></div>
    <div class="field"><label>السبب (إلزامي — يبقى في الدفتر)</label>
      <input id="wa_note" placeholder="تعويض عن تأخر طلب #1042"></div>
    <button class="btn block" id="wa_save">تسجيل التسوية</button>
    <p class="meta" style="margin-top:8px">تُكتب حركة دائمة لا تُعدَّل ولا تُحذف — التصحيح بتسوية جديدة.</p>
  `);
  document.getElementById('wa_save').addEventListener('click', async () => {
    const amount = Number(document.getElementById('wa_amount').value);
    const note = document.getElementById('wa_note').value.trim();
    if (!amount) { alert('أدخل مبلغاً غير صفري'); return; }
    if (!note) { alert('اكتب سبب التسوية — يبقى في الدفتر للمراجعة'); return; }
    const after = bal + amount;
    if (after < -0.009) { alert('التسوية تجعل الرصيد سالباً — غير مسموح'); return; }
    if (!confirm(`${amount > 0 ? 'إضافة' : 'خصم'} ${fmtMoney(Math.abs(amount))} ${SAR}؟\nالرصيد بعدها: ${fmtMoney(after)} ${SAR}`)) return;
    try {
      await runTransaction(db, async (tx) => {
        const ref = doc(db, 'users', userId);
        const snap = await tx.get(ref);
        const cur = Number(snap.data()?.walletBalance) || 0;
        const nb = cur + amount;
        if (nb < -0.009) throw new Error('تغيّر الرصيد — أعد المحاولة');
        tx.update(ref, { walletBalance: nb });
        tx.set(doc(collection(db, 'wallet_transactions')), {
          userId, type: 'adjustment', amount, balanceAfter: nb,
          note, createdAt: serverTimestamp(),
        });
      });
      audit('wallet.adjust', `${amount > 0 ? 'أضاف' : 'خصم'} ${fmtMoney(Math.abs(amount))} ${SAR} `
        + `من محفظة «${u.name || u.phone || userId}» — ${note}`, { target: 'users/' + userId, amount });
      toast('سُجّلت التسوية'); closeModal();
    } catch (err) { alert('تعذر التسجيل: ' + (err.message || err.code)); }
  });
}

/* ================= إثباتات الطلب =================
 *
 * `order_proofs/{orderId}` — أزمنة وإحداثيات محطات السائق الثلاث (وصول
 * المطعم / الاستلام / التسليم) مع صورتَي الاستلام والتسليم مخزَّنتين
 * كـBlob داخل المستند نفسه (ينتظر Storage خطة Blaze).
 *
 * تُقرأ **عند الطلب فقط** لا مع قائمة الطلبات: كل وثيقة تحمل صورتين بحجم
 * ~60 كيلوبايت، فتحميلها مع كل طلب يُثقل اللوحة بلا داعٍ — ولا يفتحها أحد
 * إلا عند نزاع.
 */
function proofPhotoTag(blob, label) {
  // Bytes في Firestore Web SDK: toBase64() جاهزة، وdata: مسموح في CSP.
  if (!blob || typeof blob.toBase64 !== 'function') return '';
  return `<div style="margin:10px 0">
    <div class="meta" style="margin-bottom:4px">${esc(label)}</div>
    <img src="data:image/jpeg;base64,${blob.toBase64()}" alt="${esc(label)}"
         style="width:100%;border-radius:12px;border:1px solid #dfe5f0">
  </div>`;
}

function proofStop(label, at, lat, lng) {
  if (!at && lat == null) return '';
  const coords = (lat != null && lng != null)
    ? ` · <a href="https://maps.google.com/?q=${lat},${lng}" target="_blank" rel="noopener noreferrer">📍 الموقع</a>`
    : '';
  return `<div class="kv"><span>${esc(label)}</span><b style="font-weight:400">${esc(fmtTime(at))}${coords}</b></div>`;
}

async function loadOrderProof(orderId) {
  const box = document.getElementById('proofBox');
  if (!box) return;
  box.innerHTML = '<div class="meta">…جارٍ التحميل</div>';
  try {
    const snap = await getDoc(doc(db, 'order_proofs', orderId));
    if (!snap.exists()) {
      box.innerHTML = `<div class="meta">لا توجد إثباتات لهذا الطلب.
        (تُسجَّل من تطبيق السائق عند الاستلام والتسليم — الطلبات القديمة قبل هذه الميزة بلا إثباتات.)</div>`;
      return;
    }
    const d = snap.data();
    const dist = d.deliveryDistanceMeters;
    // بُعد كبير لحظة التسليم = بيّنة «سلّم في مكان آخر» عند النزاع.
    const far = Number.isFinite(Number(dist)) && Number(dist) > 150;
    box.innerHTML = `
      <div class="panel" style="background:#f7f9f8;margin:0">
        <b>إثباتات رحلة السائق</b>
        ${proofStop('وصل المطعم', d.arrivedAt, d.arrivedLat, d.arrivedLng)}
        ${proofStop('استلم الطلب', d.pickupAt, d.pickupLat, d.pickupLng)}
        ${proofStop('سلّم للعميل', d.deliveryAt, d.deliveryLat, d.deliveryLng)}
        ${Number.isFinite(Number(dist)) ? `
          <div class="kv"><span>بُعده عن العميل لحظة التسليم</span>
            <b style="${far ? 'color:var(--red)' : ''}">${Number(dist)} متر${far ? ' ⚠️' : ''}</b></div>` : ''}
        ${far ? `<p class="meta" style="color:var(--red);margin-top:6px">
          ⚠️ سُجّل التسليم بعيداً عن موقع العميل المحفوظ — يستحق المراجعة عند أي شكوى.</p>` : ''}
        ${proofPhotoTag(d.pickupPhoto, '📦 صورة الاستلام من المطعم')}
        ${proofPhotoTag(d.deliveryPhoto, '🏠 صورة التسليم للعميل')}
        ${(!d.pickupPhoto && !d.deliveryPhoto)
          ? '<div class="meta">لا توجد صور مرفقة — الصور اختيارية عند السائق.</div>' : ''}
      </div>`;
  } catch (err) {
    box.innerHTML = `<div class="meta" style="color:var(--red)">تعذّر تحميل الإثباتات: ${esc(err.code || err.message)}</div>`;
  }
}

/* ================= تسويات المطاعم =================
 *
 * دفتر المطعم **بالطرح**، لا برصيد مخزَّن:
 *     المتبقي = المستحق (صافي الطلبات المسلَّمة) − المدفوع (مجموع التسويات)
 *
 * لماذا بالطرح لا برصيد محفوظ؟ لأن الرصيد المخزَّن يمكن أن ينحرف عن الواقع
 * إن فشلت كتابة، بينما الطرح يُعيد حسابه من المصدر في كل مرة فلا ينحرف أبداً.
 *
 * صافي المطعم من الطلب = قيمة الوجبات − عمولة المنصة. خصم الكوبون لا يمسّه
 * (تتحمّله المنصة وحدها)، ورسوم التوصيل ليست له أصلاً.
 */
function restaurantDue(restaurantId) {
  return S.orders
    .filter((o) => o.restaurantId === restaurantId && o.status === 'delivered')
    .reduce((sum, o) => sum + (itemsTotal(o) - commission(o)), 0);
}
function restaurantPaid(restaurantId) {
  return S.settlements
    .filter((x) => x.restaurantId === restaurantId)
    .reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
}

function renderSettlementsPage() {
  const rows = [...S.restaurants].map((r) => {
    const due = restaurantDue(r.id);
    const paid = restaurantPaid(r.id);
    return { r, due, paid, left: due - paid };
  }).sort((a, b) => b.left - a.left);

  const totalLeft = rows.reduce((s, x) => s + x.left, 0);
  const totalDue = rows.reduce((s, x) => s + x.due, 0);
  const totalPaid = rows.reduce((s, x) => s + x.paid, 0);

  // أقدم طلب محمَّل — يحدّد الفترة التي حُسب عليها المستحق.
  const oldest = S.orders.length
    ? toDate(S.orders[S.orders.length - 1].createdAt) : null;
  const atCap = S.orders.length >= ORDERS_LIMIT;

  $('main').innerHTML = `
    <div class="panel">
      <h3 style="margin:0 0 10px">تسويات المطاعم</h3>
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${fmtMoney(totalDue)}</div><div class="lbl">إجمالي المستحق (${SAR})</div></div>
        <div class="kpi"><div class="num">${fmtMoney(totalPaid)}</div><div class="lbl">إجمالي المدفوع (${SAR})</div></div>
        <div class="kpi" style="border-color:${totalLeft > 0.009 ? '#ca6f1e' : 'var(--green)'}">
          <div class="num">${fmtMoney(totalLeft)}</div><div class="lbl">المتبقي عليك (${SAR})</div></div>
      </div>
      ${atCap ? `
        <p class="meta" style="margin-top:10px;color:var(--orange)">
          ⚠️ المستحق محسوب من آخر ${ORDERS_LIMIT} طلب فقط${oldest ? ` (منذ ${esc(fmtTime(S.orders[S.orders.length - 1].createdAt))})` : ''}
          — الطلبات الأقدم غير محتسبة. راجع الأرقام قبل أي دفعة كبيرة.
        </p>` : `
        <p class="meta" style="margin-top:10px">
          محسوب من كل الطلبات المسلَّمة${oldest ? ` منذ ${esc(fmtTime(S.orders[S.orders.length - 1].createdAt))}` : ''}.
        </p>`}
    </div>
    <div class="panel">
      ${rows.map(({ r, due, paid, left }) => `
        <div class="card">
          <div class="row1">
            <span class="title">${esc(r.emoji || '🍽️')} ${esc(restName(r))}</span>
            ${left > 0.009 ? badge(`متبقٍّ ${fmtMoney(left)} ${SAR}`, '#ca6f1e')
              : left < -0.009 ? badge(`زائد ${fmtMoney(-left)} ${SAR}`, '#8e44ad')
              : badge('مسوّى', '#1e8449')}
          </div>
          <div class="meta">
            المستحق: <b>${fmtMoney(due)} ${SAR}</b>
            · المدفوع: <b>${fmtMoney(paid)} ${SAR}</b><br>
            من ${deliveredCountFor(r.id)} طلب مسلَّم
          </div>
          <div class="row1" style="margin-top:8px;gap:6px">
            <button class="toggle-btn on" data-paysettle="${esc(r.id)}">💰 تسجيل دفعة</button>
            <button class="toggle-btn" data-settlelog="${esc(r.id)}">📒 سجل الدفعات</button>
          </div>
        </div>`).join('') || '<div class="empty">لا توجد مطاعم بعد</div>'}
    </div>`;

  $('main').querySelectorAll('[data-paysettle]').forEach((b) =>
    b.addEventListener('click', () => openSettlementForm(b.dataset.paysettle)));
  $('main').querySelectorAll('[data-settlelog]').forEach((b) =>
    b.addEventListener('click', () => openSettlementLog(b.dataset.settlelog)));
}

function openSettlementForm(restaurantId) {
  const r = S.restaurants.find((x) => x.id === restaurantId);
  if (!r) return;
  const left = restaurantDue(restaurantId) - restaurantPaid(restaurantId);

/* التحريك يبادل قيمة sortOrder مع الجار — أبسط من إعادة ترقيم القائمة كلها،
 * ويكتب مستندين فقط في كل نقلة. */
async function moveBanner(id, dir) {
  const list = [...S.banners].sort((a, b) =>
    (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0));
  const i = list.findIndex((b) => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'banners', a.id), { sortOrder: Number(b.sortOrder) || 0 });
    batch.update(doc(db, 'banners', b.id), { sortOrder: Number(a.sortOrder) || 0 });
    await batch.commit();
    audit('banner.reorder', `نقل بنر «${a.title || a.id}» ${dir < 0 ? 'للأعلى' : 'للأسفل'}`,
      { target: 'banners/' + a.id });
  } catch (err) { alert('تعذر الترتيب: ' + (err.code || err.message)); }
}

/* ================= طلبات سحب المستحقات =================
 *
 * السائق يقدّم الطلب من تطبيقه، والبتّ هنا. الصرف عملية مالية مركّبة:
 * خصم الرصيد + حركة في دفتر السائق + إغلاق الطلب — الثلاثة معاً أو لا شيء.
 *
 * تُنفَّذ داخل runTransaction بقراءة طازجة للطلب وللسائق، فتُغلق ثغرتان:
 *   • الصرف المزدوج (ضغطتان متتاليتان، أو صرف من الويب والتطبيق معاً).
 *   • الصرف فوق الرصيد إن تراكمت عُهدة على السائق بعد تقديمه الطلب.
 * وهي تطابق منطق payPayoutRequest في التطبيق حرفياً: نفس نوع الحركة
 * (payout) ونفس الحقول ونفس تحديث totalEarnings.
 */
const PAYOUT_STATUS_AR = {
  pending: ['معلّق', '#ca6f1e'],
  paid: ['مصروف', '#1e8449'],
  rejected: ['مرفوض', '#c0392b'],
};

function renderPayoutsPage() {
  const filters = [['pending', 'المعلّقة'], ['all', 'الكل'], ['paid', 'المصروفة'], ['rejected', 'المرفوضة']];
  let list = [...S.payouts];
  if (payoutFilter !== 'all') list = list.filter((p) => (p.status || 'pending') === payoutFilter);

  const pending = S.payouts.filter((p) => (p.status || 'pending') === 'pending');
  const pendingSum = pending.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const paidSum = S.payouts.filter((p) => p.status === 'paid')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  $('main').innerHTML = `
    <div class="panel">
      <div class="kpi-grid">
        <div class="kpi" style="border-color:${pending.length ? '#ca6f1e' : 'var(--green)'}">
          <div class="num">${pending.length}</div><div class="lbl">طلب معلّق</div></div>
        <div class="kpi"><div class="num">${fmtMoney(pendingSum)}</div><div class="lbl">مطلوب صرفه (${SAR})</div></div>
        <div class="kpi"><div class="num">${fmtMoney(paidSum)}</div><div class="lbl">صُرف إجمالاً (${SAR})</div></div>
      </div>
      <div class="toolbar" style="margin-top:12px">${filters.map(([k, l]) =>
        `<button class="chip ${payoutFilter === k ? 'active' : ''}" data-pf="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="panel">
      ${list.map((p) => {
        const st = p.status || 'pending';
        const [stTxt, stColor] = PAYOUT_STATUS_AR[st] || [st, '#7f8c8d'];
        const drv = S.drivers.find((d) => d.id === p.driverId);
        const bal = Number(drv?.balance) || 0;
        const amount = Number(p.amount) || 0;
        const short = st === 'pending' && amount > bal;
        return `
          <div class="card">
            <div class="row1">
              <span class="title">${esc(p.driverName || drv?.name || 'سائق')}</span>
              ${badge(stTxt, stColor)}
            </div>
            <div class="meta">
              المبلغ المطلوب: <b>${fmtMoney(amount)} ${SAR}</b>
              <br>طريقة الاستلام: ${esc(p.method || '—')}
              <br>قُدّم: ${esc(fmtTime(p.createdAt))}
              ${st === 'pending' ? `<br>رصيد السائق الآن: ${balanceBadge(bal)}` : ''}
              ${p.processedAt ? `<br>تمت المعالجة: ${esc(fmtTime(p.processedAt))}` : ''}
              ${p.adminNote ? `<br>ملاحظة الإدارة: ${esc(p.adminNote)}` : ''}
              ${short ? `<br><span style="color:var(--red)">⚠️ المبلغ أكبر من رصيد السائق الحالي — تغيّر بعد تقديم الطلب</span>` : ''}
            </div>
            ${st === 'pending' ? `
              <div class="row1" style="margin-top:8px;gap:6px">
                <button class="toggle-btn on" data-paypo="${esc(p.id)}">💸 صرف</button>
                <button class="toggle-btn" data-rejpo="${esc(p.id)}">✖️ رفض</button>
              </div>` : ''}
          </div>`;
      }).join('') || '<div class="empty">لا توجد طلبات في هذا التصنيف</div>'}
    </div>`;

  document.querySelectorAll('[data-pf]').forEach((b) =>
    b.addEventListener('click', () => { payoutFilter = b.dataset.pf; renderPayoutsPage(); }));
  $('main').querySelectorAll('[data-paypo]').forEach((b) =>
    b.addEventListener('click', () => payPayout(b.dataset.paypo)));
  $('main').querySelectorAll('[data-rejpo]').forEach((b) =>
    b.addEventListener('click', () => rejectPayout(b.dataset.rejpo)));
}

async function payPayout(id) {
  const p = S.payouts.find((x) => x.id === id);
  if (!p) return;
  const amount = Number(p.amount) || 0;
  const note = prompt(`صرف ${fmtMoney(amount)} ${SAR} إلى ${p.driverName || 'السائق'}؟\n` +
    `طريقة الاستلام: ${p.method || '—'}\n\nملاحظة اختيارية تظهر للسائق:`, '');
  if (note === null) return; // ألغى المستخدم
  try {
    await runTransaction(db, async (tx) => {
      const reqRef = doc(db, 'payout_requests', id);
      const drvRef = doc(db, 'drivers', p.driverId);
      const reqSnap = await tx.get(reqRef);
      const drvSnap = await tx.get(drvRef);
      if (!reqSnap.exists()) throw new Error('الطلب غير موجود');
      const cur = reqSnap.data();
      if ((cur.status || 'pending') !== 'pending') {
        throw new Error('هذا الطلب عولج بالفعل — حدِّث الصفحة');
      }
      if (!drvSnap.exists()) throw new Error('السائق غير موجود');
      const bal = Number(drvSnap.data().balance) || 0;
      const amt = Number(cur.amount) || 0;
      if (amt > bal) {
        throw new Error(`رصيد السائق (${fmtMoney(bal)} ${SAR}) أقل من المبلغ — ` +
          'تغيّر بعد تقديم الطلب. ارفض الطلب أو انتظر تسويته');
      }
      const after = bal - amt;
      tx.update(drvRef, {
        balance: after,
        totalEarnings: (Number(drvSnap.data().totalEarnings) || 0) + amt,
      });
      tx.set(doc(collection(db, 'driver_transactions')), {
        driverId: p.driverId,
        type: 'payout',
        amount: -amt,
        balanceAfter: after,
        note: `صرف طلب سحب (${cur.method || '—'})`,
        performedBy: adminUser.uid,
        createdAt: serverTimestamp(),
      });
      tx.update(reqRef, {
        status: 'paid',
        processedAt: serverTimestamp(),
        ...(note.trim() ? { adminNote: note.trim() } : {}),
      });
    });
    audit('payout.paid', `صرف طلب سحب ${fmtMoney(amount)} ${SAR} للسائق «${p.driverName || ''}» (${p.method || '—'})`,
      { target: 'payout_requests/' + id, amount: -amount });
    toast('صُرف الطلب وسُجّلت الحركة');
  } catch (err) {
    alert('تعذر الصرف: ' + (err.message || err.code));
  }
}

async function rejectPayout(id) {
  const p = S.payouts.find((x) => x.id === id);
  if (!p) return;
  const reason = prompt('سبب الرفض (يظهر للسائق):', '');
  if (reason === null) return;
  if (!reason.trim()) { alert('اكتب سبب الرفض — يراه السائق'); return; }
  try {
    await runTransaction(db, async (tx) => {
      const reqRef = doc(db, 'payout_requests', id);
      const snap = await tx.get(reqRef);
      if (!snap.exists()) throw new Error('الطلب غير موجود');
      if ((snap.data().status || 'pending') !== 'pending') {
        throw new Error('هذا الطلب عولج بالفعل — حدِّث الصفحة');
      }
      tx.update(reqRef, {
        status: 'rejected',
        adminNote: reason.trim(),
        processedAt: serverTimestamp(),
      });
    });
    audit('payout.rejected', `رفض طلب سحب ${fmtMoney(p.amount)} ${SAR} للسائق «${p.driverName || ''}» — ${reason.trim()}`,
      { target: 'payout_requests/' + id, amount: Number(p.amount) || 0 });
    toast('رُفض الطلب');
  } catch (err) {
    alert('تعذر الرفض: ' + (err.message || err.code));
  }
}

/* ================= الكوبونات =================
 *
 * معرّف المستند هو الكود نفسه (بحروف كبيرة) — هكذا يقرؤه التطبيق مباشرة
 * بلا استعلام، ويستحيل وجود كودين متطابقين. لذلك «تعديل الكود» غير ممكن:
 * الكود هوية المستند لا حقلاً فيه، وتغييره يعني كوداً جديداً.
 *
 * قواعد Firestore تسمح للعميل بزيادة usedCount بمقدار 1 فقط ولا شيء غيره،
 * فلا يُخشى من عبثه بالقيمة أو تعطيل الكود.
 */
function couponState(c) {
  const now = new Date();
  const exp = toDate(c.expiresAt);
  if (c.isActive === false) return ['موقوف', '#7f8c8d'];
  if (exp && exp < now) return ['منتهي', '#c0392b'];
  const limit = Number(c.usageLimit) || 0;
  if (limit > 0 && (Number(c.usedCount) || 0) >= limit) return ['مستنفد', '#d35400'];
  return ['فعّال', '#1e8449'];
}

function couponLabel(c) {
  const v = Number(c.value) || 0;
  if (c.type === 'fixed') return `${fmtMoney(v)} ${SAR}`;
  const cap = Number(c.maxDiscount) || 0;
  return `${v}%${cap > 0 ? ` حتى ${fmtMoney(cap)} ${SAR}` : ''}`;
}

async function saveCoupon() {
  const code = document.getElementById('c_code').value.trim().toUpperCase();
  const type = document.getElementById('c_type').value;
  const value = Number(document.getElementById('c_value').value);
  const maxDiscount = Number(document.getElementById('c_max').value) || 0;
  const minOrderTotal = Number(document.getElementById('c_min').value) || 0;
  const usageLimit = Number(document.getElementById('c_limit').value) || 0;
  const perUserLimit = Number(document.getElementById('c_peruser').value) || 1;
  const restaurantId = document.getElementById('c_rest').value;
  const expRaw = document.getElementById('c_exp').value;

  if (!/^[A-Z0-9]{3,24}$/.test(code)) {
    alert('الكود يجب أن يكون 3 إلى 24 حرفاً إنجليزياً أو رقماً، بلا مسافات أو رموز'); return;
  }
  if (!value || value <= 0) { alert('أدخل قيمة خصم أكبر من صفر'); return; }
  if (type === 'percentage' && value > 100) { alert('النسبة المئوية لا تتجاوز 100'); return; }
  if (S.coupons.some((c) => c.id === code)) { alert('هذا الكود موجود بالفعل'); return; }

  // نهاية اليوم المختار لا بدايته: كوبون «ينتهي اليوم» يجب أن يعمل طوال اليوم.
  let expiresAt = null;
  if (expRaw) {
    const d = new Date(expRaw + 'T23:59:59');
    if (d < new Date()) { alert('تاريخ الانتهاء في الماضي'); return; }
    expiresAt = Timestamp.fromDate(d);
  }

  try {
    await setDoc(doc(db, 'coupons', code), {
      type, value, minOrderTotal, maxDiscount, usageLimit,
      usedCount: 0, perUserLimit, restaurantId,
      ...(expiresAt ? { expiresAt } : {}),
      isActive: true,
      createdAt: serverTimestamp(),
    });
    audit('coupon.create', `أنشأ كوبون ${code} — ${type === 'percentage' ? value + '%' : fmtMoney(value) + ' ' + SAR}`
      + (usageLimit > 0 ? ` (حد ${usageLimit} استخدام)` : ''), { target: 'coupons/' + code, amount: value });
    toast('أُنشئ الكوبون ' + code); closeModal();
  } catch (err) {
    alert('تعذر الإنشاء: ' + (err.code || err.message));
  }
}

async function toggleCoupon(code) {
  const c = S.coupons.find((x) => x.id === code);
  if (!c) return;
  const turningOn = c.isActive === false;
  if (!confirm(`${turningOn ? 'تفعيل' : 'إيقاف'} الكود ${code}؟`)) return;
  try {
    await updateDoc(doc(db, 'coupons', code), { isActive: turningOn });
    audit('coupon.toggle', `${turningOn ? 'فعّل' : 'أوقف'} كوبون ${code}`, { target: 'coupons/' + code });
    toast(turningOn ? 'فُعّل الكوبون' : 'أُوقف الكوبون');
  } catch (err) { alert('تعذر التغيير: ' + (err.code || err.message)); }
}

/* الحذف متاح لأن العميل لا يستطيعه (القواعد تقصره على المدير)، لكنه يُفقد
 * سجلّ الكود من التقارير. الإيقاف أنسب في معظم الحالات، ولهذا يحذّر النص. */
async function deleteCoupon(code) {
  const c = S.coupons.find((x) => x.id === code);
  const used = Number(c?.usedCount) || 0;
  const warn = used > 0
    ? `\n\n⚠️ استُخدم هذا الكود ${used} مرة. حذفه يُفقد أثره في التقارير — الإيقاف أفضل.`
    : '';
  if (!confirm(`حذف الكود ${code} نهائياً؟${warn}`)) return;
  try {
    await deleteDoc(doc(db, 'coupons', code));
    audit('coupon.delete', `حذف كوبون ${code}` + (used > 0 ? ` (كان مستخدماً ${used} مرة)` : ''),
      { target: 'coupons/' + code });
    toast('حُذف الكوبون');
  } catch (err) { alert('تعذر الحذف: ' + (err.code || err.message)); }
}

async function runImport() {
  const status = document.getElementById('impStatus');
  const btn = document.getElementById('impBtn');
  const rid = document.getElementById('impRest').value;
  const say = (m) => { status.innerHTML = `<div class="card">${m}</div>`; };
  if (!rid) { alert('اختر المطعم أولاً'); return; }

  let data;
  try {
    data = JSON.parse(document.getElementById('impText').value);
    if (!Array.isArray(data.categories)) throw new Error('لا يوجد حقل categories');
  } catch (err) { say('❌ الملف غير سليم: ' + esc(err.message)); return; }

  btn.disabled = true;
  try {
    say('⏳ جارٍ قراءة المنيو الحالي للمقارنة…');
    const catSnap = await getDocs(collection(db, 'restaurants', rid, 'categories'));
    const itemSnap = await getDocs(collection(db, 'restaurants', rid, 'items'));
    const catByName = new Map(catSnap.docs.map((d) => [(d.data().name || '').trim(), d.id]));
    const itemByKey = new Map(itemSnap.docs.map((d) =>
      [d.data().categoryId + '|' + (d.data().name || '').trim(), d.id]));

    // خطة الاستيراد
    let newCats = 0, newItems = 0, updItems = 0, totalItems = 0;
    data.categories.forEach((c) => {
      if (!catByName.has((c.name || '').trim())) newCats++;
      (c.items || []).forEach(() => totalItems++);
    });

    const rest = S.restaurants.find((r) => r.id === rid);
    if (!confirm(`استيراد ${totalItems} صنفاً في ${data.categories.length} قسماً إلى «${rest?.name}»؟\n(أقسام جديدة: ${newCats} — الأصناف الموجودة بنفس الاسم ستُحدَّث لا تُكرَّر)`)) {
      btn.disabled = false; say(''); return;
    }

    say('⏳ جارٍ الاستيراد…');
    let batch = writeBatch(db), ops = 0;
    const commitIfFull = async () => {
      if (ops >= 400) { await batch.commit(); batch = writeBatch(db); ops = 0; }
    };

    let sortOrder = catSnap.size;
    for (const c of data.categories) {
      const cname = (c.name || '').trim();
      if (!cname) continue;
      let catId = catByName.get(cname);
      if (!catId) {
        const ref = doc(collection(db, 'restaurants', rid, 'categories'));
        catId = ref.id;
        batch.set(ref, { name: cname, restaurantId: rid, sortOrder: sortOrder++ });
        catByName.set(cname, catId); ops++; await commitIfFull();
      }
      for (const it of (c.items || [])) {
        const iname = (it.name || '').trim();
        if (!iname) continue;
        const payload = {
          restaurantId: rid, categoryId: catId, name: iname,
          price: Number(it.price) || 0,
          isAvailable: true,
        };
        if (it.kcal != null) payload.kcal = Number(it.kcal) || 0;
        if (it.imageUrl) payload.imageUrl = String(it.imageUrl).trim();
        if (it.description) payload.description = String(it.description);
        if (it.emoji) payload.emoji = String(it.emoji);
        const key = catId + '|' + iname;
        const existingId = itemByKey.get(key);
        if (existingId) {
          batch.update(doc(db, 'restaurants', rid, 'items', existingId), payload);
          updItems++;
        } else {
          const ref = doc(collection(db, 'restaurants', rid, 'items'));
          batch.set(ref, { description: '', emoji: '🍽️', totalSold: 0, trackStock: false, ...payload });
          itemByKey.set(key, ref.id);
          newItems++;
        }
        ops++; await commitIfFull();
      }
    }
    if (ops > 0) await batch.commit();
    audit('menu.import', `استورد منيو «${restName(S.restaurants.find((x) => x.id === rid) || {})}» — `
      + `${newCats} قسماً جديداً، ${newItems} صنفاً جديداً، ${updItems} صنفاً محدَّثاً`,
      { target: 'restaurants/' + rid });
    say(`✅ <b>اكتمل الاستيراد بنجاح</b><br>
      أقسام جديدة: ${newCats} — أصناف جديدة: ${newItems} — أصناف حُدّثت: ${updItems}<br>
      <span class="meta">افتح التطبيق الآن — الأصناف وصورها ستظهر مباشرة.</span>`);
    toast('اكتمل الاستيراد');
  } catch (err) {
    say('❌ تعذر الاستيراد: ' + esc(err.code || err.message));
  }
  btn.disabled = false;
}

/* ================= أرشيف الطلبات =================
 *
 * المستمع الحي يحمل آخر 400 طلب فقط — حدٌّ مقصود: مستمعٌ مفتوح على كل طلب
 * منذ الإطلاق يقرأ آلاف المستندات في كل جلسة بلا فائدة. لكن ذلك يعني أن
 * طلباً عمره شهران لا يُرى ولا يُبحث عنه، فهذه الصفحة تجلبه **عند الطلب**.
 *
 * مسارا بحث لأن Firestore لا يبحث داخل النصوص:
 * • **برقم الطلب** — مطابقة تامة، استعلام مباشر بلا تاريخ. المسار الأسرع
 *   وأرخصه: مستند واحد بدل نطاق كامل.
 * • **بنطاق تاريخ** — يُجلب النطاق ثم يُصفّى في المتصفح (اسم، جوال، مطعم).
 *   فلا فهرس مركّب يحتاج إنشاءً يدوياً في الكونسول.
 */
const ARCHIVE_LIMIT = 500;

function isoDaysAgo(n) {
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function renderArchivePage() {
  if (!archFrom) { archFrom = isoDaysAgo(30); archTo = isoDaysAgo(0); }
  const rows = archRows || [];
  let list = rows;
  if (archSearch) {
    const q2 = archSearch.toLowerCase();

function renderArchiveRows() {
  const box = document.getElementById('ar_list');
  if (!box) return;
  let list = archRows || [];
  if (archSearch) {
    const q2 = archSearch.toLowerCase();
    list = list.filter((o) => [o.orderNumber, o.customerName, o.customerPhone, o.restaurantName, o.driverName]
      .some((v) => String(v || '').toLowerCase().includes(q2)));
  }
  box.innerHTML = list.map(orderCard).join('') ||
    `<div class="empty">${archRows && archRows.length ? 'لا نتيجة مطابقة داخل الفترة' : 'لا طلبات في هذه الفترة'}</div>`;
}

async function loadArchive(spec) {
  if (archLoading) return;
  archLoading = true; archErr = null; archNote = ''; archSearch = '';
  renderArchivePage();
  try {
    let q2;
    if (spec.orderNumber) {
      q2 = query(collection(db, 'orders'), where('orderNumber', '==', spec.orderNumber), limit(20));
    } else {
      // نهاية اليوم المختار لا بدايته: «إلى 10 أغسطس» يجب أن تشمل يومه كاملاً.
      const from = new Date(spec.from + 'T00:00:00');
      const to = new Date(spec.to + 'T23:59:59.999');
      q2 = query(collection(db, 'orders'),
        where('createdAt', '>=', Timestamp.fromDate(from)),
        where('createdAt', '<=', Timestamp.fromDate(to)),
        orderBy('createdAt', 'desc'), limit(ARCHIVE_LIMIT));
    }
    const qs = await getDocs(q2);
    archRows = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (spec.orderNumber) {
      archNote = archRows.length
        ? `نتيجة البحث عن الطلب رقم ${spec.orderNumber}.`
        : `لا طلب برقم ${spec.orderNumber}. تأكد من الرقم — البحث بالرقم مطابقة تامة لا جزئية.`;
    } else if (archRows.length >= ARCHIVE_LIMIT) {
      // صمتٌ عن الاقتطاع يجعل المالك يظن أنه رأى الفترة كاملة.
      archNote = `⚠️ بلغت النتيجة الحد الأقصى (${ARCHIVE_LIMIT} طلب) — الفترة أطول من ذلك. `
        + 'ضيّق النطاق لترى بقيتها.';
    } else {
      archNote = `${archRows.length} طلب في الفترة من ${spec.from} إلى ${spec.to}.`;
    }
  } catch (err) {
    archErr = err.code === 'failed-precondition'
      ? 'يحتاج هذا الاستعلام فهرساً في Firestore — افتح الرابط في رسالة الخطأ بالكونسول لإنشائه بضغطة.'
      : (err.code || err.message);
    archRows = [];
  }
  archLoading = false;
  if (page === 'archive') renderArchivePage();
}

/* ================= التقارير ================= */
let reportDays = 7, reportData = null, reportBusy = false;
function renderReportsPage() {
  $('main').innerHTML = `
    <div class="toolbar">
      ${[[1, 'اليوم'], [7, 'آخر ٧ أيام'], [30, 'آخر ٣٠ يوم'], [90, 'آخر ٩٠ يوم']].map(([d, l]) =>
        `<button class="chip ${d === reportDays ? 'active' : ''}" data-rep="${d}">${l}</button>`).join('')}
      <button class="chip" id="csvBtn">⬇️ تصدير Excel (CSV)</button>
    </div>
    <div id="repBody">${reportBusy ? '<div class="loading">جارٍ حساب التقرير…</div>' : ''}</div>`;
  $('main').querySelectorAll('[data-rep]').forEach((b) =>
    b.addEventListener('click', () => { reportDays = Number(b.dataset.rep); loadReport(); }));
  document.getElementById('csvBtn').addEventListener('click', exportCsv);
  if (reportBusy) return;
  if (!reportData || reportData.days !== reportDays) loadReport(); else drawReport();
}

async function loadReport() {
  reportBusy = true; renderReportsPage();
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (reportDays - 1));
    const qs = await getDocs(query(collection(db, 'orders'),
      where('createdAt', '>=', Timestamp.fromDate(start)), orderBy('createdAt', 'desc'), limit(3000)));
    const orders = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    const delivered = orders.filter((o) => o.status === 'delivered');
    const perRest = {}, perDriver = {};
    delivered.forEach((o) => {
      const rk = o.restaurantName || '—';
      perRest[rk] = perRest[rk] || { count: 0, items: 0, comm: 0, appShare: 0 };
      perRest[rk].count++; perRest[rk].items += itemsTotal(o);
      perRest[rk].comm += commission(o); perRest[rk].appShare += Number(o.appShare) || 0;
      if (o.driverName) {
        const dk = o.driverName;
        perDriver[dk] = perDriver[dk] || { count: 0, share: 0 };
        perDriver[dk].count++; perDriver[dk].share += Number(o.driverShare) || 0;
      }
    });
    reportData = {
      days: reportDays, total: orders.length, delivered: delivered.length,
      cancelled: orders.filter((o) => CANCELLED_STATUSES.includes(o.status)).length,
      revenue: delivered.reduce((s, o) => s + orderTotal(o), 0),
      itemsRev: delivered.reduce((s, o) => s + itemsTotal(o), 0),
      commTotal: delivered.reduce((s, o) => s + commission(o), 0),
      appShareTotal: delivered.reduce((s, o) => s + (Number(o.appShare) || 0), 0),
      driverShareTotal: delivered.reduce((s, o) => s + (Number(o.driverShare) || 0), 0),
      perRest, perDriver,
    };
  } catch (err) {
    reportData = { error: err.code || err.message, days: reportDays };
  }
  reportBusy = false;
  if (page === 'reports') { renderReportsPage(); }
}

function drawReport() {
  const r = reportData;
  const el = document.getElementById('repBody');
  if (!el) return;
  if (r.error) { el.innerHTML = `<div class="empty">تعذر التحميل: ${esc(r.error)}</div>`; return; }
  const platformProfit = r.commTotal + r.appShareTotal;
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${r.total}</div><div class="lbl">إجمالي الطلبات</div></div>
      <div class="kpi"><div class="num">${r.delivered}</div><div class="lbl">مُوصَّلة</div></div>
      <div class="kpi"><div class="num">${r.cancelled}</div><div class="lbl">ملغاة/مرفوضة</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.revenue)}</div><div class="lbl">إجمالي المبيعات (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.commTotal)}</div><div class="lbl">عمولات المطاعم ١٥٪ (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.appShareTotal)}</div><div class="lbl">نصيب المنصة من التوصيل (${SAR})</div></div>
      <div class="kpi" style="border-color:var(--gold)"><div class="num">${fmtMoney(platformProfit)}</div>
        <div class="lbl">أرباح المنصة الإجمالية (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.driverShareTotal)}</div><div class="lbl">أجور السائقين (${SAR})</div></div>
    </div>
    <div class="panel"><h3>حسب المطعم (الطلبات المُوصَّلة)</h3><div class="table-wrap">
      <table class="rep"><tr><th>المطعم</th><th>طلبات</th><th>مبيعات الوجبات</th><th>عمولة ١٥٪</th><th>صافي للمطعم</th></tr>
        ${Object.entries(r.perRest).sort((a, b) => b[1].items - a[1].items).map(([n, v]) => `
          <tr><td>${esc(n)}</td><td>${v.count}</td><td>${fmtMoney(v.items)}</td>
            <td>${fmtMoney(v.comm)}</td><td><b>${fmtMoney(v.items - v.comm)}</b></td></tr>`).join('') ||
          '<tr><td colspan="5" class="empty">لا بيانات</td></tr>'}
      </table></div></div>
    <div class="panel"><h3>حسب السائق (الطلبات المُوصَّلة)</h3><div class="table-wrap">
      <table class="rep"><tr><th>السائق</th><th>توصيلات</th><th>أجور التوصيل</th></tr>
        ${Object.entries(r.perDriver).sort((a, b) => b[1].count - a[1].count).map(([n, v]) => `
          <tr><td>${esc(n)}</td><td>${v.count}</td><td>${fmtMoney(v.share)}</td></tr>`).join('') ||
          '<tr><td colspan="3" class="empty">لا بيانات</td></tr>'}
      </table></div></div>`;
}

function exportCsv() {
  const r = reportData;
  if (!r || r.error) { alert('لا يوجد تقرير محمّل بعد'); return; }
  const rows = [
    ['تقرير ZadGo', `آخر ${r.days} يوم`],
    [],
    ['إجمالي الطلبات', r.total], ['مُوصَّلة', r.delivered], ['ملغاة', r.cancelled],
    ['إجمالي المبيعات', fmtMoney(r.revenue)], ['عمولات المطاعم 15%', fmtMoney(r.commTotal)],
    ['نصيب المنصة من التوصيل', fmtMoney(r.appShareTotal)],
    ['أرباح المنصة', fmtMoney(r.commTotal + r.appShareTotal)],
    ['أجور السائقين', fmtMoney(r.driverShareTotal)],
    [],
    ['المطعم', 'طلبات', 'مبيعات الوجبات', 'عمولة 15%', 'صافي للمطعم'],
    ...Object.entries(r.perRest).map(([n, v]) => [n, v.count, fmtMoney(v.items), fmtMoney(v.comm), fmtMoney(v.items - v.comm)]),
    [],
    ['السائق', 'توصيلات', 'أجور التوصيل'],
    ...Object.entries(r.perDriver).map(([n, v]) => [n, v.count, fmtMoney(v.share)]),
  ];
  const csv = '﻿' + rows.map((row) => row.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `zadgo-report-${r.days}d.csv`;
  a.click();
}

/* يُقرأ عند الطلب لا بمستمع دائم: صفحة تُفتح عند السؤال «من فعل هذا؟»
 * ولا معنى لبقائها تقرأ في الخلفية طوال اليوم. */
const AUDIT_LIMIT = 400;

async function loadAudit() {
  if (auditLoading) return;      // لقطة واردة أثناء التحميل لا تُطلق جلبة ثانية
  auditLoading = true;
  auditErr = null;
  try {
    const qs = await getDocs(query(collection(db, 'admin_audit'),
      orderBy('createdAt', 'desc'), limit(AUDIT_LIMIT)));
    auditRows = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (err) {
    auditErr = err.code || err.message;
    auditRows = [];
  }
  auditLoading = false;
  if (page === 'audit') renderAuditPage();
}

function renderAuditPage() {
  if (auditRows === null) {
    $('main').innerHTML = '<div class="loading">جارٍ تحميل السجل…</div>';
    loadAudit();
    return;
  }
  const cats = [['all', 'الكل'], ...Object.entries(AUDIT_CATS)];

  $('main').innerHTML = `
    <div class="panel">
      <p class="meta" style="margin-bottom:10px">كل فعل إداري من هذه اللوحة يُسجَّل هنا باسم فاعله ووقته.
        السجل <b>لا يُعدَّل ولا يُحذف</b> — وآخر ${AUDIT_LIMIT} حركة هي المعروضة.
        📱 من تطبيق الإدارة · 💻 من هذه اللوحة.</p>
      ${auditErr ? `<div class="card" style="border-inline-start:4px solid var(--red)">
        <b>⚠️ تعذّرت قراءة السجل</b>
        <div class="meta">${esc(auditErr)}${auditErr === 'permission-denied'
          ? '<br>قواعد Firestore لمجموعة <code>admin_audit</code> لم تُنشر بعد — أبلغ مساعد التطبيق.' : ''}</div>
      </div>` : ''}
      ${auditBroken ? `<div class="card" style="border-inline-start:4px solid var(--orange)">
        <b>⚠️ فشلت كتابة حركة في السجل خلال هذه الجلسة</b>
        <div class="meta">${esc(auditBroken)} — الأفعال نفسها نُفِّذت، لكن توثيقها لم يُكتب.</div>
      </div>` : ''}
      <div class="toolbar">${cats.map(([k, l]) =>
        `<button class="chip ${auditCat === k ? 'active' : ''}" data-af="${k}">${l}</button>`).join('')}
        <button class="toggle-btn" id="auditReload">↻ تحديث</button></div>
      <input class="search" id="auditQ" placeholder="ابحث في الوصف أو باسم المدير"
        value="${esc(auditSearch)}" style="width:100%">
    </div>
    <div id="auditList"></div>`;

  $('main').querySelectorAll('[data-af]').forEach((b) => b.addEventListener('click', () => {
    auditCat = b.dataset.af;
    $('main').querySelectorAll('[data-af]').forEach((x) => x.classList.toggle('active', x === b));
    renderAuditRows();
  }));
  $('main').querySelector('#auditReload').addEventListener('click', () => {
    auditRows = null; renderAuditPage();
  });
  // التصفية تُعيد رسم القائمة وحدها لا الصفحة: لو أُعيد بناء حقل البحث مع
  // كل حرف لضاع تركيز المؤشّر منه وتعذّرت الكتابة أصلاً.
  const q = $('main').querySelector('#auditQ');
  q.addEventListener('input', () => { auditSearch = q.value.trim(); renderAuditRows(); });
  renderAuditRows();
}

function renderAuditRows() {
  const box = document.getElementById('auditList');
  if (!box) return;
  let list = auditRows || [];
  if (auditCat !== 'all') list = list.filter((r) => (AUDIT_ACTIONS[r.action] || [])[1] === auditCat);
  if (auditSearch) {
    const q2 = auditSearch.toLowerCase();
    list = list.filter((r) => [r.summary, r.byName, r.byEmail, (AUDIT_ACTIONS[r.action] || [])[0]]
      .some((v) => String(v || '').toLowerCase().includes(q2)));
  }
  box.innerHTML = list.map((r) => {
    const [lbl, , color] = AUDIT_ACTIONS[r.action] || [r.action, '', '#7f8c8d'];
    const amt = Number(r.amount);
    return `<div class="card">
      <div class="row1"><span class="title">${esc(r.summary || lbl)}</span>${badge(lbl, color)}</div>
      <div class="meta">${r.source === 'app' ? '📱' : '💻'} ${esc(r.byName || r.byEmail || 'مدير')}
        — ${esc(fmtTime(r.createdAt))}
        ${Number.isFinite(amt) && amt !== 0 ? `<br>المبلغ: <b>${fmtMoney(Math.abs(amt))} ${SAR}</b>` : ''}
      </div>
    </div>`;
  }).join('') || `<div class="empty">${auditErr ? '' : 'لا حركات مسجَّلة في هذا التصنيف'}</div>`;
}
