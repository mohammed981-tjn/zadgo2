<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>لوحة تحكم ZadGo</title>
<style>
  :root {
    --green: #13224a; --green-dark: #0b1631; --green-light: #eef2fb; --gold: #FFC107;
    --bg: #f3f5f9; --card: #ffffff; --text: #16203a; --muted: #66718a; --line: #e4e8f1;
    --red: #c0392b; --blue: #2471a3; --orange: #ca6f1e; --purple: #8e44ad; --ok: #1e8449;
    --side-w: 232px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', "Segoe UI", Tahoma, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ================= شاشة الدخول ================= */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--green) 0%, var(--green-dark) 100%); padding: 20px; }
  .login-card { background: var(--card); border-radius: 18px; padding: 34px 26px; width: 100%; max-width: 390px;
    box-shadow: 0 12px 44px rgba(0,0,0,.28); }
  .login-card h1 { text-align: center; color: var(--green); margin-bottom: 4px; font-size: 2.2rem; }
  .login-card h1 span { color: #d4a017; }
  .login-card p.sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .95rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px; border: 1px solid #d5ddda;
    border-radius: 10px; font-size: 1rem; background: #fff; color: var(--text); }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  .btn { display: inline-block; padding: 12px 20px; border: 0; border-radius: 10px; font-size: 1rem;
    font-weight: 700; cursor: pointer; background: var(--green); color: #fff; }
  .btn.block { display: block; width: 100%; }
  .btn.ghost { background: #eef2f0; color: var(--text); }
  .btn.danger { background: var(--red); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error-box { background: #fdecea; color: var(--red); border-radius: 8px; padding: 10px 12px;
    font-size: .9rem; margin-bottom: 14px; }

  /* ================= الهيكل ================= */
  #appView { display: flex; min-height: 100vh; }
  aside.side { width: var(--side-w); background: var(--green-dark); color: #fff; padding: 18px 0;
    position: fixed; inset-block: 0; inset-inline-start: 0; overflow-y: auto; z-index: 30; }
  aside.side .brand { padding: 0 20px 16px; font-size: 1.35rem; font-weight: 800; }
  aside.side .brand span { color: var(--gold); }
  aside.side .brand small { display: block; font-weight: 400; font-size: .72rem; opacity: .65; margin-top: 2px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 20px; border: 0;
    background: none; color: rgba(255,255,255,.75); font-size: .95rem; cursor: pointer; text-align: start;
    border-inline-start: 3px solid transparent; }
  .nav-btn:hover { background: rgba(255,255,255,.06); }
  .nav-btn.active { background: rgba(255,255,255,.1); color: #fff; border-inline-start-color: var(--gold); font-weight: 700; }
  .nav-btn .ico { font-size: 1.1rem; width: 24px; text-align: center; }
  .nav-btn .cnt { margin-inline-start: auto; background: var(--red); color: #fff; border-radius: 999px;
    font-size: .7rem; padding: 2px 8px; font-weight: 700; }
  /* عنوان المجموعة: يُقرأ ولا يُنقر — يفصل بالبياض لا بالخطوط. */
  .nav-group { padding: 16px 20px 5px; font-size: .68rem; font-weight: 700; letter-spacing: .03em;
    color: rgba(255,255,255,.4); }
  .nav-group:first-child { padding-top: 4px; }
  .nav-sep { height: 1px; background: rgba(255,255,255,.13); margin: 14px 18px 6px; }
  .side-foot { padding: 16px 20px 4px; font-size: .75rem; color: rgba(255,255,255,.45); }

  .content { flex: 1; margin-inline-start: var(--side-w); display: flex; flex-direction: column; min-width: 0; }
  header.topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 22px;
    display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 25; }
  header.topbar h2 { font-size: 1.15rem; flex: 1; }
  #liveDot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; display: inline-block;
    margin-inline-end: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #adminChip { font-size: .82rem; color: var(--muted); text-align: end; line-height: 1.3; }
  .logout { background: #eef2f0; color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px;
    cursor: pointer; font-size: .85rem; }
  main { padding: 20px 22px 90px; max-width: 1280px; width: 100%; }

  /* الشريط السفلي (جوال) */
  nav.bottom { display: none; position: fixed; bottom: 0; inset-inline: 0; background: var(--green-dark);
    z-index: 40; overflow-x: auto; padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom .row { display: flex; min-width: max-content; }
  nav.bottom button { flex: 1; min-width: 68px; padding: 8px 6px 9px; border: 0; background: none;
    color: rgba(255,255,255,.7); font-size: .66rem; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 3px; position: relative; }
  nav.bottom button .ico { font-size: 1.25rem; }
  nav.bottom button.active { color: var(--gold); font-weight: 700; }
  nav.bottom button .cnt { position: absolute; top: 2px; inset-inline-end: 12px; background: var(--red);
    color: #fff; border-radius: 999px; font-size: .6rem; padding: 1px 5px; }
  @media (max-width: 860px) {
    aside.side { display: none; }
    .content { margin-inline-start: 0; }
    nav.bottom { display: block; }
    main { padding: 14px 14px 84px; }
  }

  /* ================= مكوّنات ================= */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
    border-inline-start: 4px solid var(--green); }
  .kpi .num { font-size: 1.65rem; font-weight: 800; color: var(--green-dark); }
  .kpi .lbl { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .panel { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .panel h3 { font-size: 1rem; margin-bottom: 12px; color: var(--green-dark); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip { border: 1px solid #cfd9d5; background: var(--card); border-radius: 999px; padding: 7px 14px;
    font-size: .85rem; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }
  input.search { flex: 1; min-width: 160px; padding: 9px 14px; border: 1px solid #cfd9d5; border-radius: 999px;
    font-size: .9rem; background: var(--card); }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); cursor: default; }
  .card.click { cursor: pointer; }
  .card.click:hover { outline: 2px solid var(--green-light); }
  .alert-card { border-inline-start: 4px solid var(--orange); padding: 11px 14px; margin-bottom: 8px; }
  .alert-card.sev-red { border-inline-start-color: var(--red); background: #fffafa; }
  .alert-card .title { font-size: .92rem; }
  .alert-mins { font-weight: 800; white-space: nowrap; font-size: .84rem; }
  .alert-head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 12px; }
  .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 700; }
  .meta { color: var(--muted); font-size: .84rem; margin-top: 4px; line-height: 1.75; }
  .badge { display: inline-block; border-radius: 999px; padding: 3px 12px; font-size: .76rem; font-weight: 700; }
  .money { font-weight: 800; color: var(--green); white-space: nowrap; }
  .toggle-btn { border: 1px solid #cfd9d5; background: #fff; border-radius: 8px; padding: 7px 14px;
    cursor: pointer; font-size: .84rem; }
  .toggle-btn.on { background: #e8f6ef; border-color: #27ae60; color: var(--ok); }
  .toggle-btn[disabled] { opacity: .4; cursor: default; }
  .toggle-btn.off { background: #fdecea; border-color: var(--red); color: var(--red); }
  select.inline-sel { padding: 7px 10px; border-radius: 8px; border: 1px solid #cfd9d5; font-size: .84rem; background: #fff; }
  .doc-tile { background: rgba(0,0,0,.03); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; text-align: center; cursor: pointer; }
  .doc-tile:hover { border-color: var(--green); }
  .doc-tile img { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; background: #eef1f6; }
  .doc-tile .cap { font-size: .76rem; margin-top: 6px; color: var(--muted); }
  .doc-tile.miss { opacity: .55; cursor: default; }
  .doc-tile.miss .ph { height: 96px; display: flex; align-items: center; justify-content: center;
    background: #f2f4f8; border-radius: 8px; color: var(--muted); font-size: .78rem; }
  .doc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0 4px; }
  @media (max-width: 700px) { .doc-grid { grid-template-columns: repeat(2, 1fr); } }
  /* عارض المستند: المراجعة الحقيقية قراءةُ رقم إقامة وتاريخ انتهاء رخصة،
     فلا تكفي المصغّرات. والتدوير ضروري لا كمالي — صور الجوال تصل مقلوبة. */
  #viewer { position: fixed; inset: 0; z-index: 200; background: rgba(6,16,36,.94);
    display: flex; flex-direction: column; }
  #viewer.hidden { display: none; }
  #viewer .bar { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; align-items: center;
    justify-content: center; background: rgba(0,0,0,.35); }
  #viewer .bar b { color: #fff; margin-inline-end: auto; padding-inline-start: 6px; }
  #viewer .bar button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .9rem; }
  #viewer .stage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; }
  #viewer img { transform-origin: center; transition: transform .15s; max-width: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .loading { text-align: center; color: var(--muted); padding: 30px; }
  table.rep { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.rep th, table.rep td { padding: 9px 8px; text-align: start; border-bottom: 1px solid var(--line); }
  table.rep th { color: var(--muted); font-weight: 700; font-size: .78rem; }
  .table-wrap { overflow-x: auto; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding-top: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .bar { width: 100%; max-width: 42px; background: var(--green); border-radius: 6px 6px 0 0; min-height: 3px;
    transition: height .4s; }
  .bar.gold { background: var(--gold); }
  .bar-lbl { font-size: .66rem; color: var(--muted); white-space: nowrap; }
  .bar-val { font-size: .68rem; font-weight: 700; color: var(--green-dark); }

  /* نافذة منبثقة */
  #modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex;
    align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { #modalBack { align-items: center; } }
  #modalBox { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 20px; }
  @media (min-width: 640px) { #modalBox { border-radius: 18px; } }
  #modalBox h3 { color: var(--green-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .x-btn { border: 0; background: #eef2f0; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line);
    font-size: .9rem; gap: 10px; }
  .kv b { white-space: nowrap; }
  .kv:last-child { border-bottom: 0; }
  .items-list { background: var(--green-light); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: .9rem; }
  .items-list div { display: flex; justify-content: space-between; padding: 3px 0; }
  .toast { position: fixed; bottom: 90px; inset-inline: 0; margin: auto; width: fit-content; max-width: 90%;
    background: var(--green-dark); color: #fff; border-radius: 999px; padding: 11px 22px; font-size: .9rem;
    z-index: 70; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
</style>
<script>
/* منع التأطير — `frame-ancestors` في وسم meta تتجاهله المتصفحات (تعمل في
 * ترويسة HTTP وحدها، وGitHub Pages لا تسمح بترويسات مخصصة). فلو أطّر أحدٌ
 * هذه الصفحة داخل موقعه لأمكنه خداع المدير على النقر فيما لا يقصده. هذا
 * السطر يكسر الإطار: الصفحة تُخرج نفسها إلى الأعلى إن وجدت نفسها بداخله. */
if (window.top !== window.self) { window.top.location = window.self.location; }
</script>
</head>
<body>

<!-- ================= الدخول ================= -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <img src="../images/zadgo-logo.png" alt="ZadGo" style="display:block;height:52px;margin:0 auto 14px;background:var(--green-dark);border-radius:12px;padding:9px 16px">
    <p class="sub">لوحة التحكم — دخول المدير العام فقط</p>
    <div id="loginError" class="error-box hidden"></div>
    <div class="field"><label>البريد الإلكتروني</label>
      <input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label>كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password" required></div>
    <button class="btn block" id="loginBtn" type="submit">دخول</button>
  </form>
</div>

<!-- ================= اللوحة ================= -->
<div id="appView" class="hidden">
  <aside class="side">
    <div class="brand"><img src="../images/zadgo-logo.png" alt="ZadGo" style="height:34px;display:block"><small>لوحة التحكم الإدارية</small></div>
    <div id="sideNav"></div>
    <div class="side-foot">zadgo.co © 2026</div>
  </aside>
  <div class="content">
    <header class="topbar">
      <h2 id="pageTitle"><span id="liveDot"></span>نظرة عامة</h2>
      <div id="adminChip"></div>
      <button class="logout" id="logoutBtn">خروج</button>
    </header>
    <main id="main"></main>
  </div>
  <nav class="bottom"><div class="row" id="bottomNav"></div></nav>
</div>

<div id="modalBack" class="hidden"><div id="modalBox"></div></div>
<div id="viewer" class="hidden">
  <div class="bar">
    <b id="vTitle"></b>
    <button data-v="rot-">⟲ تدوير</button><button data-v="rot+">⟳ تدوير</button>
    <button data-v="out">− تصغير</button><button data-v="in">+ تكبير</button>
    <button data-v="reset">إعادة الضبط</button><button data-v="tab">↗ تبويب جديد</button>
    <button data-v="close">✕ إغلاق</button>
  </div>
  <div class="stage"><img id="vImg" alt=""></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, orderBy, where,
  limit, onSnapshot, getDocs, writeBatch, runTransaction, Timestamp, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBoAvj7C2vJyzERVnK26Oa-dJZ1mV0vO6g',
  authDomain: 'restaurant-app-ed699.firebaseapp.com',
  projectId: 'restaurant-app-ed699',
});
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const SAR = 'ر.س';

/* ---------------- ثوابت وترجمات ---------------- */
const STATUS_AR = {
  created: ['جديد', '#7f8c8d'], restaurantPending: ['بانتظار المطعم', '#ca6f1e'],
  restaurantAccepted: ['قبله المطعم', '#2471a3'], preparing: ['قيد التحضير', '#2471a3'],
  readyForPickup: ['جاهز للاستلام', '#8e44ad'], searchingDriver: ['البحث عن سائق', '#ca6f1e'],
  driverAssigned: ['أُسند لسائق', '#2471a3'], pickedUp: ['استلمه السائق', '#2471a3'],
  onTheWay: ['في الطريق', '#117a65'], delivered: ['تم التوصيل', '#1e8449'],
  restaurantRejected: ['رفضه المطعم', '#c0392b'], noDriverFound: ['لا يوجد سائق', '#c0392b'],
  cancelled: ['ملغي', '#c0392b'], refunded: ['مسترد', '#7f8c8d'],
  pending: ['بانتظار المطعم', '#ca6f1e'], confirmed: ['قبله المطعم', '#2471a3'],
  outForDelivery: ['في الطريق', '#117a65'],
};
const ACTIVE_STATUSES = ['created','restaurantPending','restaurantAccepted','preparing','readyForPickup',
  'searchingDriver','driverAssigned','pickedUp','onTheWay','pending','confirmed','outForDelivery'];
const CANCELLED_STATUSES = ['cancelled','restaurantRejected','noDriverFound','refunded'];
const ROLE_AR = { admin: 'مدير عام', customer: 'عميل', driver: 'سائق', restaurantManager: 'مدير مطعم' };
const PAY_AR = { cash: 'كاش عند الاستلام', card: 'بطاقة', wallet: 'محفظة' };
const COMPLAINT_STATUS_AR = { open: 'مفتوحة', inProgress: 'قيد المعالجة', resolved: 'محلولة', closed: 'مغلقة' };
const COMPLAINT_TYPE_AR = { lateDelivery: 'تأخر التوصيل', wrongOrder: 'طلب خاطئ', badQuality: 'جودة سيئة',
  driverBehavior: 'سلوك السائق', other: 'أخرى' };

/* ---------------- ترتيب القائمة ----------------
 * القائمة مجموعاتٌ لا قائمةً واحدة طويلة. المعيار في الترتيب هو **متى**
 * تُفتح الصفحة لا متى بُنيت: ما يُفتح كل صباح أولاً، وما يُفتح آخر الشهر
 * أخيراً. ولهذا جاورت كل صفحةٍ أختها التي تُستعمل معها — «إدارة المنيو»
 * و«استيراد منيو» كانتا على طرفَي القائمة وهما عملٌ واحد.
 *
 * لا صفحة حُذفت ولا صفحتان دُمجتا: العشرون كلّها هنا، وكل عدّاداتها كما هي.
 * المجموعة بلا عنوان تعني فاصلاً في الأسفل (الإعدادات وحدها).
 *
 * `PAGES` تُشتقّ من المجموعات ولا تُكتب يدوياً، حتى لا يفترق الاثنان:
 * صفحةٌ تُضاف إلى مجموعة تظهر في الشريطين معاً بلا خطوةٍ ثانية. */
const NAV_GROUPS = [
  ['التشغيل اليومي', [
    ['dashboard', '📊', 'نظرة عامة'],
    ['orders', '🧾', 'الطلبات'],
    ['applications', '🪪', 'طلبات الكباتن'],
    ['complaints', '📮', 'الشكاوى'],
  ]],
  ['المال', [
    ['wallets', '👛', 'محافظ العملاء'],
    ['payouts', '💸', 'طلبات السحب'],
    ['settlements', '💰', 'تسويات المطاعم'],
  ]],

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function badge(text, color) { return `<span class="badge" style="background:${color}1a;color:${color}">${esc(text)}</span>`; }
function toDate(v) {
  if (!v) return null;
  if (v.toDate) return v.toDate();
  if (typeof v === 'number') return new Date(v);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function fmtTime(v) {
  const d = toDate(v);
  return d ? d.toLocaleString('ar-SA', { dateStyle: 'short', timeStyle: 'short' }) : '—';
}
function fmtMoney(n) { return (Number(n) || 0).toFixed(2); }
function itemsTotal(o) {
  return (o.items || []).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.quantity) || 1), 0);
}
function orderTotal(o) { return itemsTotal(o) + (Number(o.driverShare) || 0) + (Number(o.appShare) || 0); }

/* ما حُصّل فعلاً نقداً أو بالبطاقة = الإجمالي − خصم الكوبون − ما دُفع من
 * المحفظة. بدون هذا الطرح تبدو تقارير التحصيل أكبر من الواقع. يطابق
 * payableTotal − walletUsed في نموذج التطبيق. */
function collectedTotal(o) {
  return orderTotal(o) - (Number(o.discountAmount) || 0) - (Number(o.walletUsed) || 0);
}
/* التسعير الموحّد — نسخة طبق الأصل من Pricing في lib/utils/helpers.dart.
 * يُعرض في اللوحة للاطّلاع فقط؛ مصدر الحقيقة كود التطبيق، وأي تغيير هنا
 * لا يغيّر شيئاً في الطلبات. */
const PRICING = {
  appCommissionRate: 0.15,
  baseDeliveryFee: 9,
  baseDeliveryKm: 7,
  perExtraKmFee: 1,
  fixedDeliveryCommission: 3,
  maxDeliveryDistanceKm: 25,
};

/* عمولة المنصة على الطلب: تُقرأ من الطلب نفسه لا تُعاد حسابها.
 * إعادة الحساب بـ15% كانت تعطي رقماً مختلفاً عن المحتسب فعلاً متى تغيّرت
 * النسبة أو خُصم كوبون، فتظهر تقارير لا تطابق ما جرى. */
function commission(o) {
  const stored = Number(o.platformCommission);
  if (Number.isFinite(stored) && stored > 0) return stored;
  return itemsTotal(o) * PRICING.appCommissionRate; // طلبات قديمة قبل الحقل
}

/* سطر إثبات الدفع بالبطاقة. وجود paymentId من بوابة «ميسر» هو الدليل الوحيد
 * على تحصيل فعلي؛ طلب مُعلَّم مدفوعاً بالبطاقة بلا معرّف عملية حالة تستحق
 * التدقيق (قد يكون عُلّم يدوياً أو فشل تسجيل الدفع). */
function paymentProofRow(o) {
  const method = String(o.paymentMethod || '');
  const isCard = method.includes('card') || method.includes('بطاقة');
  if (!isCard) return '';
  if (o.paymentId) {
    return `<div class="kv"><span>مرجع الدفع (ميسر)</span><b style="direction:ltr;font-size:.8rem">${esc(o.paymentId)}</b></div>`;
  }
  return `<div class="kv"><span>مرجع الدفع (ميسر)</span>
    <b style="color:var(--red)">⚠️ غير موجود — يستحق التدقيق</b></div>`;
}

function startListeners() {
  const bind = (q2, key, after) => unsubs.push(onSnapshot(q2, (qs) => {
    S[key] = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (after) after();
    rerender();
  }, (err) => { console.error(key, err); }));

  // حدّ الطلبات المحمَّلة. تسويات المطاعم تُحسب من هذه الطلبات، فبلوغ الحدّ
  // يعني أن المستحق محسوب على فترة جزئية لا على كامل التاريخ — تُعلنه صفحة
  // التسويات صراحةً بدل أن تعرض رقماً ناقصاً كأنه كامل.
  bind(query(collection(db, 'orders'), orderBy('createdAt', 'desc'), limit(ORDERS_LIMIT)), 'orders');
  bind(collection(db, 'restaurants'), 'restaurants');
  bind(query(collection(db, 'users'), limit(400)), 'users');
  bind(collection(db, 'drivers'), 'drivers');
  bind(query(collection(db, 'complaints'), orderBy('createdAt', 'desc'), limit(150)), 'complaints');
  bind(query(collection(db, 'broadcasts'), orderBy('createdAt', 'desc'), limit(40)), 'broadcasts');
  // الكوبونات: معرّف المستند هو الكود نفسه، فالترتيب بـcreatedAt يحتاج وجود
  // الحقل في كل مستند — نرتّب محلياً بدلاً من ذلك تفادياً لسقوط الاستعلام.
  bind(query(collection(db, 'restaurant_settlements'), limit(500)), 'settlements');
  bind(query(collection(db, 'wallet_transactions'), limit(500)), 'walletTxns');
  bind(query(collection(db, 'reassignments'), limit(200)), 'reassignments');
  bind(query(collection(db, 'registrationCodes'), limit(200)), 'regCodes');
  bind(query(collection(db, 'driver_applications'), limit(200)), 'applications');
  bind(query(collection(db, 'banners'), limit(60)), 'banners');
  bind(query(collection(db, 'payout_requests'), orderBy('createdAt', 'desc'), limit(200)), 'payouts');
  bind(query(collection(db, 'coupons'), limit(200)), 'coupons');
  bind(query(collection(db, 'coupon_usages'), limit(500)), 'couponUsages');
  unsubs.push(onSnapshot(doc(db, 'delivery_settings', 'config'),
    (d) => { S.settings = d.exists() ? d.data() : {}; if (page === 'settings') rerender(); },
    () => {}));
  // مستند منفصل عن `config` عمداً: التطبيق يقرأ هذا **قبل تسجيل الدخول**،
  // فلا يصحّ دفنه في مستندٍ قراءتُه مقصورة على المدير.
  unsubs.push(onSnapshot(doc(db, 'delivery_settings', 'app'),
    (d) => { appMinVersion = String(d.data()?.minAppVersion || ''); if (page === 'settings') rerender(); },
    () => {}));
}

/* عدّاد ما ينتظر تدخّل الإدارة على كل صفحة — الشكاوى المفتوحة وطلبات
 * السحب المعلّقة. طلب سحب لا يراه أحد يعني سائقاً ينتظر ماله بلا ردّ. */
function navCount(k) {
  if (k === 'dashboard') return computeAlerts().filter((a) => a.sev === 'red').length;
  if (k === 'applications') return S.applications.filter((a) => (a.status || 'pending') === 'pending').length;
  if (k === 'complaints') return S.complaints.filter((c) => c.status === 'open').length;
  if (k === 'payouts') return S.payouts.filter((p) => (p.status || 'pending') === 'pending').length;
  return 0;
}
/* الشريط الجانبي مجموعات معنونة. الشريط السفلي (الجوال) يبقى مسطّحاً بالترتيب
 * نفسه: عناوين المجموعات لا تسع في شريطٍ سفلي، والترتيب وحده يكفي هناك. */
function navHtml() {
  return NAV_GROUPS.map(([title, items]) => {
    const head = title ? `<div class="nav-group">${title}</div>` : '<div class="nav-sep"></div>';
    return head + items.map(([k, ico, lbl]) => {
      const n = navCount(k);
      return `
    <button class="nav-btn ${k === page ? 'active' : ''}" data-page="${k}">
      <span class="ico">${ico}</span><span>${lbl}</span>
      ${n ? `<span class="cnt">${n}</span>` : ''}
    </button>`;
    }).join('');
  }).join('');
}
function renderNav() {
  $('sideNav').innerHTML = navHtml();
  $('bottomNav').innerHTML = PAGES.map(([k, ico, lbl]) => {
    const n = navCount(k);
    return `
    <button class="${k === page ? 'active' : ''}" data-page="${k}">
      <span class="ico">${ico}</span>${lbl}
      ${n ? `<span class="cnt">${n}</span>` : ''}
    </button>`;
  }).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]');
  if (b) go(b.dataset.page);
});
function go(p) {
  // مستمعا المنيو مرتبطان بمطعم واحد ولا معنى لبقائهما بعد مغادرة الصفحة.
  if (page === 'menu' && p !== 'menu') stopMenuListeners();

 * العتبات هي نفسها التي يقرؤها التطبيق من `delivery_settings/config`،
 * والحساب يطابق حرفياً منطق `order_tracking_tab.dart` في تطبيق الإدارة —
 * لو اختلفا لظهر الطلب متأخراً في شاشة وسليماً في الأخرى، وهذا أسوأ من
 * غياب التنبيه أصلاً لأنه يُفقد الثقة بالاثنتين.
 *
 * مرجع العمر: `statusChangedAt` (لحظة دخول الحالة الراهنة) لا `createdAt`،
 * إلا في تنبيه التأخير العام فمرجعه عمر الطلب كاملاً.
 */
const BASELINE_DELIVERY_MIN = 30;   // تقدير خام لزمن التوصيل — يطابق _baselineExpectedDeliveryMinutes
const DEFAULT_COMPLAINT_WINDOW_MIN = 120;
const PAYOUT_WINDOW_MIN = 24 * 60;  // طلب سحب لم يُبتّ خلال يوم = سائق ينتظر ماله
const ALERTS_SHOWN = 12;

function timeoutSettings() {
  const s = S.settings || {};
  return {
    restaurant: Math.max(1, Number(s.restaurantResponseTimeoutMinutes) || 5),
    driver: Math.max(1, Number(s.driverSearchTimeoutMinutes) || 10),
    lateGrace: Math.max(1, Number(s.lateDeliveryThresholdMinutes) || 15),
    complaint: Math.max(1, Number(s.complaintResponseMinutes) || DEFAULT_COMPLAINT_WINDOW_MIN),
  };
}
function minutesSince(v) {
  const d = toDate(v);
  return d ? Math.floor((Date.now() - d.getTime()) / 60000) : null;
}
function durAr(m) {
  if (m == null) return '—';
  if (m < 60) return `${m} د`;
  const h = Math.floor(m / 60); const r = m % 60;
  if (h < 24) return r ? `${h} س ${r} د` : `${h} س`;
  const dd = Math.floor(h / 24); const hr = h % 24;
  return hr ? `${dd} ي ${hr} س` : `${dd} ي`;
}

/* كل طلب يُنتج تنبيهاً واحداً على الأكثر — التنبيه الأخصّ يفوز، فلا يظهر
 * الطلب العالق عند المطعم مرتين (مرة «لم يستجب» ومرة «متأخر»). */
function computeAlerts() {
  const t = timeoutSettings();
  const out = [];

  S.orders.forEach((o) => {
    const label = `#${o.orderNumber || o.id.slice(0, 6)} — ${o.restaurantName || 'مطعم'}`;

    if (o.status === 'noDriverFound') {
      out.push({ sev: 'red', mins: minutesSince(o.statusChangedAt || o.createdAt) || 0, icon: '🛑',
        title: `لا يوجد سائق — ${label}`,
        detail: 'انتهت مهلة البحث ولم يقبله أي سائق — يحتاج إسناداً يدوياً أو إلغاءً.',
        orderId: o.id });
      return;
    }
    if (!ACTIVE_STATUSES.includes(o.status)) return;

    if (o.status === 'restaurantPending' || o.status === 'pending') {
      const m = minutesSince(o.statusChangedAt || o.createdAt);
      if (m != null && m >= t.restaurant) {
        out.push({ sev: m >= t.restaurant * 3 ? 'red' : 'orange', mins: m, icon: '🍽️',
          title: `المطعم لم يستجب — ${label}`,
          detail: `مضى ${durAr(m)} والمهلة ${t.restaurant} د — اتصل بالمطعم أو ألغِ الطلب.`,
          orderId: o.id });
        return;
      }
    }
    if (o.status === 'searchingDriver') {
      const m = minutesSince(o.statusChangedAt || o.createdAt);
      if (m != null && m >= t.driver) {
        out.push({ sev: 'red', mins: m, icon: '🛵',
          title: `البحث عن سائق تجاوز المهلة — ${label}`,
          detail: `مضى ${durAr(m)} والمهلة ${t.driver} د — أسنِد سائقاً يدوياً.`,
          orderId: o.id });
        return;
      }
    }
    const age = minutesSince(o.createdAt);
    const limit = BASELINE_DELIVERY_MIN + t.lateGrace;
    if (age != null && age > limit) {
      const st = (STATUS_AR[o.status] || [o.status])[0];
      out.push({ sev: 'orange', mins: age, icon: '⏰',
        title: `طلب متأخر — ${label}`,
        detail: `مضى ${durAr(age)} على إنشائه (الحدّ ${limit} د) — الحالة الآن: ${st}.`,
        orderId: o.id });
    }
  });

  S.complaints.forEach((c) => {
    if (c.status !== 'open') return;
    const m = minutesSince(c.createdAt);
    if (m == null || m < t.complaint) return;
    out.push({ sev: m >= t.complaint * 2 ? 'red' : 'orange', mins: m, icon: '⚠️',
      title: `شكوى بلا معالجة — ${COMPLAINT_TYPE_AR[c.type] || c.type || 'شكوى'}`,
      detail: `${c.customerName || 'عميل'} — مضى ${durAr(m)} والنافذة ${durAr(t.complaint)}.`,
      goPage: 'complaints' });
  });

  S.payouts.forEach((p) => {
    if ((p.status || 'pending') !== 'pending') return;
    const m = minutesSince(p.createdAt || p.requestedAt);
    if (m == null || m < PAYOUT_WINDOW_MIN) return;
    out.push({ sev: 'orange', mins: m, icon: '💸',
      title: `طلب سحب معلّق — ${p.driverName || 'سائق'}`,
      detail: `${fmtMoney(p.amount)} ${SAR} — مضى ${durAr(m)} بلا بتّ.`,
      goPage: 'payouts' });
  });

  const rank = (a) => (a.sev === 'red' ? 0 : 1);
  return out.sort((a, b) => rank(a) - rank(b) || (b.mins || 0) - (a.mins || 0));
}

function alertRow(a) {
  const attr = a.orderId ? `data-order="${esc(a.orderId)}"` : `data-page="${esc(a.goPage)}"`;
  const col = a.sev === 'red' ? 'var(--red)' : 'var(--orange)';
  return `<div class="card click alert-card sev-${a.sev}" ${attr}>
    <div class="row1"><span class="title">${a.icon} ${esc(a.title)}</span>
      <span class="alert-mins" style="color:${col}">${esc(durAr(a.mins))}</span></div>
    <div class="meta">${esc(a.detail)}</div>
  </div>`;
}
function alertsPanelHtml() {
  const alerts = computeAlerts();
  if (!alerts.length) {
    return `<div class="panel">
      <div class="alert-head"><h3 style="margin:0">🔔 التنبيهات التشغيلية</h3>
        ${badge('لا شيء يحتاج تدخّلاً', '#1e8449')}</div>
      <div class="empty" style="padding:16px">كل شيء يسير ضمن المُهل ✅</div></div>`;
  }
  const red = alerts.filter((a) => a.sev === 'red').length;
  const shown = alerts.slice(0, ALERTS_SHOWN);
  const rest = alerts.length - shown.length;
  return `<div class="panel">
    <div class="alert-head"><h3 style="margin:0">🔔 التنبيهات التشغيلية</h3>
      <span>${red ? badge(`${red} عاجل`, '#c0392b') + ' ' : ''}${badge(`${alerts.length} تنبيه`, '#ca6f1e')}</span></div>
    ${shown.map(alertRow).join('')}
    ${rest ? `<div class="meta" style="text-align:center;margin-top:8px">و${rest} تنبيهاً آخر — تابعها من صفحة الطلبات النشطة</div>` : ''}
  </div>`;
}

function renderDashboard() {
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const active = S.orders.filter((o) => ACTIVE_STATUSES.includes(o.status));
  const revenueToday = deliveredToday.reduce((s, o) => s + orderTotal(o), 0);
  const commToday = deliveredToday.reduce((s, o) => s + commission(o) + (Number(o.appShare) || 0), 0);
  const onlineDrivers = S.drivers.filter((d) => d.isOnline).length;
  const openRest = S.restaurants.filter((r) => r.isOpen).length;
  const openComp = S.complaints.filter((c) => c.status === 'open').length;

  // آخر ٧ أيام
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0); d0.setDate(d0.getDate() - i);
    const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
    const list = S.orders.filter((o) => { const d = toDate(o.createdAt); return d && d >= d0 && d < d1; });
    days.push({
      lbl: d0.toLocaleDateString('ar-SA', { weekday: 'short' }),
      count: list.length,
      rev: list.filter((o) => o.status === 'delivered').reduce((s, o) => s + orderTotal(o), 0),
    });
  }
  const maxC = Math.max(1, ...days.map((d) => d.count));
  const maxR = Math.max(1, ...days.map((d) => d.rev));

  // أكثر المطاعم طلبات (آخر ٧ أيام)
  const week = new Date(); week.setDate(week.getDate() - 7);
  const perRest = {};
  S.orders.forEach((o) => {
    const d = toDate(o.createdAt); if (!d || d < week) return;
    perRest[o.restaurantName] = (perRest[o.restaurantName] || 0) + 1;
  });
  const topRest = Object.entries(perRest).sort((a, b) => b[1] - a[1]).slice(0, 5);

  $('main').innerHTML = `
    ${alertsPanelHtml()}
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${todays.length}</div><div class="lbl">طلبات اليوم</div></div>
      <div class="kpi"><div class="num">${deliveredToday.length}</div><div class="lbl">مُوصَّلة اليوم</div></div>
      <div class="kpi" style="border-color:${active.length ? '#ca6f1e' : 'var(--green)'}">
        <div class="num">${active.length}</div><div class="lbl">طلبات نشطة الآن</div></div>
      <div class="kpi"><div class="num">${fmtMoney(revenueToday)}</div><div class="lbl">مبيعات اليوم (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(commToday)}</div><div class="lbl">أرباح المنصة اليوم (${SAR})</div></div>
      <div class="kpi"><div class="num">${onlineDrivers}<small style="font-size:.9rem;color:var(--muted)">/${S.drivers.length}</small></div>
        <div class="lbl">سائقون متصلون</div></div>
      <div class="kpi"><div class="num">${openRest}<small style="font-size:.9rem;color:var(--muted)">/${S.restaurants.length}</small></div>
        <div class="lbl">مطاعم مفتوحة</div></div>
      <div class="kpi" style="border-color:${openComp ? 'var(--red)' : 'var(--green)'}">
        <div class="num">${openComp}</div><div class="lbl">شكاوى مفتوحة</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>الطلبات — آخر ٧ أيام</h3>
        <div class="bars">${days.map((d) => `
          <div class="bar-col"><span class="bar-val">${d.count}</span>
            <div class="bar" style="height:${Math.round((d.count / maxC) * 95)}px"></div>
            <span class="bar-lbl">${d.lbl}</span></div>`).join('')}
        </div>
      </div>
      <div class="panel"><h3>المبيعات (${SAR}) — آخر ٧ أيام</h3>
        <div class="bars">${days.map((d) => `
          <div class="bar-col"><span class="bar-val">${Math.round(d.rev)}</span>
            <div class="bar gold" style="height:${Math.round((d.rev / maxR) * 95)}px"></div>
            <span class="bar-lbl">${d.lbl}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>أنشط المطاعم (٧ أيام)</h3>
        ${topRest.length ? topRest.map(([n, c]) => `
          <div class="kv"><span>${esc(n || '—')}</span><b>${c} طلب</b></div>`).join('')
          : '<div class="empty">لا بيانات بعد</div>'}
      </div>
      <div class="panel"><h3>أحدث الطلبات</h3>
        ${S.orders.slice(0, 4).map(orderCard).join('') || '<div class="empty">لا توجد طلبات بعد</div>'}
      </div>
    </div>`;

  let list = S.orders;
  if (orderFilter === 'active') list = list.filter((o) => ACTIVE_STATUSES.includes(o.status));

  if (pb) pb.addEventListener('click', () => loadOrderProof(o.id));
  const ab = document.getElementById('assignBtn');
  if (ab) ab.addEventListener('click', () => showAssignModal(o.id));
  document.querySelectorAll('[data-nextst]').forEach((b) =>
    b.addEventListener('click', () => pushStatus(o.id, b.dataset.nextst)));
  const cb = document.getElementById('cancelOrderBtn');
  if (cb) cb.addEventListener('click', async () => {
    const wallet = Number(o.walletUsed) || 0;
    const warn = wallet > 0
      ? `\n\nسيُعاد ${fmtMoney(wallet)} ${SAR} إلى محفظة العميل.`
      : '';
    if (!confirm('إلغاء هذا الطلب نهائياً؟ لا يمكن التراجع.' + warn)) return;

      await updateDoc(doc(db, 'orders', o.id), { status: 'cancelled', statusChangedAt: serverTimestamp() });

      closeModal();
    } catch (err) { alert('تعذر الإلغاء: ' + (err.code || err.message)); }
  });
}

/* ---------------- دفع حالة الطلب يدوياً ----------------
 *
 * التطبيق ينقل الحالات بثلاث دوال لا بواحدة، ولكلٍّ أثر مالي مختلف — وهذا
 * أخطر ما في هذه الميزة: زرٌّ ساذج يكتب `status` وحده يبدو ناجحاً ويترك
 * الدفاتر ناقصة بصمت.
 *
 * • الحالات الوسطى (قبول المطعم، التحضير، الجاهزية، البحث عن سائق):
 *   كتابة حالة خالصة — لا أثر مالي. (`updateOrderStatus`)
 * • **«في الطريق»**: لحظة انتقال العُهدة. الطلب النقدي تُقيَّد قيمته على
 *   دفتر السائق هنا لا عند التسليم. (`markPickedUpBySelf`)
 * • **«تم التوصيل»**: `isPaid` وعمولة المنصة وعدّاد توصيلات السائق
 *   و**تفريغه لطلب جديد** (`isAvailable`) وأجرته إن كان الدفع إلكترونياً.
 *   إغفال `isAvailable` وحده يُجمّد السائق فلا يصله طلب بعدها. (`markOrderDelivered`)
 * • **رفض المطعم**: إنهاءٌ بلا خدمة، فيُعاد رصيد المحفظة كالإلغاء.
 *
 * وكله داخل معاملة ذرّية واحدة تقرأ الطلب من الخادم أولاً: بين فتح النافذة
 * والضغط قد يكون السائق أنهى الطلب من جوّاله، فلا يُحتسب مرّتين.
 */
const NEXT_STATUS = {
  restaurantPending:  [['restaurantAccepted', '✅ قبول الطلب'], ['restaurantRejected', '✖️ رفض المطعم']],
  pending:            [['restaurantAccepted', '✅ قبول الطلب'], ['restaurantRejected', '✖️ رفض المطعم']],
  restaurantAccepted: [['preparing', '👨‍🍳 بدء التحضير']],
  confirmed:          [['preparing', '👨‍🍳 بدء التحضير']],
  preparing:          [['readyForPickup', '📦 جاهز للاستلام']],
  readyForPickup:     [['searchingDriver', '🔎 بدء البحث عن سائق'], ['onTheWay', '🛵 استلمه السائق']],
  driverAssigned:     [['onTheWay', '🛵 استلمه السائق']],
  pickedUp:           [['onTheWay', '🛵 في الطريق']],
  onTheWay:           [['delivered', '🏠 تم التوصيل']],
  outForDelivery:     [['delivered', '🏠 تم التوصيل']],
};

function nextStatusHtml(o) {
  const opts = NEXT_STATUS[o.status] || [];
  if (!opts.length) return '';
  return `<div style="margin-top:14px">
    <div class="meta" style="margin-bottom:6px">دفع الحالة يدوياً — حين لا يحدّثها المطعم أو السائق:</div>
    <div class="row1" style="gap:6px;justify-content:flex-start">
      ${opts.map(([k, lbl]) => `<button class="toggle-btn" data-nextst="${k}">${lbl}</button>`).join('')}
    </div></div>`;
}

async function pushStatus(orderId, to) {
  const o = S.orders.find((x) => x.id === orderId);
  if (!o) return;
  const label = (STATUS_AR[to] || [to])[0];
  const isCash = o.paymentMethod === 'cash';
  const custody = custodyAmount(o);
  const wallet = Number(o.walletUsed) || 0;

  let reason = '';
  if (to === 'restaurantRejected') {
    reason = (prompt('سبب رفض المطعم (يظهر للعميل):', '') || '').trim();
    if (!reason) { alert('اكتب سبب الرفض'); return; }
  }

  const warn = [`نقل الطلب #${o.orderNumber || ''} إلى «${label}»؟`];
  if (to === 'onTheWay' && isCash && !o.custodyDebited && custody) {
    warn.push(`⚠️ ستُقيَّد عُهدة ${fmtMoney(Math.abs(custody))} ${SAR} على دفتر السائق.`);
  }
  if (to === 'delivered') {
    if (!o.driverId) { alert('لا يمكن التسليم بلا سائق مُسنَد — أسنِد سائقاً أولاً.'); return; }
    warn.push(isCash
      ? '⚠️ سيُعلَّم الطلب مدفوعاً، ويُفرَّغ السائق لطلب جديد.'
      : `⚠️ ستُقيَّد أجرة ${fmtMoney(Number(o.driverShare) || 0)} ${SAR} لصالح السائق، ويُفرَّغ لطلب جديد.`);
  }
  if (to === 'restaurantRejected' && wallet > 0) {
    warn.push(`⚠️ سيُعاد ${fmtMoney(wallet)} ${SAR} إلى محفظة العميل.`);
  }
  if (!confirm(warn.join('\n'))) return;

  try {
    await runTransaction(db, async (tx) => {
      const oRef = doc(db, 'orders', orderId);
      const snap = await tx.get(oRef);
      if (!snap.exists()) throw new Error('الطلب لم يعد موجوداً');
      const cur = snap.data();
      if (cur.status !== o.status) {
        throw new Error(`تغيّرت حالة الطلب إلى «${(STATUS_AR[cur.status] || [cur.status])[0]}» — أغلق النافذة وأعد المحاولة`);
      }
      const upd = { status: to, updatedAt: serverTimestamp(), statusChangedAt: serverTimestamp() };

      if (to === 'restaurantRejected') {
        upd.rejectionReason = reason;
        tx.update(oRef, upd);
        return;
      }

      // «في الطريق» — قيد العُهدة، نسخة حرفية من markPickedUpBySelf
      if (to === 'onTheWay') {
        const drvId = cur.driverId || '';
        const needs = cur.paymentMethod === 'cash' && !cur.custodyDebited && drvId;
        if (!needs) { tx.update(oRef, upd); return; }
        upd.custodyDebited = true;
        const c = custodyAmount(cur);
        if (!c) { tx.update(oRef, upd); return; }
        const dRef = doc(db, 'drivers', drvId);
        const dSnap = await tx.get(dRef);
        const bal = Number(dSnap.data()?.balance) || 0;
        tx.update(oRef, upd);
        tx.update(dRef, { balance: bal - c });
        tx.set(doc(collection(db, 'driver_transactions')), {
          driverId: drvId, type: 'orderCustody', amount: -c, balanceAfter: bal - c,
          orderId, orderNumber: cur.orderNumber ?? null,
          performedBy: adminUser.uid || '', createdAt: serverTimestamp(),
        });
        return;
      }

      // «تم التوصيل» — نسخة حرفية من markOrderDelivered
      if (to === 'delivered') {
        const drvId = cur.driverId || '';
        if (!drvId) throw new Error('لا سائق على الطلب');
        const dRef = doc(db, 'drivers', drvId);
        const dSnap = await tx.get(dRef);
        const bal = Number(dSnap.data()?.balance) || 0;
        const cash = cur.paymentMethod === 'cash';
        // نقدي: العُهدة قُيّدت عند الاستلام فلا قيد ثانٍ — إلا طلباً استُلم
        // بنسخة قديمة لا تعرف العُهدة، فيُقيَّد هنا كي لا يضيع كلياً.
        const delta = cash ? (cur.custodyDebited ? 0 : -custodyAmount(cur))
                           : (Number(cur.driverShare) || 0);
        upd.isPaid = true;
        upd.platformCommission = itemsTotal(cur) * PRICING.appCommissionRate;
        tx.update(oRef, upd);
        const dUpd = { totalDeliveries: (Number(dSnap.data()?.totalDeliveries) || 0) + 1,
          isAvailable: true };
        if (delta !== 0) dUpd.balance = bal + delta;
        tx.update(dRef, dUpd);
        // حركة صفرية تُلوّث الدفتر بلا معنى، فلا تُكتب.
        if (delta !== 0) {
          tx.set(doc(collection(db, 'driver_transactions')), {
            driverId: drvId, type: cash ? 'deliveryCash' : 'deliveryOnline',
            amount: delta, balanceAfter: bal + delta,
            orderId, orderNumber: cur.orderNumber ?? null,
            performedBy: adminUser.uid || '', createdAt: serverTimestamp(),
          });
        }
        return;
      }

      tx.update(oRef, upd);
    });

    if (to === 'restaurantRejected') await refundWalletOnCancel(o);
    audit('order.status', `نقل الطلب #${o.orderNumber || ''} إلى «${label}»`
      + (reason ? ` — ${reason}` : ''), { target: 'orders/' + orderId });
    toast('نُقل الطلب إلى «' + label + '»');
    closeModal();
  } catch (err) {
    alert('تعذر النقل: ' + (err.message || err.code));
  }
}

/* ---------------- إسناد السائقين وإعادة الإسناد ----------------
 *
 * كان الإسناد اليدوي حكراً على تطبيق الإدارة، فإن جاء تنبيه «لا يوجد سائق»
 * والمالك أمام حاسوبه اضطُر لفتح جوّاله. الآن يتمّ من اللوحة نفسها.
 *
 * الخطر هنا أكبر من أي شاشة سبقته: إعادة إسناد طلبٍ **استُلم فعلاً** تنقل
 * عُهدة النقد من دفتر سائق إلى آخر. لو نُقل الطلب بلا نقل العُهدة لبقي
 * السائق القديم مطالَباً بمالٍ سلّمه لغيره — وهذه محاسبة على بضاعة ليست
 * بيده. لذلك يتم كل شيء داخل **معاملة ذرّية واحدة**: الطلب والسائقان
 * والسجلّ والدفتران معاً، أو لا شيء.
 *
 * (التطبيق ينفّذها على ثلاث دفعات متتابعة؛ اللوحة تجمعها في معاملة واحدة —
 * النتيجة نفس المستندات بالضبط، لكن انقطاع الشبكة في المنتصف لا يترك
 * الدفترين مفترقين.)
 */
const ASSIGNABLE_FROM = ['readyForPickup', 'searchingDriver', 'noDriverFound'];
let assignSearch = '';

/* قيمة العُهدة محسوبة لا مخزّنة — نسخة حرفية من custodyAmount في models.dart.
 * أجرة السائق ليست منها (يستوفيها من النقد)، وخصم الكوبون تتحمّله المنصة. */
function custodyAmount(o) {
  return itemsTotal(o) + (Number(o.appShare) || 0)
    - (Number(o.walletUsed) || 0) - (Number(o.discountAmount) || 0);
}
function custodyOnDriver(o) {
  return o.custodyDebited ? custodyAmount(o) : 0;
}
function driverActiveOrders(driverId) {
  return S.orders.filter((o) => o.driverId === driverId && ACTIVE_STATUSES.includes(o.status)).length;
}

function assignButtonHtml(o) {
  if (o.driverId) return '<button class="btn" id="assignBtn">🔄 تغيير السائق</button>';
  if (ASSIGNABLE_FROM.includes(o.status)) return '<button class="btn" id="assignBtn">🛵 إسناد سائق</button>';
  return '';
}
function assignHintHtml(o) {
  if (o.driverId || ASSIGNABLE_FROM.includes(o.status)) return '';
  return `<p class="meta" style="margin-top:6px">الإسناد يبدأ حين يجهز الطلب للاستلام —
    الحالة الآن «${esc((STATUS_AR[o.status] || [o.status])[0])}».</p>`;
}

function showAssignModal(orderId) {
  const o = S.orders.find((x) => x.id === orderId);
  if (!o) return;
  const isReassign = !!o.driverId;
  const custody = isReassign ? custodyOnDriver(o) : 0;
  assignSearch = '';
  openModal(`
    <h3>${isReassign ? '🔄 تغيير سائق الطلب' : '🛵 إسناد سائق للطلب'} #${esc(o.orderNumber || '')}
      <button class="x-btn" onclick="closeModal()">✕</button></h3>
    ${isReassign ? `<div class="kv"><span>السائق الحالي</span><b>${esc(o.driverName || '—')}</b></div>` : ''}
    ${custody ? `<div class="card" style="border-inline-start:4px solid var(--orange);margin-top:10px">
      <b>⚠️ هذا الطلب استُلم من المطعم</b>
      <div class="meta">ستنتقل عُهدة <b>${fmtMoney(Math.abs(custody))} ${SAR}</b>
        ${custody >= 0 ? 'من دفتر السائق الحالي إلى دفتر الجديد' : 'المستحقة للسائق من دفتره إلى دفتر الجديد'}،
        وتُسجَّل حركتان دائمتان في الدفترين.</div></div>` : ''}
    ${isReassign ? `<div class="field" style="margin-top:10px">
      <label>سبب التغيير (إلزامي — يُسجَّل في سجل إعادة الإسناد ولا يُحذف)</label>
      <input type="text" id="asg_reason" maxlength="120" placeholder="مثال: تعطّلت مركبة السائق"></div>` : ''}
    <input class="search" id="asg_q" placeholder="ابحث باسم السائق أو رقمه" style="margin:10px 0;width:100%">
    <div id="asgList"></div>
    <button class="toggle-btn" id="asg_back" style="margin-top:10px">↩︎ رجوع لتفاصيل الطلب</button>
  `);
  document.getElementById('asg_back').addEventListener('click', () => showOrderModal(orderId));
  const q = document.getElementById('asg_q');
  q.addEventListener('input', () => {
    assignSearch = q.value.trim().toLowerCase();
    renderAssignList(o, isReassign);
  });
  renderAssignList(o, isReassign);
}

/* الترتيب: المتصل المتفرّغ أولاً. المدير يبحث عمّن يستلم الآن، لا عمّن
 * يأتي أولاً في القائمة أبجدياً. */
function renderAssignList(o, isReassign) {
  const box = document.getElementById('asgList');
  if (!box) return;
  let list = S.drivers.filter((d) => d.id !== o.driverId);
  if (assignSearch) {
    list = list.filter((d) => [d.name, d.phone, d.vehiclePlate]
      .some((v) => String(v || '').toLowerCase().includes(assignSearch)));
  }
  const score = (d) => (d.isOnline ? 2 : 0) + (d.isAvailable === false ? 0 : 1);
  list = list.sort((a, b) => score(b) - score(a)
    || String(a.name || '').localeCompare(String(b.name || ''), 'ar'));

  box.innerHTML = list.length ? list.map((d) => {
    const busy = driverActiveOrders(d.id);
    return `<div class="card">
      <div class="row1"><span class="title">🛵 ${esc(d.name || '—')}</span>
        <span>${d.isOnline ? badge('متصل', '#1e8449') : badge('غير متصل', '#7f8c8d')}
          ${d.isAvailable === false ? badge('مشغول', '#ca6f1e') : ''}</span></div>
      <div class="meta">📞 ${esc(d.phone || '—')} — ${esc(d.vehicleType || '')} ${esc(d.vehiclePlate || '')}<br>
        طلبات نشطة الآن: <b>${busy}</b> — الرصيد: ${balanceBadge(Number(d.balance) || 0)}</div>
      <button class="toggle-btn on" data-asgpick="${esc(d.id)}" style="margin-top:8px">
        ${isReassign ? 'انقل الطلب إليه' : 'أسنِد إليه'}</button>
    </div>`;
  }).join('') : '<div class="empty">لا سائق مطابق</div>';

  box.querySelectorAll('[data-asgpick]').forEach((b) => b.addEventListener('click',
    () => doAssign(o.id, b.dataset.asgpick, isReassign)));
}

async function doAssign(orderId, driverId, isReassign) {
  const o = S.orders.find((x) => x.id === orderId);
  const d = S.drivers.find((x) => x.id === driverId);
  if (!o || !d) return;

  let reason = '';
  if (isReassign) {
    reason = (document.getElementById('asg_reason')?.value || '').trim();
    if (reason.length < 3) {
      alert('اكتب سبب التغيير أولاً — يُسجَّل في سجل إعادة الإسناد ولا يمكن حذفه.');
      document.getElementById('asg_reason')?.focus();
      return;
    }
  }
  const custody = isReassign ? custodyOnDriver(o) : 0;
  const lines = [isReassign
    ? `نقل الطلب #${o.orderNumber || ''} من «${o.driverName || '—'}» إلى «${d.name || ''}»؟`
    : `إسناد الطلب #${o.orderNumber || ''} إلى «${d.name || ''}»؟`];
  if (!d.isOnline) lines.push('⚠️ السائق غير متصل الآن — قد لا يصله الطلب حتى يفتح تطبيقه.');
  if (custody) lines.push(`⚠️ ستُنقل عُهدة ${fmtMoney(Math.abs(custody))} ${SAR} بين الدفترين.`);

  if (!confirm(lines.join('\n'))) return;
  try {
    if (isReassign) {
      await reassignDriverWeb(o, d, reason);
      audit('order.reassign',
        `نقل الطلب #${o.orderNumber || ''} من «${o.driverName || '—'}» إلى «${d.name || ''}» — ${reason}`
        + (custody ? ` (نُقلت عُهدة ${fmtMoney(Math.abs(custody))} ${SAR})` : ''),
        { target: 'orders/' + o.id, amount: custody });
    } else {
      await assignDriverWeb(o, d);
      audit('order.assign', `أسنَد الطلب #${o.orderNumber || ''} إلى «${d.name || ''}»`,
        { target: 'orders/' + o.id });
    }
    toast(isReassign ? 'نُقل الطلب للسائق الجديد' : 'أُسنِد الطلب للسائق');
    closeModal();
  } catch (err) {
    alert('تعذر التنفيذ: ' + (err.code || err.message));
  }
}

/* الإسناد الأول. تُقرأ حالة الطلب داخل المعاملة لا من الذاكرة: بين فتح
 * النافذة والضغط قد يكون سائقٌ قَبِل الطلب من تطبيقه، فلا يُسرق منه. */
async function assignDriverWeb(order, driver) {
  await runTransaction(db, async (tx) => {
    const oRef = doc(db, 'orders', order.id);
    const snap = await tx.get(oRef);
    if (!snap.exists()) throw new Error('الطلب لم يعد موجوداً');
    const cur = snap.data();
    if (cur.driverId) throw new Error('أُسنِد هذا الطلب لسائق آخر قبل ثوانٍ');
    if (!ASSIGNABLE_FROM.includes(cur.status)) {
      throw new Error('تغيّرت حالة الطلب إلى «'
        + (STATUS_AR[cur.status] || [cur.status])[0] + '» فلم يعد الإسناد ممكناً');
    }
    tx.update(oRef, {
      driverId: driver.id,
      driverName: driver.name || '',
      driverPhone: driver.phone ?? null,
      status: 'driverAssigned',
      updatedAt: serverTimestamp(),
      statusChangedAt: serverTimestamp(),
      // السائق المتصل يُعتبر مُقرّاً فوراً — نفس شرط assignDriver في التطبيق.
      driverAcknowledged: !!driver.isOnline,
    });
    tx.update(doc(db, 'drivers', driver.id), { isAvailable: false });
  });
}

/* إعادة الإسناد: الطلب + السائقان + سجلّ الإسناد + حركتا العُهدة في معاملة
 * واحدة. القراءات كلها قبل أي كتابة — شرط معاملات Firestore. */
async function reassignDriverWeb(order, driver, reason) {
  await runTransaction(db, async (tx) => {
    const oldId = order.driverId || '';
    const oRef = doc(db, 'orders', order.id);
    const newRef = doc(db, 'drivers', driver.id);
    const oldRef = oldId ? doc(db, 'drivers', oldId) : null;

    const oSnap = await tx.get(oRef);
    if (!oSnap.exists()) throw new Error('الطلب لم يعد موجوداً');
    const cur = oSnap.data();
    if ((cur.driverId || '') !== oldId) {
      throw new Error('تغيّر سائق الطلب قبل ثوانٍ — أغلق النافذة وأعد المحاولة');
    }
    const newSnap = await tx.get(newRef);
    const oldSnap = oldRef ? await tx.get(oldRef) : null;

    // العُهدة تُحسب من نسخة الخادم لا من الذاكرة — الأرقام المالية تُقرأ طازجة.
    const custody = cur.custodyDebited ? custodyAmount(cur) : 0;

    const newUpd = { isAvailable: false };
    const oldUpd = { isAvailable: true };
    if (custody) {
      const oldBal = Number(oldSnap?.data()?.balance) || 0;
      const newBal = Number(newSnap.data()?.balance) || 0;
      oldUpd.balance = oldBal + custody;
      newUpd.balance = newBal - custody;
      const common = { orderId: order.id, orderNumber: cur.orderNumber ?? null,
        performedBy: adminUser.uid || '', createdAt: serverTimestamp() };
      if (oldRef) {
        tx.set(doc(collection(db, 'driver_transactions')), {
          ...common, driverId: oldId, type: 'custodyReversal',
          amount: custody, balanceAfter: oldBal + custody,
          note: 'ردّ العُهدة — نُقل الطلب لسائق آخر',
        });
      }
      tx.set(doc(collection(db, 'driver_transactions')), {
        ...common, driverId: driver.id, type: 'orderCustody',
        amount: -custody, balanceAfter: newBal - custody,
        note: 'إعادة إسناد بعد الاستلام',
      });
    }

    tx.update(oRef, {
      driverId: driver.id,
      driverName: driver.name || '',
      driverPhone: driver.phone ?? null,
      updatedAt: serverTimestamp(),
    });
    tx.update(newRef, newUpd);
    if (oldRef) tx.update(oldRef, oldUpd);

    tx.set(doc(collection(db, 'reassignments')), {
      orderId: order.id,
      orderNumber: cur.orderNumber || '',
      ...(oldId ? { oldDriverId: oldId } : {}),
      ...(order.driverName ? { oldDriverName: order.driverName } : {}),
      newDriverId: driver.id,
      newDriverName: driver.name || '',
      reason,
      performedBy: adminUser.uid || '',
      createdAt: serverTimestamp(),
    });
  });
}

/* يعيد إلى محفظة العميل ما خُصم منها لهذا الطلب عند إلغائه من اللوحة.
 *
 * كانت اللوحة تكتب حالة الإلغاء فقط دون إعادة الرصيد — بعكس التطبيق —
 * فيخسر العميلُ الذي دفع من محفظته مالَه إن أُلغي طلبه من الويب. تُطابق
 * هذه الدالة منطق _refundWalletOnCancel في التطبيق حرفاً بحرف: نفس نوع
 * الحركة (orderReversal) ونفس الحقول، حتى لا يفترق الدفتران.
 *
 * تُستدعى بعد نجاح تغيير الحالة لا قبله: لو فشل الإلغاء، لا يكون رصيد
 * قد أُعيد لطلب ما زال قائماً. وتُنفَّذ داخل معاملة ذرّية فلا يتغيّر
 * الرصيد دون حركة مقابلة في الدفتر. */
async function refundWalletOnCancel(order) {
  const amount = Number(order.walletUsed) || 0;
  if (amount <= 0 || !order.customerId) return;
  await runTransaction(db, async (tx) => {
    const userRef = doc(db, 'users', order.customerId);
    const snap = await tx.get(userRef);
    const current = Number(snap.data()?.walletBalance) || 0;
    const after = current + amount;
    tx.update(userRef, { walletBalance: after });
    tx.set(doc(collection(db, 'wallet_transactions')), {
      userId: order.customerId,
      type: 'orderReversal',
      amount,
      balanceAfter: after,
      orderId: order.id,
      orderNumber: order.orderNumber ?? null,
      note: 'إلغاء الطلب من لوحة التحكم',
      createdAt: serverTimestamp(),
    });
  });
}

/* ================= المطاعم ================= */
function renderRestaurantsPage() {
  const list = [...S.restaurants].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
  $('main').innerHTML = `
    <div class="toolbar">
      <button class="btn" id="newRestBtn">➕ مطعم جديد</button>
      <button class="btn" data-page="import">📥 استيراد منيو لمطعم</button>
    </div>` + list.map((r) => `
    <div class="card">
      <div class="row1">
        <span class="title">${esc(r.emoji || '🍽️')} ${esc(restName(r))}</span>
        <span>
          <button class="toggle-btn ${r.isOpen ? 'on' : 'off'}" data-rtoggle="${r.id}" data-open="${r.isOpen ? 1 : 0}">
            ${r.isOpen ? 'مفتوح ✓' : 'مغلق ✕'}</button>
          <button class="toggle-btn" data-redit="${r.id}">تعديل ✎</button>
        </span>
      </div>
      <div class="meta">
        ${esc(r.address || '')}${r.phone ? ' — 📞 ' + esc(r.phone) : ''}<br>
        الحد الأدنى: ${Number(r.minOrder) || 0} ${SAR}
        — التحضير: ~${Number(r.estimatedTimeMin) || 0} د<br>
        ${ratingText(r)} — الطلبات المسلَّمة: ${deliveredCountFor(r.id)}
      </div>
    </div>`).join('') || '<div class="empty">لا توجد مطاعم بعد</div>';

  $('main').querySelectorAll('[data-rtoggle]').forEach((b) => b.addEventListener('click', async () => {
    const opening = b.dataset.open !== '1';
    if (!confirm(opening ? 'فتح المطعم لاستقبال الطلبات؟' : 'إغلاق المطعم وإيقاف استقبال الطلبات؟')) return;
    try {
      await updateDoc(doc(db, 'restaurants', b.dataset.rtoggle), { isOpen: opening });
      audit('restaurant.toggle', `${opening ? 'فتح' : 'أغلق'} مطعم «${restName(S.restaurants.find((x) => x.id === b.dataset.rtoggle) || {})}»`,
        { target: 'restaurants/' + b.dataset.rtoggle });
      toast('تم التحديث');
    }
    catch (err) { alert('تعذر التعديل: ' + (err.code || err.message)); }
  }));
  $('main').querySelectorAll('[data-redit]').forEach((b) => b.addEventListener('click', () => showRestEdit(b.dataset.redit)));
  $('main').querySelector('#newRestBtn').addEventListener('click', showNewRestaurant);
}

/* إنشاء مطعم جديد — كانت الحلقة الأولى في ضمّ شريك مفقودة من الويب: اللوحة
 * تُصدر كود مدير المطعم وتستورد منيوه، لكن مستند المطعم نفسه لم يكن يُنشأ
 * إلا من التطبيق. فيوقّع المالك اتفاقية على مكتبه ثم يحتاج جوّاله.
 *
 * المستند يُكتب **بنفس شكل `Restaurant.toMap()` حرفاً بحرف** بما فيه حقول
 * التسعير الميتة (البند 0.2): لا يقرؤها أحد، لكن غيابها يجعل مطاعم الويب
 * مختلفة الشكل عن مطاعم التطبيق، وأي قارئ مستقبلي يفترض وجودها يتعطّل. */
function showNewRestaurant() {
  openModal(`
    <h3>مطعم جديد <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div class="field"><label>اسم المطعم *</label><input id="nr_name" placeholder="فطير ستيشن"></div>
    <div class="field"><label>اسم الفرع (اختياري)</label>
      <input id="nr_branch" placeholder="العزيزية">
      <p class="meta">يميّز فرعين لنفس العلامة: «فطير ستيشن — العزيزية».</p></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div class="field"><label>الجوال</label><input id="nr_phone" placeholder="05xxxxxxxx"></div>
      <div class="field"><label>الرمز التعبيري</label><input id="nr_emoji" maxlength="4" placeholder="🥐"></div>
    </div>
    <div class="field"><label>العنوان</label><input id="nr_addr" placeholder="حي العزيزية — شارع ..."></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div class="field"><label>الحد الأدنى للطلب (${SAR})</label>
        <input id="nr_min" type="number" min="0" step="any" value="20"></div>
      <div class="field"><label>زمن التحضير (دقيقة)</label>
        <input id="nr_time" type="number" min="1" step="1" value="30"></div>
    </div>
    <div class="field"><label>وصف قصير (اختياري)</label><input id="nr_desc" maxlength="140"></div>
    <button class="btn block" id="nr_save">إنشاء المطعم</button>
    <p class="meta" style="margin-top:8px">يُنشأ <b>مغلقاً</b> حتى تضيف منيوه — فلا يظهر للعملاء بلا أصناف.
      وبعد الإنشاء: أصدر كود «مدير مطعم» له من صفحة الأكواد، ثم استورد منيوه.</p>
  `);
  document.getElementById('nr_save').addEventListener('click', async () => {
    const v = (k) => document.getElementById('nr_' + k).value.trim();
    const name = v('name');
    if (name.length < 2) { alert('اكتب اسم المطعم'); return; }
    const branchName = v('branch');
    const twin = S.restaurants.find((r) => (r.name || '').trim() === name &&
      (r.branchName || '').trim() === branchName);
    if (twin && !confirm(`يوجد مطعم بنفس الاسم والفرع «${restName(twin)}».\nإنشاء مطعم ثانٍ رغم ذلك؟`)) return;
    const minOrder = Math.max(0, Number(document.getElementById('nr_min').value) || 0);
    const estimatedTimeMin = Math.max(1, Math.round(Number(document.getElementById('nr_time').value) || 30));
    try {
      const ref = await addDoc(collection(db, 'restaurants'), {
        name, branchName,
        description: v('desc'),
        emoji: v('emoji') || '🍽️',
        phone: v('phone'),
        address: v('addr'),
        isOpen: false,
        minOrder, estimatedTimeMin,
        // تقييم افتراضي مع ratingCount = 0 — نفس ما ينتجه منشئ Restaurant في
        // التطبيق، والواجهتان تعرضان «جديد» ما دام العدّاد صفراً.
        rating: 5, ratingCount: 0, totalOrders: 0,
        // حقول تسعير لا تُقرأ (التسعير ثوابت في كود التطبيق) — تُكتب
        // بقيمها الافتراضية ليطابق المستند شكل مطاعم التطبيق.
        driverShareFee: 5, appShareFee: 0, perKmFee: 0, freeKm: 3, deliveryFee: 5,
        lat: null, lng: null, imageUrl: null,
      });
      audit('restaurant.create', `أنشأ مطعم «${name}${branchName ? ' — ' + branchName : ''}»`,
        { target: 'restaurants/' + ref.id });
      toast('أُنشئ المطعم — أضف منيوه ثم افتحه');
      closeModal();
    } catch (err) { alert('تعذر الإنشاء: ' + (err.code || err.message)); }
  });
}

function showRestEdit(id) {
  const r = S.restaurants.find((x) => x.id === id);
  if (!r) return;
  const F = (k, lbl, val, type = 'number') => `
    <div class="field"><label>${lbl}</label>
      <input id="rf_${k}" type="${type}" step="any" value="${esc(val ?? '')}"></div>`;
  openModal(`
    <h3>تعديل: ${esc(restName(r))} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    ${F('name', 'اسم المطعم', r.name, 'text')}
    ${F('phone', 'الجوال', r.phone, 'text')}
    ${F('address', 'العنوان', r.address, 'text')}
    ${F('branchName', 'اسم الفرع (العزيزية، الخالدية…)', r.branchName, 'text')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      ${F('minOrder', 'الحد الأدنى للطلب (' + SAR + ')', r.minOrder)}
      ${F('estimatedTimeMin', 'زمن التحضير (دقيقة)', r.estimatedTimeMin)}
    </div>
    <div class="panel" style="background:#f7f9f8;margin:12px 0 0">
      <b>التسعير — موحّد لكل المطاعم (للعرض فقط)</b>
      <div class="meta" style="margin-top:6px">
        أجرة التوصيل: <b>${PRICING.baseDeliveryFee} ${SAR}</b> لأول ${PRICING.baseDeliveryKm} كم
        + <b>${PRICING.perExtraKmFee} ${SAR}</b> لكل كم إضافي<br>
        رسم المنصة الثابت على العميل: <b>${PRICING.fixedDeliveryCommission} ${SAR}</b><br>
        عمولة المنصة من المطعم: <b>${(PRICING.appCommissionRate * 100).toFixed(0)}%</b> من قيمة الوجبات<br>
        أقصى مسافة توصيل: <b>${PRICING.maxDeliveryDistanceKm} كم</b>
      </div>
      <p class="meta" style="margin-top:8px;color:var(--orange)">
        ⚠️ هذه القيم ثابتة في كود التطبيق ولا تُقرأ من مستند المطعم. كانت اللوحة
        تعرضها هنا حقولاً قابلة للتعديل، فتوهم المدير أنه ضبط تسعير هذا المطعم
        بينما لا أثر لما يُدخله على أي طلب. تغييرها يتطلب تحديث التطبيق.
      </p>
    </div>
    <button class="btn block" id="saveRest">حفظ التعديلات</button>`);
  document.getElementById('saveRest').addEventListener('click', async () => {
    const v = (k) => document.getElementById('rf_' + k).value;
    const num = (k) => Number(v(k)) || 0;
    if (!confirm('حفظ التعديلات على «' + r.name + '»؟')) return;
    try {
      await updateDoc(doc(db, 'restaurants', id), {
        name: v('name').trim() || r.name, branchName: v('branchName').trim(),
        phone: v('phone').trim(), address: v('address').trim(),
        minOrder: num('minOrder'), estimatedTimeMin: Math.round(num('estimatedTimeMin')),
      });
      audit('restaurant.edit', `عدّل بيانات مطعم «${restName(r)}»`, { target: 'restaurants/' + id });
      toast('تم حفظ التعديلات'); closeModal();
    } catch (err) { alert('تعذر الحفظ: ' + (err.code || err.message)); }
  });
}

/* ================= السائقون (نظام المحفظة — المرحلة صفر) ================= */
const TXN_TYPE_AR = {
  // نموذج العُهدة الجديد — كان يظهر بالإنجليزية في السجل قبل إضافته هنا.
  orderCustody: ['عُهدة استلام', '#ca6f1e'],
  custodyReversal: ['عكس عُهدة', '#16a085'],
  deliveryCash: ['توصيل نقدي', '#ca6f1e'],
  deliveryOnline: ['توصيل إلكتروني', '#1e8449'],
  bonus: ['مكافأة', '#d4a017'],
  deposit: ['إيداع نقدي', '#1e8449'],
  payout: ['صرف للسائق', '#2471a3'],
  adjustment: ['تسوية', '#8e44ad'],
};
function balanceBadge(bal) {
  if (bal > 0.009) return badge(`له ${fmtMoney(bal)} ${SAR}`, '#1e8449');
  if (bal < -0.009) return badge(`عليه تسليم ${fmtMoney(-bal)} ${SAR}`, '#ca6f1e');
  return badge('رصيد متزن', '#7f8c8d');
}

function renderDriversPage() {

  const owedToDrivers = list.reduce((s2, d) => s2 + Math.max(0, Number(d.balance) || 0), 0);

    <div class="kpi-grid">
      <div class="kpi"><div class="num">${list.filter((d) => d.isOnline).length}</div><div class="lbl">متصل الآن</div></div>
      <div class="kpi"><div class="num">${fmtMoney(owedByDrivers)}</div><div class="lbl">نقد بعهدة السائقين (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(owedToDrivers)}</div><div class="lbl">مستحق للسائقين (${SAR})</div></div>
    </div>
    ${list.map((d) => {
      const bal = Number(d.balance) || 0;
      const legacy = Number(d.pendingPayout) || 0;

      <div class="card">
        <div class="row1">

        </div>
        <div class="meta">
          📞 ${esc(d.phone || '—')} — ${esc(d.vehicleType || '')} ${esc(d.vehiclePlate || '')}<br>
          التوصيلات: ${Number(d.totalDeliveries) || 0} — ⭐ ${(Number(d.rating) || 0).toFixed(1)}

        </div>

  $('main').querySelectorAll('[data-wallet]').forEach((b) =>
    b.addEventListener('click', () => showWalletModal(b.dataset.did, b.dataset.wallet)));
  $('main').querySelectorAll('[data-txns]').forEach((b) =>
    b.addEventListener('click', () => showTxnsModal(b.dataset.txns)));
}

function showWalletModal(driverId, kind) {
  const d = S.drivers.find((x) => x.id === driverId);
  if (!d) return;
  const bal = Number(d.balance) || 0;
  const meta = {
    deposit: ['تسجيل إيداع نقدي', 'المبلغ الذي سلّمه السائق للإدارة نقداً', 'إيداع'],
    payout: ['صرف مبلغ للسائق', 'المبلغ الذي دفعته الإدارة للسائق', 'صرف'],
    adjustment: ['تسوية يدوية', 'مبلغ بإشارة: موجب يزيد رصيد السائق، سالب ينقصه', 'تسوية'],
  }[kind];
  openModal(`
    <h3>${meta[0]} — ${esc(d.name)} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div class="kv"><span>الرصيد الحالي</span><b>${balanceBadge(bal)}</b></div>
    <div class="field" style="margin-top:10px"><label>${meta[1]} (${SAR})</label>
      <input type="number" step="any" id="w_amount" ${kind === 'adjustment' ? '' : 'min="0.01"'}></div>
    <div class="field"><label>ملاحظة (اختياري)</label>
      <input type="text" id="w_note" maxlength="120" placeholder="مثال: استلام نقدية يوم الجمعة"></div>
    <button class="btn block" id="w_save">${meta[2]} وتسجيل الحركة</button>
    <p class="meta" style="margin-top:8px">تُسجَّل حركة دائمة في دفتر السائق ولا يمكن تعديلها لاحقاً — التصحيح يكون بحركة تسوية جديدة.</p>
  `);
  document.getElementById('w_save').addEventListener('click', async () => {
    const raw = Number(document.getElementById('w_amount').value);
    const note = document.getElementById('w_note').value.trim();
    if (!raw || (kind !== 'adjustment' && raw <= 0)) { alert('أدخل مبلغاً صحيحاً'); return; }
    const delta = kind === 'deposit' ? Math.abs(raw) : kind === 'payout' ? -Math.abs(raw) : raw;
    const after = bal + delta;
    if (!confirm(`تأكيد ${meta[2]} بمبلغ ${fmtMoney(Math.abs(delta))} ${SAR}؟\nالرصيد بعد الحركة: ${after >= 0 ? 'له' : 'عليه'} ${fmtMoney(Math.abs(after))} ${SAR}`)) return;
    try {
      await runTransaction(db, async (tx) => {
        const ref = doc(db, 'drivers', driverId);
        const snap = await tx.get(ref);
        const cur = Number(snap.data()?.balance) || 0;
        const newBal = cur + delta;
        tx.update(ref, { balance: newBal });
        tx.set(doc(collection(db, 'driver_transactions')), {
          driverId, type: kind, amount: delta, balanceAfter: newBal,
          note: note || null, performedBy: adminUser.uid,
          createdAt: serverTimestamp(),
        });
      });
      audit('driver.' + kind, `${meta[2]} ${fmtMoney(Math.abs(delta))} ${SAR} — السائق «${d.name || ''}»`
        + (note ? ` (${note})` : ''), { target: 'drivers/' + driverId, amount: delta });
      toast('سُجّلت الحركة بنجاح'); closeModal();
    } catch (err) {
      alert('تعذر التسجيل: ' + (err.code || err.message) +
        '\n(إن كان الخطأ permission-denied فقواعد Firestore الجديدة لم تُنشر بعد)');
    }
  });
}

async function showTxnsModal(driverId) {
  const d = S.drivers.find((x) => x.id === driverId);
  openModal(`<h3>📒 سجل حركات ${esc(d?.name || '')} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div id="txnsBody"><div class="loading">جارٍ التحميل…</div></div>`);
  try {
    const qs = await getDocs(query(collection(db, 'driver_transactions'),
      where('driverId', '==', driverId), limit(200)));
    const txns = qs.docs.map((x) => x.data())
      .sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));
    document.getElementById('txnsBody').innerHTML = txns.length ? txns.map((t) => {
      const [lbl, color] = TXN_TYPE_AR[t.type] || [t.type, '#7f8c8d'];
      const amt = Number(t.amount) || 0;
      return `<div class="kv">
        <span>${badge(lbl, color)}<br><small class="meta">${esc(fmtTime(t.createdAt))}${t.orderNumber ? ' · طلب #' + esc(t.orderNumber) : ''}${t.note ? '<br>' + esc(t.note) : ''}</small></span>
        <b style="color:${amt >= 0 ? 'var(--ok)' : 'var(--red)'}">${amt >= 0 ? '+' : '−'}${fmtMoney(Math.abs(amt))}<br>
        <small class="meta">الرصيد: ${fmtMoney(t.balanceAfter)}</small></b>
      </div>`;
    }).join('') : '<div class="empty">لا حركات مسجلة بعد</div>';
  } catch (err) {
    document.getElementById('txnsBody').innerHTML =
      `<div class="empty">تعذر التحميل: ${esc(err.code || err.message)}<br>
      <small>إن كان الخطأ permission-denied فقواعد Firestore الجديدة لم تُنشر بعد</small></div>`;
  }
}

/* ================= طلبات انضمام الكباتن =================
 *
 * الصور مستندات هوية وإقامة، ولا تُقرأ إلا عند فتح الطلب: الطلب الواحد يحمل
 * حتى ١١ صورة، وتحميلها مع القائمة يجرّ ميغابايتات بلا داعٍ.
 *
 * قيمة الحقل تُقرأ بطريقتين — إن بدأت بـhttp فهي رابط يُعرض شبكياً، وإلا
 * فهي معرّف مستند صورة داخل Firestore. نفس ما يفعله عارض التطبيق، فيوم
 * ننتقل إلى Storage بعد Blaze لا يتغيّر شيء في الشاشتين.
 */
const APP_DOCS = [
  ['id', 'الهوية / الإقامة', true], ['idBack', 'ظهر الهوية', false],
  ['license', 'رخصة القيادة', true], ['registration', 'الاستمارة', true],
  ['insurance', 'التأمين', true], ['freelanceDoc', 'وثيقة العمل الحر', false],
  ['criminalRecord', 'خلو السوابق', false], ['drivingAuth', 'تفويض قيادة', false],
];
const APP_STATUS = { pending: ['بانتظار المراجعة', '#ca6f1e'], approved: ['مقبول', '#1e8449'],
  rejected: ['مرفوض', '#c0392b'] };
let appFilter = 'pending';
const docCache = new Map();     // معرّف مستند الصورة → data:URL

function renderApplicationsPage() {
  const all = [...S.applications].sort((a, b) => {
    const pa = (a.status || 'pending') === 'pending' ? 0 : 1;
    const pb = (b.status || 'pending') === 'pending' ? 0 : 1;
    return pa - pb || (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0);
  });
  const pending = all.filter((a) => (a.status || 'pending') === 'pending').length;
  const list = appFilter === 'all' ? all : all.filter((a) => (a.status || 'pending') === appFilter);
  const filters = [['pending', 'بانتظار المراجعة'], ['all', 'الكل'], ['approved', 'المقبولة'], ['rejected', 'المرفوضة']];

  $('main').innerHTML = `
    <div class="panel">
      <div class="kpi-grid">
        <div class="kpi" style="border-color:${pending ? '#ca6f1e' : 'var(--green)'}">
          <div class="num">${pending}</div><div class="lbl">بانتظار المراجعة</div></div>
        <div class="kpi"><div class="num">${all.filter((a) => a.status === 'approved').length}</div>
          <div class="lbl">مقبول</div></div>
        <div class="kpi"><div class="num">${all.length}</div><div class="lbl">إجمالي الطلبات</div></div>
      </div>
      <div class="toolbar" style="margin-top:12px">${filters.map(([k, l]) =>

    </div>

      return `<div class="card click" data-appid="${esc(a.id)}">

        <div class="meta">📞 ${esc(a.phone || '—')} — ${esc(a.vehicleType || '')} ${esc(a.vehiclePlate || '')}<br>
          ${esc(fmtTime(a.createdAt))} — ${n} مستند
          ${a.referredByCode ? ' — دعاه: ' + esc(a.referredByCode) : ''}
          ${a.issuedCode ? '<br>الكود الصادر: <b>' + esc(a.issuedCode) + '</b>' : ''}
          ${a.reviewNote ? '<br>سبب الرفض: ' + esc(a.reviewNote) : ''}</div>
      </div>`;
    }).join('') || '<div class="empty">لا طلبات في هذا التصنيف</div>'}`;

  }));
  $('main').querySelectorAll('[data-appid]').forEach((b) =>
    b.addEventListener('click', () => showApplication(b.dataset.appid)));
}

async function loadAppDoc(idOrUrl) {
  if (!idOrUrl) return null;
  if (/^https?:/i.test(idOrUrl)) return idOrUrl;        // رابط Storage بعد Blaze
  if (docCache.has(idOrUrl)) return docCache.get(idOrUrl);
  const snap = await getDoc(doc(db, 'driver_application_docs', idOrUrl));
  const blob = snap.exists() ? snap.data().image : null;
  const url = blob && typeof blob.toBase64 === 'function' ? 'data:image/jpeg;base64,' + blob.toBase64() : null;
  docCache.set(idOrUrl, url);
  return url;
}

function showApplication(id) {

  if (!a) return;
  const st = a.status || 'pending';

  const docs = a.documents || {};
  const missing = APP_DOCS.filter(([k, , req]) => req && !docs[k]).map(([, t]) => t);

  const tile = (key, cap, val) => val
    ? `<div class="doc-tile" data-doc="${esc(val)}" data-cap="${esc(cap)}">
         <img alt="${esc(cap)}" data-src="${esc(val)}"><div class="cap">${esc(cap)}</div></div>`
    : `<div class="doc-tile miss"><div class="ph">لم يُرفَع</div><div class="cap">${esc(cap)}</div></div>`;

  openModal(`
    <h3>🪪 ${esc(a.name || '')} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div class="row1">${badge(lbl, color)}</div>
    <div class="kv"><span>الجوال</span><b><a href="tel:${esc(a.phone || '')}" style="color:var(--blue)">${esc(a.phone || '—')}</a></b></div>
    <div class="kv"><span>البريد</span><b style="font-weight:400">${esc(a.email || '—')}</b></div>
    <div class="kv"><span>رقم الهوية / الإقامة</span><b>${esc(a.nationalId || '—')}</b></div>
    <div class="kv"><span>المركبة</span><b>${esc(a.vehicleType || '—')} — ${esc(a.vehiclePlate || '')}</b></div>
    <div class="kv"><span>كود من دعاه</span><b>${esc(a.referredByCode || 'بلا')}</b></div>
    <div class="kv"><span>قُدّم</span><b>${esc(fmtTime(a.createdAt))}</b></div>
    ${a.issuedCode ? `<div class="kv"><span>الكود الصادر</span><b>${esc(a.issuedCode)}</b></div>` : ''}
    ${a.reviewNote ? `<div class="kv"><span>سبب الرفض</span><b style="font-weight:400">${esc(a.reviewNote)}</b></div>` : ''}

    ${missing.length ? `<div class="card" style="border-inline-start:4px solid var(--orange);margin-top:12px">

        قد تكون وصلتك عبر واتساب — القبول متاح على أي حال.</div></div>` : ''}

    <h3 style="margin-top:16px">المستندات</h3>
    <div class="doc-grid">${APP_DOCS.map(([k, t]) => tile(k, t, docs[k])).join('')}</div>
    <h3 style="margin-top:12px">صور المركبة</h3>
    <div class="doc-grid">${['أمام', 'خلف', 'يمين', 'يسار']
      .map((t, i) => tile('veh' + i, t, (a.vehiclePhotos || [])[i])).join('')}</div>
    <p class="meta">اضغط أي صورة لعرضها كبيرة مع التكبير والتدوير.</p>

    ${st === 'pending' ? `
      <div class="field" style="margin-top:14px"><label>صلاحية كود التسجيل (بالأيام — 0 = بلا انتهاء)</label>
        <input type="number" id="ap_days" min="0" step="1" value="14"></div>
      <div class="row1" style="gap:8px">
        <button class="btn" id="ap_ok">✅ قبول وإصدار كود التسجيل</button>
        <button class="btn danger" id="ap_no">✖️ رفض</button>
      </div>` : ''}
  `);

  // الصور تُجلب بعد فتح النافذة: المدير يرى بياناته فوراً لا بعد ١١ قراءة.
  document.querySelectorAll('#modalBox img[data-src]').forEach(async (img) => {

    t.addEventListener('click', () => openViewer(t.dataset.doc, t.dataset.cap)));

  const no = document.getElementById('ap_no');
  if (no) no.addEventListener('click', () => rejectApplication(a));
