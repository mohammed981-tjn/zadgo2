          ارفعه بعد أن تتأكد أن النسخة الجديدة وصلت الجميع، لا قبله.</div>
      </div>
      <div class="field"><label>أقدم نسخة مسموح لها بالعمل (مثال: 1.4.0)</label>
        <input type="text" id="s_minver" inputmode="decimal" placeholder="1.0.0"
               style="direction:ltr;text-align:left" value="${esc(appMinVersion)}"></div>
      <button class="btn" id="saveMinVer">حفظ الحد الأدنى</button>
      <p class="meta" style="margin-top:8px">يُكتب في <code>delivery_settings/app</code> —
        مستند منفصل عن الإعدادات أعلاه ليقرأه التطبيق قبل تسجيل الدخول.</p>
    </div>
    <div class="panel">
      <h3>عن اللوحة</h3>
      <div class="kv"><span>الرابط</span><b>zadgo.co/admin</b></div>
      <div class="kv"><span>مصدر البيانات</span><b>Firestore — لحظي</b></div>
      <div class="kv"><span>الدخول</span><b>حسابات المدير العام فقط</b></div>
    </div>`;
  /* الحدّ الأدنى العام للطلب — سياسةٌ تُطبَّق ولا تُخزَّن وحدها.
   *
   * القيمة تُحفظ في delivery_settings/config للذاكرة، لكن **ما يفرضها فعلاً**
   * هو كتابتها في حقل minOrder داخل كل مطعم أقلّ منها. والسبب أن هذا الحقل
   * وحده هو ما يقرؤه التطبيق والموقع؛ أما مستند الإعدادات فقواعده تقصر
   * قراءته على المدير العام، فلو تُرك الحدّ فيه وحده لما رآه عميل قط.
   *
   * ولذلك أيضاً لا يحتاج هذا تغييراً في القواعد ولا تحديثاً للتطبيق. */
  const previewMinOrder = () => {
    const floor = Math.max(0, Number(document.getElementById('s_minorder').value) || 0);
    const below = S.restaurants.filter((r) => (Number(r.minOrder) || 0) < floor);
    const box = document.getElementById('minOrderPreview');
    box.innerHTML = !floor
      ? 'صفر يعني بلا حدّ عام — يبقى لكل مطعم حدّه كما هو.'
      : below.length
        ? `<b style="color:var(--orange)">${below.length}</b> من ${S.restaurants.length} مطعماً تحت هذا الحدّ وسيُرفع حدّها: `
          + below.slice(0, 6).map((r) => `${esc(r.name || '—')} (${fmtMoney(r.minOrder || 0)})`).join(' · ')
          + (below.length > 6 ? ` و${below.length - 6} غيرها` : '')
        : 'كل المطاعم عند هذا الحدّ أو فوقه — لا تغيير.';
  };
  document.getElementById('s_minorder').addEventListener('input', previewMinOrder);
  previewMinOrder();

  document.getElementById('applyMinOrder').addEventListener('click', async () => {
    const floor = Math.max(0, Number(document.getElementById('s_minorder').value) || 0);
    const below = S.restaurants.filter((r) => (Number(r.minOrder) || 0) < floor);
    if (!confirm(floor
      ? `رفع الحدّ الأدنى إلى ${fmtMoney(floor)} ${SAR} في ${below.length} مطعماً؟\n`
        + 'المطاعم الأعلى من الحدّ لا تُمسّ. يمكنك خفض حدّ أي مطعم لاحقاً من صفحته.'
      : 'حفظ الحدّ العام صفراً؟ لن تتغيّر حدود المطاعم الحالية.')) return;
    const btn = document.getElementById('applyMinOrder');
    btn.disabled = true;
    try {
      await setDoc(doc(db, 'delivery_settings', 'config'), { minOrderFloor: floor }, { merge: true });
      for (const r of below) {
        await updateDoc(doc(db, 'restaurants', r.id), { minOrder: floor });
      }
      audit('settings.save', `الحدّ الأدنى العام للطلب ${fmtMoney(floor)} ${SAR}`
        + (below.length ? ` — رُفع حدّ ${below.length} مطعماً` : ' — بلا تغيير على المطاعم'),
        { target: 'delivery_settings/config' });
      toast(below.length ? `طُبِّق على ${below.length} مطعماً` : 'حُفظ الحدّ العام');
      previewMinOrder();
    } catch (err) { alert('تعذر التطبيق: ' + (err.code || err.message)); }
    btn.disabled = false;
  });

  document.getElementById('saveMinVer').addEventListener('click', async () => {
    const raw = document.getElementById('s_minver').value.trim();
    // الصيغة تُتحقَّق هنا لا في التطبيق: قيمة مشوّهة تجعل المقارنة تفشل عند
    // كل مستخدم، والبوابة تفتح للجميع بصمت — عطلٌ لا يظهر إلا حين تحتاجها.
    if (raw && !/^\d{1,3}(\.\d{1,3}){0,2}$/.test(raw)) {
      alert('الصيغة يجب أن تكون أرقاماً بنقاط مثل 1.4.0');
      return;
    }
    if (!confirm(raw
      ? `حجب كل نسخة أقدم من ${raw}؟\nمن لم يحدّث لن يستطيع استخدام التطبيق — بمن فيهم السائقون أثناء عملهم.`
      : 'تعطيل البوابة؟ ستعمل كل النسخ مهما قدُمت.')) return;
    try {
      await setDoc(doc(db, 'delivery_settings', 'app'), { minAppVersion: raw }, { merge: true });
      audit('settings.save', raw ? `رفع الحد الأدنى لنسخة التطبيق إلى ${raw}` : 'عطّل بوابة الحد الأدنى للنسخة',
        { target: 'delivery_settings/app' });
      toast('حُفظ الحد الأدنى');
    } catch (err) { alert('تعذر الحفظ: ' + (err.code || err.message)); }
  });
  document.getElementById('saveSettings').addEventListener('click', async () => {
    if (!confirm('حفظ إعدادات المُهل الجديدة؟')) return;
    try {
      await setDoc(doc(db, 'delivery_settings', 'config'), {
        restaurantResponseTimeoutMinutes: Math.max(1, Number(document.getElementById('s_rest').value) || 5),
        driverSearchTimeoutMinutes: Math.max(1, Number(document.getElementById('s_driver').value) || 10),
        lateDeliveryThresholdMinutes: Math.max(1, Number(document.getElementById('s_late').value) || 15),
        complaintResponseMinutes: Math.max(1, Number(document.getElementById('s_comp').value) || 120),
      }, { merge: true });
      audit('settings.save', 'حفظ مُهل المعالجة: '
        + `مطعم ${document.getElementById('s_rest').value} د · سائق ${document.getElementById('s_driver').value} د · `
        + `تأخير ${document.getElementById('s_late').value} د · شكوى ${document.getElementById('s_comp').value} د`,
        { target: 'delivery_settings/config' });
      toast('حُفظت الإعدادات');
    } catch (err) { alert('تعذر الحفظ: ' + (err.code || err.message)); }
  });
}

</script>
</body>
</html>
