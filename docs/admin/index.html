<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://firebasestorage.googleapis.com https://*.firebasestorage.app; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e3a2c">
<link rel="icon" href="../images/zadgo-logo-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>لوحة تحكم ZadGo</title>
<style>
  :root {
    --green: #13224a; --green-dark: #0b1631; --green-light: #eef2fb; --gold: #FFC107;
    --bg: #f3f5f9; --card: #ffffff; --text: #16203a; --muted: #66718a; --line: #e4e8f1;
    --red: #c0392b; --blue: #2471a3; --orange: #ca6f1e; --purple: #8e44ad; --ok: #1e8449;
    --side-w: 232px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', "Segoe UI", Tahoma, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ================= شاشة الدخول ================= */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--green) 0%, var(--green-dark) 100%); padding: 20px; }
  .login-card { background: var(--card); border-radius: 18px; padding: 34px 26px; width: 100%; max-width: 390px;
    box-shadow: 0 12px 44px rgba(0,0,0,.28); }
  .login-card h1 { text-align: center; color: var(--green); margin-bottom: 4px; font-size: 2.2rem; }
  .login-card h1 span { color: #d4a017; }
  .login-card p.sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .95rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px; border: 1px solid #d5ddda;
    border-radius: 10px; font-size: 1rem; background: #fff; color: var(--text); }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  .btn { display: inline-block; padding: 12px 20px; border: 0; border-radius: 10px; font-size: 1rem;
    font-weight: 700; cursor: pointer; background: var(--green); color: #fff; }
  .btn.block { display: block; width: 100%; }
  .btn.ghost { background: #eef2f0; color: var(--text); }
  .btn.danger { background: var(--red); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error-box { background: #fdecea; color: var(--red); border-radius: 8px; padding: 10px 12px;
    font-size: .9rem; margin-bottom: 14px; }

  /* ================= الهيكل ================= */
  #appView { display: flex; min-height: 100vh; }
  aside.side { width: var(--side-w); background: var(--green-dark); color: #fff; padding: 18px 0;
    position: fixed; inset-block: 0; inset-inline-start: 0; overflow-y: auto; z-index: 30; }
  aside.side .brand { padding: 0 20px 16px; font-size: 1.35rem; font-weight: 800; }
  aside.side .brand span { color: var(--gold); }
  aside.side .brand small { display: block; font-weight: 400; font-size: .72rem; opacity: .65; margin-top: 2px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 20px; border: 0;
    background: none; color: rgba(255,255,255,.75); font-size: .95rem; cursor: pointer; text-align: start;
    border-inline-start: 3px solid transparent; }
  .nav-btn:hover { background: rgba(255,255,255,.06); }
  .nav-btn.active { background: rgba(255,255,255,.1); color: #fff; border-inline-start-color: var(--gold); font-weight: 700; }
  .nav-btn .ico { font-size: 1.1rem; width: 24px; text-align: center; }
  .nav-btn .cnt { margin-inline-start: auto; background: var(--red); color: #fff; border-radius: 999px;
    font-size: .7rem; padding: 2px 8px; font-weight: 700; }
  .side-foot { padding: 16px 20px 4px; font-size: .75rem; color: rgba(255,255,255,.45); }

  .content { flex: 1; margin-inline-start: var(--side-w); display: flex; flex-direction: column; min-width: 0; }
  header.topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 22px;
    display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 25; }
  header.topbar h2 { font-size: 1.15rem; flex: 1; }
  #liveDot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; display: inline-block;
    margin-inline-end: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #adminChip { font-size: .82rem; color: var(--muted); text-align: end; line-height: 1.3; }
  .logout { background: #eef2f0; color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px;
    cursor: pointer; font-size: .85rem; }
  main { padding: 20px 22px 90px; max-width: 1280px; width: 100%; }

  /* الشريط السفلي (جوال) */
  nav.bottom { display: none; position: fixed; bottom: 0; inset-inline: 0; background: var(--green-dark);
    z-index: 40; overflow-x: auto; padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom .row { display: flex; min-width: max-content; }
  nav.bottom button { flex: 1; min-width: 68px; padding: 8px 6px 9px; border: 0; background: none;
    color: rgba(255,255,255,.7); font-size: .66rem; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 3px; position: relative; }
  nav.bottom button .ico { font-size: 1.25rem; }
  nav.bottom button.active { color: var(--gold); font-weight: 700; }
  nav.bottom button .cnt { position: absolute; top: 2px; inset-inline-end: 12px; background: var(--red);
    color: #fff; border-radius: 999px; font-size: .6rem; padding: 1px 5px; }
  @media (max-width: 860px) {
    aside.side { display: none; }
    .content { margin-inline-start: 0; }
    nav.bottom { display: block; }
    main { padding: 14px 14px 84px; }
  }

  /* ================= مكوّنات ================= */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
    border-inline-start: 4px solid var(--green); }
  .kpi .num { font-size: 1.65rem; font-weight: 800; color: var(--green-dark); }
  .kpi .lbl { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .panel { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .panel h3 { font-size: 1rem; margin-bottom: 12px; color: var(--green-dark); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip { border: 1px solid #cfd9d5; background: var(--card); border-radius: 999px; padding: 7px 14px;
    font-size: .85rem; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }
  input.search { flex: 1; min-width: 160px; padding: 9px 14px; border: 1px solid #cfd9d5; border-radius: 999px;
    font-size: .9rem; background: var(--card); }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); cursor: default; }
  .card.click { cursor: pointer; }
  .card.click:hover { outline: 2px solid var(--green-light); }
  .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 700; }
  .meta { color: var(--muted); font-size: .84rem; margin-top: 4px; line-height: 1.75; }
  .badge { display: inline-block; border-radius: 999px; padding: 3px 12px; font-size: .76rem; font-weight: 700; }
  .money { font-weight: 800; color: var(--green); white-space: nowrap; }
  .toggle-btn { border: 1px solid #cfd9d5; background: #fff; border-radius: 8px; padding: 7px 14px;
    cursor: pointer; font-size: .84rem; }
  .toggle-btn.on { background: #e8f6ef; border-color: #27ae60; color: var(--ok); }
  .toggle-btn[disabled] { opacity: .4; cursor: default; }
  .toggle-btn.off { background: #fdecea; border-color: var(--red); color: var(--red); }
  select.inline-sel { padding: 7px 10px; border-radius: 8px; border: 1px solid #cfd9d5; font-size: .84rem; background: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .loading { text-align: center; color: var(--muted); padding: 30px; }
  table.rep { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.rep th, table.rep td { padding: 9px 8px; text-align: start; border-bottom: 1px solid var(--line); }
  table.rep th { color: var(--muted); font-weight: 700; font-size: .78rem; }
  .table-wrap { overflow-x: auto; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding-top: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .bar { width: 100%; max-width: 42px; background: var(--green); border-radius: 6px 6px 0 0; min-height: 3px;
    transition: height .4s; }
  .bar.gold { background: var(--gold); }
  .bar-lbl { font-size: .66rem; color: var(--muted); white-space: nowrap; }
  .bar-val { font-size: .68rem; font-weight: 700; color: var(--green-dark); }

  /* نافذة منبثقة */
  #modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex;
    align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { #modalBack { align-items: center; } }
  #modalBox { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 20px; }
  @media (min-width: 640px) { #modalBox { border-radius: 18px; } }
  #modalBox h3 { color: var(--green-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .x-btn { border: 0; background: #eef2f0; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line);
    font-size: .9rem; gap: 10px; }
  .kv b { white-space: nowrap; }
  .kv:last-child { border-bottom: 0; }
  .items-list { background: var(--green-light); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: .9rem; }
  .items-list div { display: flex; justify-content: space-between; padding: 3px 0; }
  .toast { position: fixed; bottom: 90px; inset-inline: 0; margin: auto; width: fit-content; max-width: 90%;
    background: var(--green-dark); color: #fff; border-radius: 999px; padding: 11px 22px; font-size: .9rem;
    z-index: 70; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
</style>
</head>
<body>

<!-- ================= الدخول ================= -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <img src="../images/zadgo-logo.png" alt="ZadGo" style="display:block;height:52px;margin:0 auto 14px;background:var(--green-dark);border-radius:12px;padding:9px 16px">
    <p class="sub">لوحة التحكم — دخول المدير العام فقط</p>
    <div id="loginError" class="error-box hidden"></div>
    <div class="field"><label>البريد الإلكتروني</label>
      <input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label>كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password" required></div>
    <button class="btn block" id="loginBtn" type="submit">دخول</button>
  </form>
</div>

<!-- ================= اللوحة ================= -->
<div id="appView" class="hidden">
  <aside class="side">
    <div class="brand"><img src="../images/zadgo-logo.png" alt="ZadGo" style="height:34px;display:block"><small>لوحة التحكم الإدارية</small></div>
    <div id="sideNav"></div>
    <div class="side-foot">zadgo.co © 2026</div>
  </aside>
  <div class="content">
    <header class="topbar">
      <h2 id="pageTitle"><span id="liveDot"></span>نظرة عامة</h2>
      <div id="adminChip"></div>
      <button class="logout" id="logoutBtn">خروج</button>
    </header>
    <main id="main"></main>
  </div>
  <nav class="bottom"><div class="row" id="bottomNav"></div></nav>
</div>

<div id="modalBack" class="hidden"><div id="modalBox"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, orderBy, where,
  limit, onSnapshot, getDocs, writeBatch, runTransaction, Timestamp, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBuU7g3vG5enxaebwxGdGgavG5U8cftwd4',
  authDomain: 'restaurant-app-ed699.firebaseapp.com',
  projectId: 'restaurant-app-ed699',
});
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const SAR = 'ر.س';

/* ---------------- ثوابت وترجمات ---------------- */
const STATUS_AR = {
  created: ['جديد', '#7f8c8d'], restaurantPending: ['بانتظار المطعم', '#ca6f1e'],
  restaurantAccepted: ['قبله المطعم', '#2471a3'], preparing: ['قيد التحضير', '#2471a3'],
  readyForPickup: ['جاهز للاستلام', '#8e44ad'], searchingDriver: ['البحث عن سائق', '#ca6f1e'],
  driverAssigned: ['أُسند لسائق', '#2471a3'], pickedUp: ['استلمه السائق', '#2471a3'],
  onTheWay: ['في الطريق', '#117a65'], delivered: ['تم التوصيل', '#1e8449'],
  restaurantRejected: ['رفضه المطعم', '#c0392b'], noDriverFound: ['لا يوجد سائق', '#c0392b'],
  cancelled: ['ملغي', '#c0392b'], refunded: ['مسترد', '#7f8c8d'],
  pending: ['بانتظار المطعم', '#ca6f1e'], confirmed: ['قبله المطعم', '#2471a3'],
  outForDelivery: ['في الطريق', '#117a65'],
};
const ACTIVE_STATUSES = ['created','restaurantPending','restaurantAccepted','preparing','readyForPickup',
  'searchingDriver','driverAssigned','pickedUp','onTheWay','pending','confirmed','outForDelivery'];
const CANCELLED_STATUSES = ['cancelled','restaurantRejected','noDriverFound','refunded'];
const ROLE_AR = { admin: 'مدير عام', customer: 'عميل', driver: 'سائق', restaurantManager: 'مدير مطعم' };
const PAY_AR = { cash: 'كاش عند الاستلام', card: 'بطاقة', wallet: 'محفظة' };
const COMPLAINT_STATUS_AR = { open: 'مفتوحة', inProgress: 'قيد المعالجة', resolved: 'محلولة', closed: 'مغلقة' };
const COMPLAINT_TYPE_AR = { lateDelivery: 'تأخر التوصيل', wrongOrder: 'طلب خاطئ', badQuality: 'جودة سيئة',
  driverBehavior: 'سلوك السائق', other: 'أخرى' };

const PAGES = [
  ['dashboard', '📊', 'نظرة عامة'],
  ['orders', '🧾', 'الطلبات'],
  ['restaurants', '🍽️', 'المطاعم'],
  ['drivers', '🛵', 'السائقون'],
  ['users', '👥', 'المستخدمون'],
  ['complaints', '📮', 'الشكاوى'],
  ['banners', '🖼️', 'البنرات'],
  ['payouts', '💸', 'طلبات السحب'],
  ['coupons', '🎟️', 'الكوبونات'],
  ['broadcast', '📢', 'رسالة جماعية'],
  ['import', '📥', 'استيراد منيو'],
  ['reports', '📈', 'التقارير'],
  ['settings', '⚙️', 'الإعدادات'],
];

/* ---------------- أدوات ---------------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function badge(text, color) { return `<span class="badge" style="background:${color}1a;color:${color}">${esc(text)}</span>`; }
function toDate(v) {
  if (!v) return null;
  if (v.toDate) return v.toDate();
  if (typeof v === 'number') return new Date(v);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function fmtTime(v) {
  const d = toDate(v);
  return d ? d.toLocaleString('ar-SA', { dateStyle: 'short', timeStyle: 'short' }) : '—';
}
function fmtMoney(n) { return (Number(n) || 0).toFixed(2); }
function itemsTotal(o) {
  return (o.items || []).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.quantity) || 1), 0);
}
function orderTotal(o) { return itemsTotal(o) + (Number(o.driverShare) || 0) + (Number(o.appShare) || 0); }

/* ما حُصّل فعلاً نقداً أو بالبطاقة = الإجمالي − خصم الكوبون − ما دُفع من
 * المحفظة. بدون هذا الطرح تبدو تقارير التحصيل أكبر من الواقع. يطابق
 * payableTotal − walletUsed في نموذج التطبيق. */
function collectedTotal(o) {
  return orderTotal(o) - (Number(o.discountAmount) || 0) - (Number(o.walletUsed) || 0);
}
/* التسعير الموحّد — نسخة طبق الأصل من Pricing في lib/utils/helpers.dart.
 * يُعرض في اللوحة للاطّلاع فقط؛ مصدر الحقيقة كود التطبيق، وأي تغيير هنا
 * لا يغيّر شيئاً في الطلبات. */
const PRICING = {
  appCommissionRate: 0.15,
  baseDeliveryFee: 9,
  baseDeliveryKm: 7,
  perExtraKmFee: 1,
  fixedDeliveryCommission: 3,
  maxDeliveryDistanceKm: 25,
};

/* عمولة المنصة على الطلب: تُقرأ من الطلب نفسه لا تُعاد حسابها.
 * إعادة الحساب بـ15% كانت تعطي رقماً مختلفاً عن المحتسب فعلاً متى تغيّرت
 * النسبة أو خُصم كوبون، فتظهر تقارير لا تطابق ما جرى. */
function commission(o) {
  const stored = Number(o.platformCommission);
  if (Number.isFinite(stored) && stored > 0) return stored;
  return itemsTotal(o) * PRICING.appCommissionRate; // طلبات قديمة قبل الحقل
}

/* سطر إثبات الدفع بالبطاقة. وجود paymentId من بوابة «ميسر» هو الدليل الوحيد
 * على تحصيل فعلي؛ طلب مُعلَّم مدفوعاً بالبطاقة بلا معرّف عملية حالة تستحق
 * التدقيق (قد يكون عُلّم يدوياً أو فشل تسجيل الدفع). */
function paymentProofRow(o) {
  const method = String(o.paymentMethod || '');
  const isCard = method.includes('card') || method.includes('بطاقة');
  if (!isCard) return '';
  if (o.paymentId) {
    return `<div class="kv"><span>مرجع الدفع (ميسر)</span><b style="direction:ltr;font-size:.8rem">${esc(o.paymentId)}</b></div>`;
  }
  return `<div class="kv"><span>مرجع الدفع (ميسر)</span>
    <b style="color:var(--red)">⚠️ غير موجود — يستحق التدقيق</b></div>`;
}

/* المطعم بلا تقييمات يُعرض «جديد» لا «5.0 ⭐» — الأخيرة تكذب على المدير
 * وعلى العميل بتقييم ممتاز لم يمنحه أحد. */
function ratingText(r) {
  const n = Number(r.ratingCount) || 0;
  if (n === 0) return '🆕 جديد (بلا تقييمات)';
  return `⭐ ${(Number(r.rating) || 0).toFixed(1)} (${n} تقييم)`;
}

/* عدد الطلبات المسلَّمة للمطعم — يُحسب من الطلبات لأن حقل totalOrders
 * في مستند المطعم لا يُكتب إطلاقاً فيظهر صفراً دائماً. */
function deliveredCountFor(restaurantId) {
  return S.orders.filter((o) => o.restaurantId === restaurantId && o.status === 'delivered').length;
}

/* الاسم المعروض = اسم المطعم + الفرع. بدون الفرع يستحيل التفريق بين
 * فرعين لنفس المطعم في كل شاشات اللوحة. */
function restName(r) {
  if (!r) return 'مطعم';
  const base = r.name || 'مطعم';
  return r.branchName ? `${base} — ${r.branchName}` : base;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function openModal(html) { $('modalBox').innerHTML = html; $('modalBack').classList.remove('hidden'); }

/* ---------------- الاستماع الحي ---------------- */
function startListeners() {
  const bind = (q2, key, after) => unsubs.push(onSnapshot(q2, (qs) => {
    S[key] = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (after) after();
    rerender();
  }, (err) => { console.error(key, err); }));

  bind(query(collection(db, 'orders'), orderBy('createdAt', 'desc'), limit(400)), 'orders');
  bind(collection(db, 'restaurants'), 'restaurants');
  bind(query(collection(db, 'users'), limit(400)), 'users');
  bind(collection(db, 'drivers'), 'drivers');
  bind(query(collection(db, 'complaints'), orderBy('createdAt', 'desc'), limit(150)), 'complaints');
  bind(query(collection(db, 'broadcasts'), orderBy('createdAt', 'desc'), limit(40)), 'broadcasts');
  // الكوبونات: معرّف المستند هو الكود نفسه، فالترتيب بـcreatedAt يحتاج وجود
  // الحقل في كل مستند — نرتّب محلياً بدلاً من ذلك تفادياً لسقوط الاستعلام.
  bind(query(collection(db, 'banners'), limit(60)), 'banners');
  bind(query(collection(db, 'payout_requests'), orderBy('createdAt', 'desc'), limit(200)), 'payouts');
  bind(query(collection(db, 'coupons'), limit(200)), 'coupons');
  bind(query(collection(db, 'coupon_usages'), limit(500)), 'couponUsages');
  unsubs.push(onSnapshot(doc(db, 'delivery_settings', 'config'),
    (d) => { S.settings = d.exists() ? d.data() : {}; if (page === 'settings') rerender(); },
    () => {}));
}

/* ---------------- التنقل ---------------- */
/* عدّاد ما ينتظر تدخّل الإدارة على كل صفحة — الشكاوى المفتوحة وطلبات

function navCount(k) {
  if (k === 'complaints') return S.complaints.filter((c) => c.status === 'open').length;
  if (k === 'payouts') return S.payouts.filter((p) => (p.status || 'pending') === 'pending').length;

}
function navHtml(withText) {
  return PAGES.map(([k, ico, lbl]) => {

    return `
    <button class="nav-btn ${k === page ? 'active' : ''}" data-page="${k}">

      ${n ? `<span class="cnt">${n}</span>` : ''}

  }).join('');
}
function renderNav() {

/* ================= نظرة عامة ================= */
function renderDashboard() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todays = S.orders.filter((o) => { const d = toDate(o.createdAt); return d && d >= today; });
  const deliveredToday = todays.filter((o) => o.status === 'delivered');
  const active = S.orders.filter((o) => ACTIVE_STATUSES.includes(o.status));
  const revenueToday = deliveredToday.reduce((s, o) => s + orderTotal(o), 0);
  const commToday = deliveredToday.reduce((s, o) => s + commission(o) + (Number(o.appShare) || 0), 0);
  const onlineDrivers = S.drivers.filter((d) => d.isOnline).length;
  const openRest = S.restaurants.filter((r) => r.isOpen).length;
  const openComp = S.complaints.filter((c) => c.status === 'open').length;

  // آخر ٧ أيام
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0); d0.setDate(d0.getDate() - i);
    const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
    const list = S.orders.filter((o) => { const d = toDate(o.createdAt); return d && d >= d0 && d < d1; });
    days.push({
      lbl: d0.toLocaleDateString('ar-SA', { weekday: 'short' }),
      count: list.length,
      rev: list.filter((o) => o.status === 'delivered').reduce((s, o) => s + orderTotal(o), 0),
    });
  }
  const maxC = Math.max(1, ...days.map((d) => d.count));
  const maxR = Math.max(1, ...days.map((d) => d.rev));

  // أكثر المطاعم طلبات (آخر ٧ أيام)
  const week = new Date(); week.setDate(week.getDate() - 7);
  const perRest = {};
  S.orders.forEach((o) => {
    const d = toDate(o.createdAt); if (!d || d < week) return;
    perRest[o.restaurantName] = (perRest[o.restaurantName] || 0) + 1;
  });
  const topRest = Object.entries(perRest).sort((a, b) => b[1] - a[1]).slice(0, 5);

  $('main').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${todays.length}</div><div class="lbl">طلبات اليوم</div></div>
      <div class="kpi"><div class="num">${deliveredToday.length}</div><div class="lbl">مُوصَّلة اليوم</div></div>
      <div class="kpi" style="border-color:${active.length ? '#ca6f1e' : 'var(--green)'}">
        <div class="num">${active.length}</div><div class="lbl">طلبات نشطة الآن</div></div>
      <div class="kpi"><div class="num">${fmtMoney(revenueToday)}</div><div class="lbl">مبيعات اليوم (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(commToday)}</div><div class="lbl">أرباح المنصة اليوم (${SAR})</div></div>
      <div class="kpi"><div class="num">${onlineDrivers}<small style="font-size:.9rem;color:var(--muted)">/${S.drivers.length}</small></div>
        <div class="lbl">سائقون متصلون</div></div>
      <div class="kpi"><div class="num">${openRest}<small style="font-size:.9rem;color:var(--muted)">/${S.restaurants.length}</small></div>
        <div class="lbl">مطاعم مفتوحة</div></div>
      <div class="kpi" style="border-color:${openComp ? 'var(--red)' : 'var(--green)'}">
        <div class="num">${openComp}</div><div class="lbl">شكاوى مفتوحة</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>الطلبات — آخر ٧ أيام</h3>
        <div class="bars">${days.map((d) => `
          <div class="bar-col"><span class="bar-val">${d.count}</span>
            <div class="bar" style="height:${Math.round((d.count / maxC) * 95)}px"></div>
            <span class="bar-lbl">${d.lbl}</span></div>`).join('')}
        </div>
      </div>
      <div class="panel"><h3>المبيعات (${SAR}) — آخر ٧ أيام</h3>
        <div class="bars">${days.map((d) => `
          <div class="bar-col"><span class="bar-val">${Math.round(d.rev)}</span>
            <div class="bar gold" style="height:${Math.round((d.rev / maxR) * 95)}px"></div>
            <span class="bar-lbl">${d.lbl}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>أنشط المطاعم (٧ أيام)</h3>
        ${topRest.length ? topRest.map(([n, c]) => `
          <div class="kv"><span>${esc(n || '—')}</span><b>${c} طلب</b></div>`).join('')
          : '<div class="empty">لا بيانات بعد</div>'}
      </div>
      <div class="panel"><h3>أحدث الطلبات</h3>
        ${S.orders.slice(0, 4).map(orderCard).join('') || '<div class="empty">لا توجد طلبات بعد</div>'}
      </div>
    </div>`;
}

/* يعيد إلى محفظة العميل ما خُصم منها لهذا الطلب عند إلغائه من اللوحة.
 *
 * كانت اللوحة تكتب حالة الإلغاء فقط دون إعادة الرصيد — بعكس التطبيق —
 * فيخسر العميلُ الذي دفع من محفظته مالَه إن أُلغي طلبه من الويب. تُطابق
 * هذه الدالة منطق _refundWalletOnCancel في التطبيق حرفاً بحرف: نفس نوع
 * الحركة (orderReversal) ونفس الحقول، حتى لا يفترق الدفتران.
 *
 * تُستدعى بعد نجاح تغيير الحالة لا قبله: لو فشل الإلغاء، لا يكون رصيد
 * قد أُعيد لطلب ما زال قائماً. وتُنفَّذ داخل معاملة ذرّية فلا يتغيّر
 * الرصيد دون حركة مقابلة في الدفتر. */
async function refundWalletOnCancel(order) {
  const amount = Number(order.walletUsed) || 0;
  if (amount <= 0 || !order.customerId) return;
  await runTransaction(db, async (tx) => {
    const userRef = doc(db, 'users', order.customerId);
    const snap = await tx.get(userRef);
    const current = Number(snap.data()?.walletBalance) || 0;
    const after = current + amount;
    tx.update(userRef, { walletBalance: after });
    tx.set(doc(collection(db, 'wallet_transactions')), {
      userId: order.customerId,
      type: 'orderReversal',
      amount,
      balanceAfter: after,
      orderId: order.id,
      orderNumber: order.orderNumber ?? null,
      note: 'إلغاء الطلب من لوحة التحكم',
      createdAt: serverTimestamp(),
    });
  });
}

function showWalletModal(driverId, kind) {
  const d = S.drivers.find((x) => x.id === driverId);
  if (!d) return;
  const bal = Number(d.balance) || 0;
  const meta = {
    deposit: ['تسجيل إيداع نقدي', 'المبلغ الذي سلّمه السائق للإدارة نقداً', 'إيداع'],
    payout: ['صرف مبلغ للسائق', 'المبلغ الذي دفعته الإدارة للسائق', 'صرف'],
    adjustment: ['تسوية يدوية', 'مبلغ بإشارة: موجب يزيد رصيد السائق، سالب ينقصه', 'تسوية'],
  }[kind];
  openModal(`
    <h3>${meta[0]} — ${esc(d.name)} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div class="kv"><span>الرصيد الحالي</span><b>${balanceBadge(bal)}</b></div>
    <div class="field" style="margin-top:10px"><label>${meta[1]} (${SAR})</label>
      <input type="number" step="any" id="w_amount" ${kind === 'adjustment' ? '' : 'min="0.01"'}></div>
    <div class="field"><label>ملاحظة (اختياري)</label>
      <input type="text" id="w_note" maxlength="120" placeholder="مثال: استلام نقدية يوم الجمعة"></div>
    <button class="btn block" id="w_save">${meta[2]} وتسجيل الحركة</button>
    <p class="meta" style="margin-top:8px">تُسجَّل حركة دائمة في دفتر السائق ولا يمكن تعديلها لاحقاً — التصحيح يكون بحركة تسوية جديدة.</p>
  `);
  document.getElementById('w_save').addEventListener('click', async () => {
    const raw = Number(document.getElementById('w_amount').value);
    const note = document.getElementById('w_note').value.trim();
    if (!raw || (kind !== 'adjustment' && raw <= 0)) { alert('أدخل مبلغاً صحيحاً'); return; }
    const delta = kind === 'deposit' ? Math.abs(raw) : kind === 'payout' ? -Math.abs(raw) : raw;
    const after = bal + delta;
    if (!confirm(`تأكيد ${meta[2]} بمبلغ ${fmtMoney(Math.abs(delta))} ${SAR}؟\nالرصيد بعد الحركة: ${after >= 0 ? 'له' : 'عليه'} ${fmtMoney(Math.abs(after))} ${SAR}`)) return;
    try {
      await runTransaction(db, async (tx) => {
        const ref = doc(db, 'drivers', driverId);
        const snap = await tx.get(ref);
        const cur = Number(snap.data()?.balance) || 0;
        const newBal = cur + delta;
        tx.update(ref, { balance: newBal });
        tx.set(doc(collection(db, 'driver_transactions')), {
          driverId, type: kind, amount: delta, balanceAfter: newBal,
          note: note || null, performedBy: adminUser.uid,
          createdAt: serverTimestamp(),
        });
      });
      toast('سُجّلت الحركة بنجاح'); closeModal();
    } catch (err) {
      alert('تعذر التسجيل: ' + (err.code || err.message) +
        '\n(إن كان الخطأ permission-denied فقواعد Firestore الجديدة لم تُنشر بعد)');
    }
  });
}

async function showTxnsModal(driverId) {
  const d = S.drivers.find((x) => x.id === driverId);
  openModal(`<h3>📒 سجل حركات ${esc(d?.name || '')} <button class="x-btn" onclick="closeModal()">✕</button></h3>
    <div id="txnsBody"><div class="loading">جارٍ التحميل…</div></div>`);
  try {
    const qs = await getDocs(query(collection(db, 'driver_transactions'),
      where('driverId', '==', driverId), limit(200)));
    const txns = qs.docs.map((x) => x.data())
      .sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));
    document.getElementById('txnsBody').innerHTML = txns.length ? txns.map((t) => {
      const [lbl, color] = TXN_TYPE_AR[t.type] || [t.type, '#7f8c8d'];
      const amt = Number(t.amount) || 0;
      return `<div class="kv">
        <span>${badge(lbl, color)}<br><small class="meta">${esc(fmtTime(t.createdAt))}${t.orderNumber ? ' · طلب #' + esc(t.orderNumber) : ''}${t.note ? '<br>' + esc(t.note) : ''}</small></span>
        <b style="color:${amt >= 0 ? 'var(--ok)' : 'var(--red)'}">${amt >= 0 ? '+' : '−'}${fmtMoney(Math.abs(amt))}<br>
        <small class="meta">الرصيد: ${fmtMoney(t.balanceAfter)}</small></b>
      </div>`;
    }).join('') : '<div class="empty">لا حركات مسجلة بعد</div>';
  } catch (err) {
    document.getElementById('txnsBody').innerHTML =
      `<div class="empty">تعذر التحميل: ${esc(err.code || err.message)}<br>
      <small>إن كان الخطأ permission-denied فقواعد Firestore الجديدة لم تُنشر بعد</small></div>`;
  }
}

async function saveBanner() {
  const imageUrl = document.getElementById('b_url').value.trim();
  const title = document.getElementById('b_title').value.trim();
  const restaurantId = document.getElementById('b_rest').value;
  const sortOrder = Math.round(Number(document.getElementById('b_order').value) || 0);
  if (!/^https:\/\/\S+$/i.test(imageUrl)) {
    alert('أدخل رابط صورة صحيحاً يبدأ بـ https://'); return;
  }
  try {
    await addDoc(collection(db, 'banners'), {
      imageUrl, title,

      isActive: true, sortOrder,
      createdAt: serverTimestamp(),
    });
    toast('أُضيف البنر'); closeModal();

async function toggleBanner(id) {

async function deleteBanner(id) {

  try {
    await deleteDoc(doc(db, 'banners', id));

}

/* التحريك يبادل قيمة sortOrder مع الجار — أبسط من إعادة ترقيم القائمة كلها،
 * ويكتب مستندين فقط في كل نقلة. */
async function moveBanner(id, dir) {
  const list = [...S.banners].sort((a, b) =>
    (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0));
  const i = list.findIndex((b) => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'banners', a.id), { sortOrder: Number(b.sortOrder) || 0 });
    batch.update(doc(db, 'banners', b.id), { sortOrder: Number(a.sortOrder) || 0 });
    await batch.commit();
  } catch (err) { alert('تعذر الترتيب: ' + (err.code || err.message)); }
}

/* ================= طلبات سحب المستحقات =================
 *
 * السائق يقدّم الطلب من تطبيقه، والبتّ هنا. الصرف عملية مالية مركّبة:
 * خصم الرصيد + حركة في دفتر السائق + إغلاق الطلب — الثلاثة معاً أو لا شيء.
 *
 * تُنفَّذ داخل runTransaction بقراءة طازجة للطلب وللسائق، فتُغلق ثغرتان:
 *   • الصرف المزدوج (ضغطتان متتاليتان، أو صرف من الويب والتطبيق معاً).
 *   • الصرف فوق الرصيد إن تراكمت عُهدة على السائق بعد تقديمه الطلب.
 * وهي تطابق منطق payPayoutRequest في التطبيق حرفياً: نفس نوع الحركة
 * (payout) ونفس الحقول ونفس تحديث totalEarnings.
 */
const PAYOUT_STATUS_AR = {
  pending: ['معلّق', '#ca6f1e'],
  paid: ['مصروف', '#1e8449'],
  rejected: ['مرفوض', '#c0392b'],
};

function renderPayoutsPage() {
  const filters = [['pending', 'المعلّقة'], ['all', 'الكل'], ['paid', 'المصروفة'], ['rejected', 'المرفوضة']];
  let list = [...S.payouts];
  if (payoutFilter !== 'all') list = list.filter((p) => (p.status || 'pending') === payoutFilter);

  const pending = S.payouts.filter((p) => (p.status || 'pending') === 'pending');
  const pendingSum = pending.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const paidSum = S.payouts.filter((p) => p.status === 'paid')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  $('main').innerHTML = `
    <div class="panel">
      <div class="kpi-grid">
        <div class="kpi" style="border-color:${pending.length ? '#ca6f1e' : 'var(--green)'}">
          <div class="num">${pending.length}</div><div class="lbl">طلب معلّق</div></div>
        <div class="kpi"><div class="num">${fmtMoney(pendingSum)}</div><div class="lbl">مطلوب صرفه (${SAR})</div></div>
        <div class="kpi"><div class="num">${fmtMoney(paidSum)}</div><div class="lbl">صُرف إجمالاً (${SAR})</div></div>
      </div>
      <div class="toolbar" style="margin-top:12px">${filters.map(([k, l]) =>
        `<button class="chip ${payoutFilter === k ? 'active' : ''}" data-pf="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="panel">
      ${list.map((p) => {
        const st = p.status || 'pending';
        const [stTxt, stColor] = PAYOUT_STATUS_AR[st] || [st, '#7f8c8d'];
        const drv = S.drivers.find((d) => d.id === p.driverId);
        const bal = Number(drv?.balance) || 0;
        const amount = Number(p.amount) || 0;
        const short = st === 'pending' && amount > bal;
        return `
          <div class="card">
            <div class="row1">
              <span class="title">${esc(p.driverName || drv?.name || 'سائق')}</span>
              ${badge(stTxt, stColor)}
            </div>
            <div class="meta">
              المبلغ المطلوب: <b>${fmtMoney(amount)} ${SAR}</b>
              <br>طريقة الاستلام: ${esc(p.method || '—')}
              <br>قُدّم: ${esc(fmtTime(p.createdAt))}
              ${st === 'pending' ? `<br>رصيد السائق الآن: ${balanceBadge(bal)}` : ''}
              ${p.processedAt ? `<br>تمت المعالجة: ${esc(fmtTime(p.processedAt))}` : ''}
              ${p.adminNote ? `<br>ملاحظة الإدارة: ${esc(p.adminNote)}` : ''}
              ${short ? `<br><span style="color:var(--red)">⚠️ المبلغ أكبر من رصيد السائق الحالي — تغيّر بعد تقديم الطلب</span>` : ''}
            </div>
            ${st === 'pending' ? `
              <div class="row1" style="margin-top:8px;gap:6px">
                <button class="toggle-btn on" data-paypo="${esc(p.id)}">💸 صرف</button>
                <button class="toggle-btn" data-rejpo="${esc(p.id)}">✖️ رفض</button>
              </div>` : ''}
          </div>`;
      }).join('') || '<div class="empty">لا توجد طلبات في هذا التصنيف</div>'}
    </div>`;

  document.querySelectorAll('[data-pf]').forEach((b) =>
    b.addEventListener('click', () => { payoutFilter = b.dataset.pf; renderPayoutsPage(); }));
  $('main').querySelectorAll('[data-paypo]').forEach((b) =>
    b.addEventListener('click', () => payPayout(b.dataset.paypo)));
  $('main').querySelectorAll('[data-rejpo]').forEach((b) =>
    b.addEventListener('click', () => rejectPayout(b.dataset.rejpo)));
}

async function payPayout(id) {
  const p = S.payouts.find((x) => x.id === id);
  if (!p) return;
  const amount = Number(p.amount) || 0;
  const note = prompt(`صرف ${fmtMoney(amount)} ${SAR} إلى ${p.driverName || 'السائق'}؟\n` +
    `طريقة الاستلام: ${p.method || '—'}\n\nملاحظة اختيارية تظهر للسائق:`, '');
  if (note === null) return; // ألغى المستخدم
  try {
    await runTransaction(db, async (tx) => {
      const reqRef = doc(db, 'payout_requests', id);
      const drvRef = doc(db, 'drivers', p.driverId);
      const reqSnap = await tx.get(reqRef);
      const drvSnap = await tx.get(drvRef);
      if (!reqSnap.exists()) throw new Error('الطلب غير موجود');
      const cur = reqSnap.data();
      if ((cur.status || 'pending') !== 'pending') {
        throw new Error('هذا الطلب عولج بالفعل — حدِّث الصفحة');
      }
      if (!drvSnap.exists()) throw new Error('السائق غير موجود');
      const bal = Number(drvSnap.data().balance) || 0;
      const amt = Number(cur.amount) || 0;
      if (amt > bal) {
        throw new Error(`رصيد السائق (${fmtMoney(bal)} ${SAR}) أقل من المبلغ — ` +
          'تغيّر بعد تقديم الطلب. ارفض الطلب أو انتظر تسويته');
      }
      const after = bal - amt;
      tx.update(drvRef, {
        balance: after,
        totalEarnings: (Number(drvSnap.data().totalEarnings) || 0) + amt,
      });
      tx.set(doc(collection(db, 'driver_transactions')), {
        driverId: p.driverId,
        type: 'payout',
        amount: -amt,
        balanceAfter: after,
        note: `صرف طلب سحب (${cur.method || '—'})`,
        performedBy: adminUser.uid,
        createdAt: serverTimestamp(),
      });
      tx.update(reqRef, {
        status: 'paid',
        processedAt: serverTimestamp(),
        ...(note.trim() ? { adminNote: note.trim() } : {}),
      });
    });
    toast('صُرف الطلب وسُجّلت الحركة');
  } catch (err) {
    alert('تعذر الصرف: ' + (err.message || err.code));
  }
}

async function rejectPayout(id) {
  const p = S.payouts.find((x) => x.id === id);
  if (!p) return;
  const reason = prompt('سبب الرفض (يظهر للسائق):', '');
  if (reason === null) return;
  if (!reason.trim()) { alert('اكتب سبب الرفض — يراه السائق'); return; }
  try {
    await runTransaction(db, async (tx) => {
      const reqRef = doc(db, 'payout_requests', id);
      const snap = await tx.get(reqRef);
      if (!snap.exists()) throw new Error('الطلب غير موجود');
      if ((snap.data().status || 'pending') !== 'pending') {
        throw new Error('هذا الطلب عولج بالفعل — حدِّث الصفحة');
      }
      tx.update(reqRef, {
        status: 'rejected',
        adminNote: reason.trim(),
        processedAt: serverTimestamp(),
      });
    });
    toast('رُفض الطلب');
  } catch (err) {
    alert('تعذر الرفض: ' + (err.message || err.code));
  }
}

/* ================= الكوبونات =================
 *
 * معرّف المستند هو الكود نفسه (بحروف كبيرة) — هكذا يقرؤه التطبيق مباشرة
 * بلا استعلام، ويستحيل وجود كودين متطابقين. لذلك «تعديل الكود» غير ممكن:
 * الكود هوية المستند لا حقلاً فيه، وتغييره يعني كوداً جديداً.
 *
 * قواعد Firestore تسمح للعميل بزيادة usedCount بمقدار 1 فقط ولا شيء غيره،
 * فلا يُخشى من عبثه بالقيمة أو تعطيل الكود.
 */
function couponState(c) {
  const now = new Date();
  const exp = toDate(c.expiresAt);
  if (c.isActive === false) return ['موقوف', '#7f8c8d'];
  if (exp && exp < now) return ['منتهي', '#c0392b'];
  const limit = Number(c.usageLimit) || 0;
  if (limit > 0 && (Number(c.usedCount) || 0) >= limit) return ['مستنفد', '#d35400'];
  return ['فعّال', '#1e8449'];
}

function couponLabel(c) {
  const v = Number(c.value) || 0;
  if (c.type === 'fixed') return `${fmtMoney(v)} ${SAR}`;
  const cap = Number(c.maxDiscount) || 0;
  return `${v}%${cap > 0 ? ` حتى ${fmtMoney(cap)} ${SAR}` : ''}`;
}

  const filters = [['all', 'الكل'], ['active', 'الفعّالة'], ['inactive', 'الموقوفة/المنتهية']];

    const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
    return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
  });
  if (couponFilter === 'active') list = list.filter((c) => couponState(c)[0] === 'فعّال');
  if (couponFilter === 'inactive') list = list.filter((c) => couponState(c)[0] !== 'فعّال');

  const totalRedeemed = S.coupons.reduce((s, c) => s + (Number(c.usedCount) || 0), 0);
  const activeCount = S.coupons.filter((c) => couponState(c)[0] === 'فعّال').length;

  $('main').innerHTML = `
    <div class="panel">
      <div class="row1" style="margin-bottom:10px">
        <h3 style="margin:0">أكواد الخصم</h3>
        <button class="btn" id="newCouponBtn">➕ كوبون جديد</button>
      </div>
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${S.coupons.length}</div><div class="lbl">إجمالي الأكواد</div></div>

        <div class="kpi"><div class="num">${totalRedeemed}</div><div class="lbl">مرات الاستخدام</div></div>
      </div>
      <div class="toolbar" style="margin-top:12px">${filters.map(([k, l]) =>
        `<button class="chip ${couponFilter === k ? 'active' : ''}" data-cfilter="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="panel">
      ${list.map((c) => {
        const [stTxt, stColor] = couponState(c);
        const limit = Number(c.usageLimit) || 0;
        const used = Number(c.usedCount) || 0;
        const exp = toDate(c.expiresAt);
        const rest = c.restaurantId
          ? (S.restaurants.find((r) => r.id === c.restaurantId)?.name || 'مطعم محذوف')
          : 'كل المطاعم';
        return `
          <div class="card">
            <div class="row1">
              <span class="title" style="direction:ltr;display:inline-block">${esc(c.id)}</span>
              ${badge(stTxt, stColor)}
            </div>
            <div class="meta">
              الخصم: <b>${esc(couponLabel(c))}</b>
              ${Number(c.minOrderTotal) > 0 ? ` · حد أدنى ${fmtMoney(c.minOrderTotal)} ${SAR}` : ''}
              <br>الاستخدام: ${used}${limit > 0 ? ` من ${limit}` : ' (بلا حد)'}
              · لكل عميل: ${Number(c.perUserLimit) || 1}
              <br>النطاق: ${esc(rest)}
              ${exp ? ` · ينتهي ${esc(fmtTime(c.expiresAt))}` : ' · بلا تاريخ انتهاء'}
            </div>
            <div class="row1" style="margin-top:8px;gap:6px">
              <button class="toggle-btn" data-cusage="${esc(c.id)}">📊 الاستخدامات</button>
              <button class="toggle-btn ${c.isActive === false ? 'on' : ''}" data-ctoggle="${esc(c.id)}">
                ${c.isActive === false ? '▶️ تفعيل' : '⏸ إيقاف'}</button>
              <button class="toggle-btn" data-cdel="${esc(c.id)}">🗑 حذف</button>

          </div>`;
      }).join('') || '<div class="empty">لا توجد أكواد خصم بعد — أنشئ أول كوبون</div>'}
    </div>`;

  document.querySelectorAll('[data-cfilter]').forEach((b) =>

async function saveCoupon() {
  const code = document.getElementById('c_code').value.trim().toUpperCase();
  const type = document.getElementById('c_type').value;
  const value = Number(document.getElementById('c_value').value);
  const maxDiscount = Number(document.getElementById('c_max').value) || 0;
  const minOrderTotal = Number(document.getElementById('c_min').value) || 0;
  const usageLimit = Number(document.getElementById('c_limit').value) || 0;
  const perUserLimit = Number(document.getElementById('c_peruser').value) || 1;
  const restaurantId = document.getElementById('c_rest').value;
  const expRaw = document.getElementById('c_exp').value;

  if (!/^[A-Z0-9]{3,24}$/.test(code)) {
    alert('الكود يجب أن يكون 3 إلى 24 حرفاً إنجليزياً أو رقماً، بلا مسافات أو رموز'); return;
  }
  if (!value || value <= 0) { alert('أدخل قيمة خصم أكبر من صفر'); return; }
  if (type === 'percentage' && value > 100) { alert('النسبة المئوية لا تتجاوز 100'); return; }
  if (S.coupons.some((c) => c.id === code)) { alert('هذا الكود موجود بالفعل'); return; }

  // نهاية اليوم المختار لا بدايته: كوبون «ينتهي اليوم» يجب أن يعمل طوال اليوم.
  let expiresAt = null;
  if (expRaw) {
    const d = new Date(expRaw + 'T23:59:59');
    if (d < new Date()) { alert('تاريخ الانتهاء في الماضي'); return; }
    expiresAt = Timestamp.fromDate(d);
  }

  try {
    await setDoc(doc(db, 'coupons', code), {
      type, value, minOrderTotal, maxDiscount, usageLimit,
      usedCount: 0, perUserLimit, restaurantId,
      ...(expiresAt ? { expiresAt } : {}),
      isActive: true,
      createdAt: serverTimestamp(),
    });
    toast('أُنشئ الكوبون ' + code); closeModal();
  } catch (err) {
    alert('تعذر الإنشاء: ' + (err.code || err.message));
  }
}

async function toggleCoupon(code) {
  const c = S.coupons.find((x) => x.id === code);
  if (!c) return;
  const turningOn = c.isActive === false;
  if (!confirm(`${turningOn ? 'تفعيل' : 'إيقاف'} الكود ${code}؟`)) return;
  try {
    await updateDoc(doc(db, 'coupons', code), { isActive: turningOn });
    toast(turningOn ? 'فُعّل الكوبون' : 'أُوقف الكوبون');
  } catch (err) { alert('تعذر التغيير: ' + (err.code || err.message)); }
}

/* الحذف متاح لأن العميل لا يستطيعه (القواعد تقصره على المدير)، لكنه يُفقد
 * سجلّ الكود من التقارير. الإيقاف أنسب في معظم الحالات، ولهذا يحذّر النص. */
async function deleteCoupon(code) {
  const c = S.coupons.find((x) => x.id === code);
  const used = Number(c?.usedCount) || 0;
  const warn = used > 0
    ? `\n\n⚠️ استُخدم هذا الكود ${used} مرة. حذفه يُفقد أثره في التقارير — الإيقاف أفضل.`
    : '';
  if (!confirm(`حذف الكود ${code} نهائياً؟${warn}`)) return;
  try {
    await deleteDoc(doc(db, 'coupons', code));
    toast('حُذف الكوبون');
  } catch (err) { alert('تعذر الحذف: ' + (err.code || err.message)); }
}

function openCouponUsages(code) {
  const rows = S.couponUsages.filter((u) => u.code === code)
    .sort((a, b) => {
      const da = toDate(a.lastUsedAt), dbb = toDate(b.lastUsedAt);
      return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
    });
  const total = rows.reduce((s, u) => s + (Number(u.count) || 0), 0);
  openModal(`
    <h3>استخدامات <span style="direction:ltr;display:inline-block">${esc(code)}</span></h3>
    <p class="meta">${rows.length} عميل · ${total} مرة إجمالاً</p>
    ${rows.map((u) => {
      const user = S.users.find((x) => x.id === u.userId);
      return `
        <div class="card">
          <div class="row1"><span class="title">${esc(user?.name || 'عميل')}</span>
            ${badge(`${Number(u.count) || 0}×`, '#2471a3')}</div>
          <div class="meta">${esc(user?.phone || u.userId)}<br>آخر استخدام: ${esc(fmtTime(u.lastUsedAt))}</div>
        </div>`;
    }).join('') || '<div class="empty">لم يُستخدم هذا الكود بعد</div>'}
  `);
}

/* ================= استيراد منيو ================= */
function renderImportPage() {
  const restOptions = [...S.restaurants]
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'))
    .map((r) => `<option value="${r.id}">${esc(r.emoji || '')} ${esc(r.name)}</option>`).join('');
  $('main').innerHTML = `
    <div class="panel">
      <h3>استيراد / مزامنة منيو مطعم</h3>
      <p class="meta" style="margin-bottom:12px">
        ألصق محتوى ملف الاستيراد (JSON) أو اختره من جهازك. الاستيراد <b>آمن للتكرار</b>:
        الصنف الموجود بنفس الاسم يُحدَّث (السعر، السعرات، رابط الصورة) ولا يُكرَّر،
        والصنف الجديد يُضاف. روابط الصور تظهر في التطبيق فور الاستيراد.
      </p>
      <div class="field"><label>المطعم المستهدف</label>
        <select id="impRest">${restOptions || '<option value="">لا توجد مطاعم — أنشئ المطعم أولاً</option>'}</select></div>
      <div class="field"><label>ملف JSON</label>
        <input type="file" id="impFile" accept=".json,application/json"></div>
      <div class="field"><label>أو ألصق المحتوى هنا</label>
        <textarea id="impText" style="min-height:140px;direction:ltr;text-align:left;font-family:monospace"
          placeholder='{"categories": [{"name": "…", "items": [{"name": "…", "price": 5}]}]}'></textarea></div>
      <button class="btn" id="impBtn">فحص واستيراد 📥</button>
      <div id="impStatus" style="margin-top:12px"></div>
    </div>`;

  document.getElementById('impFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) document.getElementById('impText').value = await f.text();
  });

  document.getElementById('impBtn').addEventListener('click', runImport);
}

async function runImport() {
  const status = document.getElementById('impStatus');
  const btn = document.getElementById('impBtn');
  const rid = document.getElementById('impRest').value;
  const say = (m) => { status.innerHTML = `<div class="card">${m}</div>`; };
  if (!rid) { alert('اختر المطعم أولاً'); return; }

  let data;
  try {
    data = JSON.parse(document.getElementById('impText').value);
    if (!Array.isArray(data.categories)) throw new Error('لا يوجد حقل categories');
  } catch (err) { say('❌ الملف غير سليم: ' + esc(err.message)); return; }

  btn.disabled = true;
  try {
    say('⏳ جارٍ قراءة المنيو الحالي للمقارنة…');
    const catSnap = await getDocs(collection(db, 'restaurants', rid, 'categories'));
    const itemSnap = await getDocs(collection(db, 'restaurants', rid, 'items'));
    const catByName = new Map(catSnap.docs.map((d) => [(d.data().name || '').trim(), d.id]));
    const itemByKey = new Map(itemSnap.docs.map((d) =>
      [d.data().categoryId + '|' + (d.data().name || '').trim(), d.id]));

    // خطة الاستيراد
    let newCats = 0, newItems = 0, updItems = 0, totalItems = 0;
    data.categories.forEach((c) => {
      if (!catByName.has((c.name || '').trim())) newCats++;
      (c.items || []).forEach(() => totalItems++);
    });

    const rest = S.restaurants.find((r) => r.id === rid);
    if (!confirm(`استيراد ${totalItems} صنفاً في ${data.categories.length} قسماً إلى «${rest?.name}»؟\n(أقسام جديدة: ${newCats} — الأصناف الموجودة بنفس الاسم ستُحدَّث لا تُكرَّر)`)) {
      btn.disabled = false; say(''); return;
    }

    say('⏳ جارٍ الاستيراد…');
    let batch = writeBatch(db), ops = 0;
    const commitIfFull = async () => {
      if (ops >= 400) { await batch.commit(); batch = writeBatch(db); ops = 0; }
    };

    let sortOrder = catSnap.size;
    for (const c of data.categories) {
      const cname = (c.name || '').trim();
      if (!cname) continue;
      let catId = catByName.get(cname);
      if (!catId) {
        const ref = doc(collection(db, 'restaurants', rid, 'categories'));
        catId = ref.id;
        batch.set(ref, { name: cname, restaurantId: rid, sortOrder: sortOrder++ });
        catByName.set(cname, catId); ops++; await commitIfFull();
      }
      for (const it of (c.items || [])) {
        const iname = (it.name || '').trim();
        if (!iname) continue;
        const payload = {
          restaurantId: rid, categoryId: catId, name: iname,
          price: Number(it.price) || 0,
          isAvailable: true,
        };
        if (it.kcal != null) payload.kcal = Number(it.kcal) || 0;
        if (it.imageUrl) payload.imageUrl = String(it.imageUrl).trim();
        if (it.description) payload.description = String(it.description);
        if (it.emoji) payload.emoji = String(it.emoji);
        const key = catId + '|' + iname;
        const existingId = itemByKey.get(key);
        if (existingId) {
          batch.update(doc(db, 'restaurants', rid, 'items', existingId), payload);
          updItems++;
        } else {
          const ref = doc(collection(db, 'restaurants', rid, 'items'));
          batch.set(ref, { description: '', emoji: '🍽️', totalSold: 0, trackStock: false, ...payload });
          itemByKey.set(key, ref.id);
          newItems++;
        }
        ops++; await commitIfFull();
      }
    }
    if (ops > 0) await batch.commit();
    say(`✅ <b>اكتمل الاستيراد بنجاح</b><br>
      أقسام جديدة: ${newCats} — أصناف جديدة: ${newItems} — أصناف حُدّثت: ${updItems}<br>
      <span class="meta">افتح التطبيق الآن — الأصناف وصورها ستظهر مباشرة.</span>`);
    toast('اكتمل الاستيراد');
  } catch (err) {
    say('❌ تعذر الاستيراد: ' + esc(err.code || err.message));
  }
  btn.disabled = false;
}

/* ================= التقارير ================= */
let reportDays = 7, reportData = null, reportBusy = false;
function renderReportsPage() {
  $('main').innerHTML = `
    <div class="toolbar">
      ${[[1, 'اليوم'], [7, 'آخر ٧ أيام'], [30, 'آخر ٣٠ يوم'], [90, 'آخر ٩٠ يوم']].map(([d, l]) =>
        `<button class="chip ${d === reportDays ? 'active' : ''}" data-rep="${d}">${l}</button>`).join('')}
      <button class="chip" id="csvBtn">⬇️ تصدير Excel (CSV)</button>
    </div>
    <div id="repBody">${reportBusy ? '<div class="loading">جارٍ حساب التقرير…</div>' : ''}</div>`;
  $('main').querySelectorAll('[data-rep]').forEach((b) =>
    b.addEventListener('click', () => { reportDays = Number(b.dataset.rep); loadReport(); }));
  document.getElementById('csvBtn').addEventListener('click', exportCsv);
  if (reportBusy) return;
  if (!reportData || reportData.days !== reportDays) loadReport(); else drawReport();
}

async function loadReport() {
  reportBusy = true; renderReportsPage();
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (reportDays - 1));
    const qs = await getDocs(query(collection(db, 'orders'),
      where('createdAt', '>=', Timestamp.fromDate(start)), orderBy('createdAt', 'desc'), limit(3000)));
    const orders = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    const delivered = orders.filter((o) => o.status === 'delivered');
    const perRest = {}, perDriver = {};
    delivered.forEach((o) => {
      const rk = o.restaurantName || '—';
      perRest[rk] = perRest[rk] || { count: 0, items: 0, comm: 0, appShare: 0 };
      perRest[rk].count++; perRest[rk].items += itemsTotal(o);
      perRest[rk].comm += commission(o); perRest[rk].appShare += Number(o.appShare) || 0;
      if (o.driverName) {
        const dk = o.driverName;
        perDriver[dk] = perDriver[dk] || { count: 0, share: 0 };
        perDriver[dk].count++; perDriver[dk].share += Number(o.driverShare) || 0;
      }
    });
    reportData = {
      days: reportDays, total: orders.length, delivered: delivered.length,
      cancelled: orders.filter((o) => CANCELLED_STATUSES.includes(o.status)).length,
      revenue: delivered.reduce((s, o) => s + orderTotal(o), 0),
      itemsRev: delivered.reduce((s, o) => s + itemsTotal(o), 0),
      commTotal: delivered.reduce((s, o) => s + commission(o), 0),
      appShareTotal: delivered.reduce((s, o) => s + (Number(o.appShare) || 0), 0),
      driverShareTotal: delivered.reduce((s, o) => s + (Number(o.driverShare) || 0), 0),
      perRest, perDriver,
    };
  } catch (err) {
    reportData = { error: err.code || err.message, days: reportDays };
  }
  reportBusy = false;
  if (page === 'reports') { renderReportsPage(); }
}

function drawReport() {
  const r = reportData;
  const el = document.getElementById('repBody');
  if (!el) return;
  if (r.error) { el.innerHTML = `<div class="empty">تعذر التحميل: ${esc(r.error)}</div>`; return; }
  const platformProfit = r.commTotal + r.appShareTotal;
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${r.total}</div><div class="lbl">إجمالي الطلبات</div></div>
      <div class="kpi"><div class="num">${r.delivered}</div><div class="lbl">مُوصَّلة</div></div>
      <div class="kpi"><div class="num">${r.cancelled}</div><div class="lbl">ملغاة/مرفوضة</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.revenue)}</div><div class="lbl">إجمالي المبيعات (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.commTotal)}</div><div class="lbl">عمولات المطاعم ١٥٪ (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.appShareTotal)}</div><div class="lbl">نصيب المنصة من التوصيل (${SAR})</div></div>
      <div class="kpi" style="border-color:var(--gold)"><div class="num">${fmtMoney(platformProfit)}</div>
        <div class="lbl">أرباح المنصة الإجمالية (${SAR})</div></div>
      <div class="kpi"><div class="num">${fmtMoney(r.driverShareTotal)}</div><div class="lbl">أجور السائقين (${SAR})</div></div>
    </div>
    <div class="panel"><h3>حسب المطعم (الطلبات المُوصَّلة)</h3><div class="table-wrap">
      <table class="rep"><tr><th>المطعم</th><th>طلبات</th><th>مبيعات الوجبات</th><th>عمولة ١٥٪</th><th>صافي للمطعم</th></tr>
        ${Object.entries(r.perRest).sort((a, b) => b[1].items - a[1].items).map(([n, v]) => `
          <tr><td>${esc(n)}</td><td>${v.count}</td><td>${fmtMoney(v.items)}</td>
            <td>${fmtMoney(v.comm)}</td><td><b>${fmtMoney(v.items - v.comm)}</b></td></tr>`).join('') ||
          '<tr><td colspan="5" class="empty">لا بيانات</td></tr>'}
      </table></div></div>
    <div class="panel"><h3>حسب السائق (الطلبات المُوصَّلة)</h3><div class="table-wrap">
      <table class="rep"><tr><th>السائق</th><th>توصيلات</th><th>أجور التوصيل</th></tr>
        ${Object.entries(r.perDriver).sort((a, b) => b[1].count - a[1].count).map(([n, v]) => `
          <tr><td>${esc(n)}</td><td>${v.count}</td><td>${fmtMoney(v.share)}</td></tr>`).join('') ||
          '<tr><td colspan="3" class="empty">لا بيانات</td></tr>'}
      </table></div></div>`;
}

function exportCsv() {
  const r = reportData;
  if (!r || r.error) { alert('لا يوجد تقرير محمّل بعد'); return; }
  const rows = [
    ['تقرير ZadGo', `آخر ${r.days} يوم`],
    [],
    ['إجمالي الطلبات', r.total], ['مُوصَّلة', r.delivered], ['ملغاة', r.cancelled],
    ['إجمالي المبيعات', fmtMoney(r.revenue)], ['عمولات المطاعم 15%', fmtMoney(r.commTotal)],
    ['نصيب المنصة من التوصيل', fmtMoney(r.appShareTotal)],
    ['أرباح المنصة', fmtMoney(r.commTotal + r.appShareTotal)],
    ['أجور السائقين', fmtMoney(r.driverShareTotal)],
    [],
    ['المطعم', 'طلبات', 'مبيعات الوجبات', 'عمولة 15%', 'صافي للمطعم'],
    ...Object.entries(r.perRest).map(([n, v]) => [n, v.count, fmtMoney(v.items), fmtMoney(v.comm), fmtMoney(v.items - v.comm)]),
    [],
    ['السائق', 'توصيلات', 'أجور التوصيل'],
    ...Object.entries(r.perDriver).map(([n, v]) => [n, v.count, fmtMoney(v.share)]),
  ];
  const csv = '﻿' + rows.map((row) => row.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `zadgo-report-${r.days}d.csv`;
  a.click();
}
