<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلب الآن — ZadGo زاد جو</title>
<meta name="description" content="اطلب من مطاعم المدينة المنورة مباشرة من المتصفح — بلا تحميل تطبيق.">
<!-- تجربة محدودة: تُحجب الصفحة عن محركات البحث ما دامت مخفيّةً عن الجمهور،
     فلا يصلها عابرٌ من جوجل بينما أُخفيت أزرارها من الصفحة الرئيسية.
     يُحذف هذا السطر مع TRIAL_MODE = false في docs/index.html. -->
<meta name="robots" content="noindex">
<!-- سياسة أمان المحتوى: تحصر ما تستطيع الصفحة تحميله والاتصال به.
     فائدتها العملية أنها **تمنع تسريب البيانات**: لو تسلّل نصٌّ خبيث يوماً
     من حقلٍ في لوحة التحكم، لا يستطيع إرسال شيء إلى خادمٍ غريب — الوجهات
     محصورة فيما هو مذكور هنا.
     **`img-src` ضُيِّق** بعد أن كان `https:` مفتوحاً لأي مضيف: `imageUrl`
     حقلٌ يكتبه مدير المطعم، فرابطٌ على خادمه الخاص يجعل متصفّح **كل عميل**
     يفتح القائمة يطرق ذلك الخادم — أي سجلُّ عناوين IP لعملائنا بيد شريك.
     وصور قوائمنا كلها على نطاقنا («zadgo.co/images/…») أو على تخزين فيربيز
     بعد الترقية، فلا شيء يُفقَد بالتضييق. ومن يضع رابطاً محجوباً تظهر
     بطاقته برمزها التعبيري بديلاً (مستمع `error` أسفل) لا بأيقونة مكسورة.
     `frame-ancestors` مذكور للتوثيق ولا أثر له في وسم meta (المتصفحات
     تتجاهله خارج ترويسة HTTP) — ولذلك يمنع التأطير حارسُ الإطار أسفل. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com;
  connect-src 'self' https://*.googleapis.com https://*.firebaseio.com
    https://nominatim.openstreetmap.org;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://firebasestorage.googleapis.com https://*.firebasestorage.app;
  base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#1A2E5E">
<link rel="icon" href="/images/zadgo-logo-gold.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   اطلب الآن — نسخة الويب من تطبيق العميل.
   ألوانها ألوان «نكهة العميل» في التطبيق حرفياً (lib/utils/theme.dart):
   الذهبي الفاخر × الأخضر الملكي — فمن رأى التطبيق عرف الموقع، ومن بدأ
   على الموقع لم يستغرب التطبيق.
   ============================================================ */
:root {
  /* الكحلي × الذهبي × الأبيض — هوية زادقو الأصلية، أُعيدت بأمر المالك
     (2026-08-20). واسم `--green` بقي على حاله عمداً: يستعمله الملف في
     عشرات المواضع، وتغييره تعديلٌ واسع بلا أثرٍ مرئي — والقيمة هي
     الهوية لا الاسم. */
  --gold: #FFC107; --gold-dark: #E0A800; --gold-light: #FFD65A;
  --green: #1A2E5E; --green-2: #24407D;
  --surface: #F4F7FC; --card: #fff; --line: #E3E9F3;
  --text: #0A1A33; --muted: #7A879B;
  --success: #00D084; --success-bg: #E8F9F1;
  --error: #E53935; --error-bg: #FDECEA; --warn: #FFB020;
  --shadow: 0 2px 10px rgba(0,0,0,.07);
  --head-h: 62px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'IBM Plex Sans Arabic', 'Tajawal', Tahoma, sans-serif; background: var(--surface); color: var(--text);
  line-height: 1.6; overflow-x: hidden; }
button, input, select, textarea { font-family: inherit; font-size: 1rem; }
a { color: inherit; }

/* ---------- الترويسة ---------- */
header.top { position: sticky; top: 0; z-index: 50; height: var(--head-h);
  background: var(--green); color: #fff; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
header.top .back { background: none; border: 0; color: #fff; font-size: 1.5rem; cursor: pointer;
  width: 38px; height: 38px; border-radius: 10px; display: none; align-items: center; justify-content: center; }
header.top .back:hover { background: rgba(255,255,255,.1); }
header.top.has-back .back { display: flex; }
header.top h1 { font-size: 1.05rem; font-weight: 800; flex: 1; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
header.top .brand-img { height: 26px; }
header.top .head-act { background: rgba(255,255,255,.12); border: 0; color: #fff; cursor: pointer;
  border-radius: 10px; padding: 7px 11px; font-size: .82rem; font-weight: 700;  min-height: 44px; }
header.top .head-act:hover { background: rgba(255,255,255,.2); }

main { padding: 14px 14px 96px; max-width: 760px; margin: 0 auto; }

/* ---------- الشريط السفلي ---------- */
nav.bottom { position: fixed; bottom: 0; inset-inline: 0; z-index: 60; background: var(--card);
  border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -2px 14px rgba(0,0,0,.06); }
nav.bottom button { flex: 1; border: 0; background: none; cursor: pointer; padding: 9px 4px 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted);
  font-size: .7rem; font-weight: 700; position: relative; }
nav.bottom button .ico { font-size: 1.3rem; line-height: 1; }
nav.bottom button.active { color: var(--green); }
nav.bottom button.active .ico { filter: drop-shadow(0 2px 4px rgba(212,160,23,.5)); }
nav.bottom .badge { position: absolute; top: 4px; inset-inline-end: 22%; background: var(--error);
  color: #fff; font-size: .62rem; min-width: 17px; height: 17px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px; font-weight: 800; }

/* ---------- عناصر عامة ---------- */
.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px;
  margin-bottom: 12px; }
.btn { background: var(--gold); color: var(--green); border: 0; border-radius: 12px;
  padding: 13px 18px; font-weight: 800; cursor: pointer; font-size: .95rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:hover { background: var(--gold-dark); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.block { display: flex; width: 100%; }
.btn.ghost { background: #fff; color: var(--green); border: 1.5px solid var(--line); }
.btn.ghost:hover { background: var(--surface); }
.btn.green { background: var(--green); color: #fff; }
.btn.green:hover { background: var(--green-2); }
.btn.sm { padding: 8px 13px; font-size: .82rem; border-radius: 10px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: .82rem; font-weight: 700; color: var(--muted);
  margin-bottom: 5px; }
.field input, .field textarea, .field select { width: 100%; border: 1.5px solid var(--line);
  border-radius: 11px; padding: 12px 13px; background: #fff; color: var(--text); }
.field input:focus, .field textarea:focus, .field select:focus { outline: 0; border-color: var(--gold); }
.err { background: var(--error-bg); color: var(--error); border-radius: 11px; padding: 11px 13px;
  font-size: .88rem; font-weight: 600; margin-bottom: 12px; }
.ok { background: var(--success-bg); color: #067a4d; border-radius: 11px; padding: 11px 13px;
  font-size: .88rem; font-weight: 600; margin-bottom: 12px; }
.note { background: #FFF6E0; color: #7A5A00; border: 1px solid #F0DCA6; border-radius: 11px;
  padding: 11px 13px; font-size: .86rem; font-weight: 600; margin: 0 0 12px; }
.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty .big { font-size: 3.4rem; margin-bottom: 10px; }
.empty h3 { color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }
.muted { color: var(--muted); font-size: .82rem; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec-title { font-weight: 800; font-size: 1rem; margin: 16px 2px 8px; display: flex;
  align-items: center; gap: 7px; }
.sec-title::before { content: ''; width: 4px; height: 17px; background: var(--gold); border-radius: 3px; }

/* ---------- بطاقة مطعم (نمط البطاقة المصوّرة) ----------
   الصورة تسبق الاسم لأن العين تختار بالصورة قبل الحرف — هذا ما تفعله
   التطبيقات العالمية كلها. والبطاقة بلا صورة لا تنهار: تدرّجٌ ذهبي ورمز
   المطعم مكانها، فمطعمٌ لم تُرفع صورته يبقى مقروءاً لا فارغاً. */
.rcard { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
  margin-bottom: 13px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.rcard:active { transform: scale(.985); }
@media (hover: hover) { .rcard:hover { box-shadow: 0 6px 20px rgba(0,0,0,.12); } }
.rcard .cover { position: relative; aspect-ratio: 16/7; background: linear-gradient(135deg,var(--gold-light),var(--gold-dark));
  display: flex; align-items: center; justify-content: center; font-size: 3.2rem; }
.rcard .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rcard .cover::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.45), transparent 55%); }
.rcard .chips { position: absolute; inset-inline-start: 10px; bottom: 9px; z-index: 2; display: flex;
  gap: 6px; flex-wrap: wrap; }
.rcard .chip { background: rgba(255,255,255,.94); color: var(--text); border-radius: 999px;
  padding: 3px 10px; font-size: .72rem; font-weight: 800; backdrop-filter: blur(4px); }
.rcard .chip.star { color: #9a6b00; }
.rcard .body { padding: 11px 14px 13px; }
.rcard .nm { font-weight: 900; font-size: 1.02rem; }
.rcard .br { color: var(--muted); font-size: .8rem; }
.rcard .ds { color: var(--muted); font-size: .8rem; margin-top: 3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.rcard.shut .cover img, .rcard.shut .cover { filter: grayscale(.75); }
.rcard .shutlbl { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center;
  justify-content: center; }
.rcard .shutlbl span { background: rgba(17,17,17,.78); color: #fff; border-radius: 999px;
  padding: 6px 16px; font-weight: 800; font-size: .85rem; }
.pill { border-radius: 999px; padding: 2px 9px; font-size: .7rem; font-weight: 800; }
.pill.open { background: var(--success-bg); color: #067a4d; }
.pill.closed { background: var(--error-bg); color: var(--error); }

/* ---------- شريط البحث والمرشّحات ---------- */
.searchbar { position: sticky; top: var(--head-h); z-index: 40; background: var(--surface);
  padding: 10px 0 8px; margin: -14px -14px 0; padding-inline: 14px; }
.searchbar input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; background: #fff; }
.searchbar input:focus { outline: 0; border-color: var(--gold); }
.filters { display: flex; gap: 7px; overflow-x: auto; margin-top: 9px; padding-bottom: 2px;
  scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: 0 0 auto; border: 1.5px solid var(--line); background: #fff; color: var(--muted);
  border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 700; cursor: pointer;
  white-space: nowrap; }
.filters button.on { background: var(--green); color: #fff; border-color: var(--green); }

/* ---------- ترويسة المطعم المصوّرة ---------- */
.rhero { position: relative; margin: -14px -14px 0; aspect-ratio: 16/8;
  background: linear-gradient(135deg,var(--gold-light),var(--gold-dark));
  display: flex; align-items: center; justify-content: center; font-size: 4rem; }
.rhero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rhero::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.05) 65%); }
.rhero .txt { position: absolute; inset-inline: 16px; bottom: 12px; z-index: 2; color: #fff; }
.rhero .txt h2 { font-size: 1.35rem; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
.rhero .txt .br { opacity: .9; font-size: .85rem; }
.rstats { display: flex; background: var(--card); border-radius: 14px; margin: -18px 0 0;
  position: relative; z-index: 3; box-shadow: var(--shadow); overflow: hidden; }
.rstats div { flex: 1; text-align: center; padding: 11px 4px; }
.rstats div + div { border-inline-start: 1px solid var(--line); }
.rstats b { display: block; font-size: 1rem; color: var(--green); }
.rstats span { font-size: .72rem; color: var(--muted); }

/* ---------- تبويبات الأقسام اللاصقة ---------- */
.cattabs { position: sticky; top: var(--head-h); z-index: 42; background: var(--surface);
  margin: 14px -14px 4px; padding: 8px 14px; display: flex; gap: 7px; overflow-x: auto;
  scrollbar-width: none; box-shadow: 0 6px 10px -8px rgba(0,0,0,.18); }
.cattabs::-webkit-scrollbar { display: none; }
.cattabs button { flex: 0 0 auto; border: 0; background: #fff; color: var(--muted); cursor: pointer;
  border-radius: 999px; padding: 8px 15px; font-size: .85rem; font-weight: 800; white-space: nowrap;
  box-shadow: var(--shadow); }
.cattabs button.on { background: var(--gold); color: var(--green); }
.catsec { scroll-margin-top: calc(var(--head-h) + 56px); }

/* ---------- ورقة الصنف السفلية ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5);
  opacity: 0; pointer-events: none; transition: opacity .22s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 71; background: var(--card);
  border-radius: 22px 22px 0 0; max-height: 88dvh; overflow-y: auto; transform: translateY(101%);
  transition: transform .26s cubic-bezier(.2,.8,.25,1); max-width: 760px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom); }
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 42px; height: 4px; background: var(--line); border-radius: 3px;
  margin: 9px auto 0; }
.sheet .pic { aspect-ratio: 16/9; background: var(--surface); display: flex; align-items: center;
  justify-content: center; font-size: 4rem; margin: 10px 0 0; position: relative; overflow: hidden; }
.sheet .pic img { width: 100%; height: 100%; object-fit: cover; }
.sheet .in { padding: 15px 18px 20px; }
.sheet h3 { font-size: 1.2rem; font-weight: 900; }
.sheet .price { color: var(--gold-dark); font-weight: 900; font-size: 1.1rem; margin-top: 3px; }
.sheet .desc { color: var(--muted); font-size: .92rem; margin-top: 8px; }
.sheet .qrow { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 18px 0; }
.sheet .qrow button { width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #fff; font-size: 1.4rem; font-weight: 800; color: var(--green); cursor: pointer; }
.sheet .qrow .n { font-size: 1.3rem; font-weight: 900; min-width: 32px; text-align: center; }

/* ---------- هياكل التحميل ---------- */
.sk { background: linear-gradient(90deg,#e9edeb 25%,#f3f6f4 50%,#e9edeb 75%);
  background-size: 200% 100%; animation: shim 1.3s infinite; border-radius: 10px; }
@keyframes shim { to { background-position: -200% 0; } }
.skcard { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 13px;
  box-shadow: var(--shadow); }
.skcard .a { aspect-ratio: 16/7; }
.skcard .b { padding: 13px 14px; }
.skcard .b div { height: 12px; margin-bottom: 8px; }

/* ---------- صنف ---------- */
.item { display: flex; gap: 11px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--surface);
  display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex: 0 0 auto;
  overflow: hidden; }
.item .ic img { width: 100%; height: 100%; object-fit: cover; }
.item .grow { flex: 1; min-width: 0; }
.item .nm { font-weight: 700; font-size: .92rem; }
.item .ds { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.item .pr { font-weight: 800; color: var(--green); font-size: .9rem; white-space: nowrap; }
.item.off { opacity: .5; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 31px; height: 31px; border-radius: 9px; border: 1.5px solid var(--line);
  background: #fff; cursor: pointer; font-size: 1.1rem; font-weight: 800; color: var(--green);
  display: flex; align-items: center; justify-content: center; }
.qty button:hover { border-color: var(--gold); }
.qty .n { min-width: 20px; text-align: center; font-weight: 800; }

/* ---------- الفاتورة ---------- */
.bill div { display: flex; justify-content: space-between; padding: 6px 0; font-size: .9rem; }
.bill .tot { border-top: 1.5px dashed var(--line); margin-top: 6px; padding-top: 10px;
  font-weight: 900; font-size: 1.06rem; color: var(--green); }
.bill .disc { color: var(--success); }

/* ---------- شريط الحالة ---------- */
.track { display: flex; gap: 0; margin: 10px 0 4px; }
.track .st { flex: 1; text-align: center; font-size: .64rem; color: var(--muted); position: relative; }
.track .st .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--line);
  margin: 0 auto 5px; }
.track .st.done .dot { background: var(--success); }
.track .st.done { color: var(--green); font-weight: 800; }
.track .st::before { content: ''; position: absolute; top: 6px; inset-inline-start: 50%;
  width: 100%; height: 2px; background: var(--line); z-index: -1; }
.track .st:last-child::before { display: none; }
.track { position: relative; z-index: 0; }

.ord-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 6px; }
.ord-no { font-family: ui-monospace, monospace; font-weight: 900; color: var(--gold-dark);
  background: #FDF6E3; border-radius: 8px; padding: 2px 9px; font-size: .85rem; }
.st-chip { border-radius: 999px; padding: 3px 11px; font-size: .74rem; font-weight: 800; }
.st-chip.live { background: #E7F0FF; color: #1147a6; }
.st-chip.done { background: var(--success-bg); color: #067a4d; }
.st-chip.bad { background: var(--error-bg); color: var(--error); }

/* ---------- الشريط العائم للسلة ---------- */
.cartbar { position: fixed; inset-inline: 0; bottom: calc(58px + env(safe-area-inset-bottom));
  z-index: 55; padding: 0 12px 10px; max-width: 760px; margin: 0 auto; display: none; }
.cartbar.on { display: block; }
.cartbar .in { background: var(--green); color: #fff; border-radius: 14px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  box-shadow: 0 6px 22px rgba(11,61,46,.35); font-weight: 800; }
.cartbar .in .amt { color: var(--gold-light); }

/* ---------- شاشة الدخول ---------- */
.auth-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(4,18,13,.93);
  backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;
  padding: 22px; overflow-y: auto; }
.auth-box { background: var(--card); border-radius: 20px; padding: 26px 22px; width: 100%;
  max-width: 400px; box-shadow: 0 18px 50px rgba(0,0,0,.4); position: relative; }
.auth-x { position: absolute; inset-inline-end: 12px; top: 12px; width: 34px; height: 34px;
  border: 0; border-radius: 10px; background: var(--surface); color: var(--muted);
  font-size: 1rem; cursor: pointer; }
.auth-x:hover { background: #e6ebe8; }
.auth-box .logo { text-align: center; margin-bottom: 18px; }
.auth-box .logo img { height: 46px; }
.auth-box .logo p { color: var(--muted); font-size: .84rem; margin-top: 6px; }
.tabs { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
.tabs button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px;
  cursor: pointer; font-weight: 700; color: var(--muted); font-size: .9rem; }
.tabs button.on { background: #fff; color: var(--green); box-shadow: var(--shadow); }

/* ---------- بطاقة التتبّع ---------- */
.thero { background: linear-gradient(160deg, var(--green), var(--green-2)); color: #fff;
  border-radius: 18px; padding: 22px 18px 16px; margin-bottom: 13px; text-align: center;
  box-shadow: 0 6px 22px rgba(11,61,46,.28); }

<style id="frameGuard">html{display:none !important}</style>
<script>
/* منع التأطير — على مرحلتين، والأولى هي الحاسمة.
 *
 * `frame-ancestors` في وسم meta تتجاهله المتصفحات (تعمل في ترويسة HTTP
 * وحدها، وGitHub Pages لا تسمح بترويسات مخصصة). وكان هنا سطرٌ واحد يكسر
 * الإطار بالانتقال إلى الأعلى — وهو **يُهزَم**: من يؤطّر الصفحة بـ
 * `<iframe sandbox="allow-scripts">` يمنع المتصفحُ فيه الانتقال إلى
 * الأعلى، فيفشل الكسر بصمت وتبقى الصفحة معروضةً داخل إطار المهاجم،
 * يضع فوقها ما يشاء ويقودها إلى نقراتٍ لا يقصدها صاحبها.
 *
 * فالصفحة تبدأ **مخفيّة** (السطر أعلاه) ولا تُكشف إلا بعد التيقّن أنها
 * في الأعلى. الإخفاء لا يحتاج إذناً من أحد ولا يُمنع بصندوقٍ رملي.
 * ومحاولة الكسر تبقى بعده لمن أطّرها بلا sandbox: خروجٌ إلى الأعلى
 * أفضل من صفحةٍ بيضاء. */
(function () {
  var framed = true;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed) {
    var g = document.getElementById('frameGuard');
    if (g) g.remove();
    return;
  }
  try { window.top.location = window.self.location; } catch (e) {}
})();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, orderBy, limit,
  getDocs, onSnapshot, Timestamp, writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBoAvj7C2vJyzERVnK26Oa-dJZ1mV0vO6g',
  authDomain: 'restaurant-app-ed699.firebaseapp.com',
  projectId: 'restaurant-app-ed699',
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

/* ============================================================
   التسعير — **يُقرأ من `delivery_settings/incentives`** كما يقرؤه التطبيق،
   والثوابت أدناه احتياطٌ لا مصدر.

   كانت هذه الثوابت منقولةً من `Pricing` في `lib/utils/helpers.dart` ومصدراً
   وحيداً، ثم نقل مساعد التطبيق أجرة التوصيل إلى إعدادٍ يضبطه المدير من
   لوحته (`IncentiveSettings`) — فصار كل تعديلٍ يجريه المالك على الأجرة
   يُنتج **فاتورتين لطلبٍ واحد**: ما يدفعه من طلب من التطبيق وما يدفعه من
   طلب من الويب. وهذا بالضبط ما حذّر منه التعليق القديم، فوقع فيه لأن نسخة
   الرقم لا تعلم بتغيّر أصله.

   والقيم الاحتياطية هي **افتراضات `IncentiveSettings` نفسها**: حين يتعذّر
   بلوغ الإعداد يعمل التطبيق بها أيضاً، فيتطابق الجانبان حتى في الفشل.
   ============================================================ */
const PRICING = {
  appCommissionRate: 0.15,
  baseDeliveryFee: 9.0,
  baseDeliveryKm: 7.0,
  perExtraKmFee: 1.0,
  fixedDeliveryCommission: 3.0,
  maxDeliveryDistanceKm: 25.0,
};
/* الإعداد الحيّ (يُملأ بعد الدخول — القواعد تسمح بقراءته لأي مسجَّل).
 * الزائر يتصفّح بالاحتياطي، ويُعاد الرسم فور وصول الإعداد. */
const SETTINGS = { ...PRICING, firstCashOrderCap: 0, loaded: false };
async function loadPricing() {
  try {
    const s = (await getDoc(doc(db, 'delivery_settings', 'incentives'))).data() || {};
    const n = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
    SETTINGS.baseDeliveryFee = n(s.deliveryBaseFee, PRICING.baseDeliveryFee);
    SETTINGS.baseDeliveryKm = n(s.deliveryBaseKm, PRICING.baseDeliveryKm);
    SETTINGS.perExtraKmFee = n(s.deliveryPerKmFee, PRICING.perExtraKmFee);
    SETTINGS.fixedDeliveryCommission = n(s.deliveryAppCut, PRICING.fixedDeliveryCommission);
    SETTINGS.maxDeliveryDistanceKm = n(s.maxDeliveryDistanceKm, PRICING.maxDeliveryDistanceKm);
    // سقف أول طلب نقدي (صفر = بلا سقف، وهو الافتراضي كما في التطبيق).
    SETTINGS.firstCashOrderCap = n(s.firstCashOrderCap, 0);
    SETTINGS.loaded = true;
    render();
  } catch (e) { /* يبقى الاحتياطي — وهو ما يعمل به التطبيق عند الفشل نفسه */ }
}
/* كسر الكيلومتر يُجبر للأعلى (٩٫٨ كم ← ١٠) — كما في ceilExtraKm. */
function ceilExtraKm(distanceKm, freeKm) {
  const extra = distanceKm - freeKm;
  return extra <= 0 ? 0 : Math.ceil(extra);
}
function deliveryFeeFor(distanceKm) {
  return SETTINGS.baseDeliveryFee + ceilExtraKm(distanceKm, SETTINGS.baseDeliveryKm) * SETTINGS.perExtraKmFee;
}
/* النسبة الفعّالة للمطعم: صفرٌ ما دام «مجاني حتى» في المستقبل، ثم النسبة
 * المتفَّق عليها — نسخة `effectiveCommissionPercent` في نموذج التطبيق.
 * تُختم على الطلب عند الإنشاء فينتهي الإعفاء وحده في موعده. */
function effectiveCommissionPercent(r) {
  const pct = Number(r && r.commissionPercent);
  const nominal = Number.isFinite(pct) ? pct : 15;
  const until = r && r.commissionFreeUntil;
  const ms = until && typeof until.toMillis === 'function' ? until.toMillis()
    : until && until.seconds != null ? until.seconds * 1000 : null;
  return ms != null && ms > Date.now() ? 0 : nominal;
}
function appCommission(itemsTotal, r) {
  return itemsTotal * (effectiveCommissionPercent(r) / 100);
}
function isOutOfRange(km) { return km > SETTINGS.maxDeliveryDistanceKm; }

/* المسافة بخط مستقيم — نفس haversine المستخدم في التطبيق. */
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371, rad = (d) => d * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

const money = (n) => `${(Number(n) || 0).toFixed(2)} ر.س`;

/* حالات الطلب — الأسماء كما تُكتب في Firestore، والعربية للعرض فقط. */
const STATUS_AR = {
  created: 'أُنشئ', restaurantPending: 'بانتظار قبول المطعم',
  restaurantAccepted: 'قَبِل المطعم', preparing: 'قيد التحضير',
  readyForPickup: 'جاهز للاستلام', searchingDriver: 'نبحث عن كابتن',
  driverAssigned: 'أُسنِد لكابتن', pickedUp: 'استلمه الكابتن',
  onTheWay: 'في الطريق إليك', delivered: 'تم التسليم',
  restaurantRejected: 'اعتذر المطعم', noDriverFound: 'لم نجد كابتناً',
  cancelled: 'أُلغي', refunded: 'مُسترجَع',
};
const ACTIVE = ['created','restaurantPending','restaurantAccepted','preparing','readyForPickup',
  'searchingDriver','driverAssigned','pickedUp','onTheWay'];
const BAD = ['restaurantRejected','noDriverFound','cancelled','refunded'];
/* مراحل شريط التتبّع الأربع — كل حالة تنتمي لمرحلة. */
const TRACK = [
  ['استُلم طلبك', ['created','restaurantPending']],
  ['يُحضَّر', ['restaurantAccepted','preparing']],
  ['كابتن في الطريق', ['readyForPickup','searchingDriver','driverAssigned','pickedUp','onTheWay']],
  ['وصل', ['delivered']],
];

/* ---------------- الحالة ---------------- */
const S = {
  user: null,            // مستند users الخاص بالداخل
  page: 'home',
  restaurants: [],
  resto: null,           // المطعم المفتوح
  menu: { cats: [], items: [] },
  cart: [],              // {menuItemId,name,price,emoji,quantity}
  cartResto: null,       // {id,name} — سلة واحدة لمطعم واحد
  orders: [],
  unsubOrders: null,
  addr: { text: '', lat: null, lng: null, auto: '', suggest: null, geoFailed: false },
  busy: false,
  /* ملصق المطعم يحمل `?r=<معرّف المطعم>`: يُقرأ مرّةً عند الإقلاع ويُستهلك
   * بعد وصول قائمة المطاعم. حُفظ في الحالة لا في المتغيّر العام كي لا
   * يُعاد فتح المطعم كلما أُعيد تحميل القائمة والعميل قد خرج منه بإرادته. */
  deepResto: new URLSearchParams(location.search).get('r') || null,
  deepMiss: false,       // ملصقٌ يشير إلى مطعمٍ لم يعد موجوداً
};

/* السلة تعيش في المتصفح: من أضاف صنفاً ثم حدّث الصفحة لا يبدأ من الصفر. */
function saveCart() {
  try {
    localStorage.setItem('zadgo_cart', JSON.stringify({ cart: S.cart, resto: S.cartResto }));
  } catch (e) { /* وضع التصفح الخاص يمنع التخزين — السلة تبقى في الذاكرة */ }
}
function loadCart() {
  try {
    const raw = localStorage.getItem('zadgo_cart');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.cart)) { S.cart = d.cart; S.cartResto = d.resto || null; }
  } catch (e) { /* بيانات تالفة: نبدأ بسلة فارغة بدل أن نُسقط الصفحة */ }
}
const cartCount = () => S.cart.reduce((s, i) => s + i.quantity, 0);
const cartTotal = () => S.cart.reduce((s, i) => s + i.price * i.quantity, 0);

/* ---------------- الدخول ---------------- */
/* الصندوق نفسه يحمل الخطأ والبشارة، فتُعاد فئته في كل مرة صراحةً: بشارةُ
 * «أُرسل رابط الاستعادة» كانت تُبقيه أخضر، فيظهر الخطأ التالي بلون النجاح. */
function authError(msg) { const e = $('authErr'); e.className = 'err'; e.textContent = msg; }
function authOk(msg) { const e = $('authErr'); e.className = 'ok'; e.textContent = msg; }
function clearAuthError() { const e = $('authErr'); e.className = 'err hide'; e.textContent = ''; }

const AUTH_AR = {
  'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة',
  'auth/invalid-email': 'صيغة البريد غير صحيحة',
  'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
  'auth/wrong-password': 'كلمة المرور غير صحيحة',
  'auth/email-already-in-use': 'هذا البريد مسجّل بالفعل — استخدم «دخول»',
  'auth/weak-password': 'كلمة المرور قصيرة — ٦ أحرف فأكثر',
  'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة',
  'auth/network-request-failed': 'تعذّر الاتصال بالشبكة',
};
const authMsg = (e) => AUTH_AR[e && e.code] || 'تعذّر إتمام العملية، حاول مجدداً';

$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on');
  $('loginForm').classList.remove('hide'); $('regForm').classList.add('hide'); clearAuthError();
};
$('tabReg').onclick = () => {
  $('tabReg').classList.add('on'); $('tabLogin').classList.remove('on');
  $('regForm').classList.remove('hide'); $('loginForm').classList.add('hide'); clearAuthError();
};

$('loginForm').onsubmit = async (e) => {
  e.preventDefault(); clearAuthError();
  const b = $('lBtn'); b.disabled = true; b.textContent = 'جارٍ الدخول…';
  try {
    await signInWithEmailAndPassword(auth, $('lEmail').value.trim(), $('lPass').value);
  } catch (err) { authError(authMsg(err)); }
  b.disabled = false; b.textContent = 'دخول';
};

$('lReset').onclick = async () => {
  const em = $('lEmail').value.trim();
  if (!em) { authError('اكتب بريدك في الحقل أعلاه أولاً'); return; }
  try {
    await sendPasswordResetEmail(auth, em);
    authOk('أُرسل رابط الاستعادة إلى بريدك');
  } catch (err) { authError(authMsg(err)); }
};

$('regForm').onsubmit = async (e) => {
  e.preventDefault(); clearAuthError();
  const name = $('rName').value.trim(), phone = $('rPhone').value.trim();
  const email = $('rEmail').value.trim(), pass = $('rPass').value;
  if (name.length < 2) { authError('اكتب اسمك كاملاً'); return; }
  if (!/^0\d{9}$/.test(phone)) { authError('رقم الجوال عشرة أرقام يبدأ بصفر'); return; }
  const b = $('rBtn'); b.disabled = true; b.textContent = 'جارٍ الإنشاء…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    // مستند المستخدم بنفس شكل AppUser.toMap في التطبيق — الدور «عميل»
    // صراحةً، فقواعد Firestore تشترطه لإنشاء أي طلب.
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, phone, role: 'customer',
      createdAt: Timestamp.fromDate(new Date()),
      isActive: true, walletBalance: 0, savedAddresses: [],
    });
  } catch (err) { authError(authMsg(err)); b.disabled = false; b.textContent = 'إنشاء الحساب'; return; }
  b.disabled = false; b.textContent = 'إنشاء الحساب';
};

$('logoutBtn').onclick = async () => {
  if (!S.user) { showAuth(); return; }        // زائر: الزر يقول «دخول»
  if (!confirm('تسجيل الخروج؟ سلتك تبقى محفوظة على هذا الجهاز.')) return;
  await signOut(auth);
  location.reload();
};

/* بوابة الحساب تُفتح بنيّة معلومة: من ضغط «إرسال الطلب» يعود إلى سلته بعد
 * دخوله لا إلى الصفحة الأولى — فلا يُعاقَب بإعادة الطريق من أوله. */
function showAuth(why, next) {
  S.authNext = next || null;
  $('authWhy').textContent = why || 'ادخل بحسابك أو أنشئ حساباً جديداً';
  clearAuthError();
  $('authView').classList.remove('hide');
}
// إغلاق البوابة يُلغي النيّة معها — وإلا قفزت بالعميل لاحقاً إلى وجهةٍ نسيها.
function hideAuth() { $('authView').classList.add('hide'); S.authNext = null; }
$('authClose').onclick = hideAuth;
$('backToBrowse').onclick = (e) => { e.preventDefault(); hideAuth(); };

onAuthStateChanged(auth, async (u) => {
  if (!u) {
    // وضع الزائر: التطبيق مفتوح للتصفّح، والبوابة مغلقة حتى يُطلب منها شيء.
    S.user = null;
    if (S.unsubOrders) { S.unsubOrders(); S.unsubOrders = null; }
    S.orders = [];
    hideAuth();
    if (!S.booted) { S.booted = true; loadCart(); loadRestaurants(); go('home'); }
    else render();
    return;
  }
  let snap;
  try { snap = await getDoc(doc(db, 'users', u.uid)); }
  catch (e) { authError('تعذّر قراءة حسابك — تحقّق من اتصالك'); return; }
  if (!snap.exists()) {
    // حساب دخول بلا مستند: لا نخمّن دوره ولا ننشئه — قد يكون حساب كابتن
    // أو مطعم أُنشئ من مسارٍ آخر، وكتابة role هنا تُفسد صلاحياته.
    await signOut(auth);
    authError('لا يوجد ملف لهذا الحساب. إن كنت كابتناً أو مطعماً فاستخدم تطبيقك الخاص.');
    return;
  }
  const d = snap.data();
  if (d.role !== 'customer') {
    await signOut(auth);
    authError('هذه الصفحة للعملاء فقط. حسابك مسجّل بدور آخر — استخدم تطبيقك الخاص.');
    return;
  }
  if (d.isActive === false) {
    await signOut(auth);
    authError('حسابك موقوف حالياً. تواصل مع الدعم.');
    return;
  }
  S.user = { uid: u.uid, ...d };
  hideAuth();
  if (!S.booted) { S.booted = true; loadCart(); loadRestaurants(); }
  // إعداد التسعير يُقرأ عند كل دخول لا مرّةً عند الإقلاع: القواعد
  // تشترط التسجيل لقراءته، وزائرٌ دخل الآن لم يكن يستطيع قبل قليل.
  loadPricing();
  listenOrders();
  // نيّةٌ كانت معلّقة قبل الدخول تُستأنف الآن؛ وإلا نبقى حيث كان الزائر.
  const next = S.authNext; S.authNext = null;
  go(next || S.page || 'home');
});

/* ---------------- التنقل ---------------- */
const PAGES = [
  ['home', '🍽️', 'المطاعم'],
  ['cart', '🛒', 'سلتي'],
  ['orders', '🧾', 'طلباتي'],
  ['account', '👤', 'حسابي'],
];
function renderNav() {
  $('bottomNav').innerHTML = PAGES.map(([k, ico, lbl]) => {
    const n = k === 'cart' ? cartCount()
      : k === 'orders' ? S.orders.filter((o) => ACTIVE.includes(o.status)).length : 0;
    return `<button data-nav="${k}" class="${S.page === k ? 'active' : ''}">
      <span class="ico">${ico}</span>${lbl}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-nav]');
  if (b) go(b.dataset.nav);
});
$('backBtn').onclick = () => go(S.page === 'resto' ? 'home' : 'orders');
$('cartBarIn').onclick = () => go('cart');
$('sheetBg').onclick = closeSheet;
// زرّ رجوع المتصفح يغلق الورقة قبل أن يغادر الصفحة — سلوك متوقَّع على الجوال.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

function go(p) {
  // مراقب الأقسام مربوط بصفحة مطعمٍ بعينها ولا معنى لبقائه بعد مغادرتها.
  if (S.catObs && p !== 'resto') { S.catObs.disconnect(); S.catObs = null; }
  // تدفّق موقع الكابتن يخصّ شاشة طلبٍ مفتوح — بقاؤه بعدها قراءاتٌ بلا قارئ.
  if (p !== 'order' && S.driverUnsub) {
    S.driverUnsub(); S.driverUnsub = null; S.driverListening = null; S.driverDoc = null;
  }
  if (S.sheet) closeSheet();
  S.page = p;
  const titles = { home: 'المطاعم', cart: 'سلتي', orders: 'طلباتي', account: 'حسابي',
    resto: S.resto ? S.resto.name : 'المطعم', order: 'تفاصيل الطلب' };
  $('pageTitle').textContent = titles[p] || 'اطلب الآن';
  $('topBar').classList.toggle('has-back', p === 'resto' || p === 'order');
  window.scrollTo(0, 0);
  render();
}
function render() {
  renderNav();
  $('logoutBtn').textContent = S.user ? 'خروج' : 'دخول';
  const bar = $('cartBar');
  const show = S.cart.length > 0 && (S.page === 'home' || S.page === 'resto');
  bar.classList.toggle('on', show);
  if (show) { $('cbCount').textContent = cartCount(); $('cbTotal').textContent = money(cartTotal()); }
  const R = { home: viewHome, resto: viewResto, cart: viewCart, orders: viewOrders,
    order: viewOrder, account: viewAccount };
  (R[S.page] || viewHome)();
}

/* ---------------- المطاعم ---------------- */
async function loadRestaurants() {
  S.loadingRestaurants = true;
  if (S.page === 'home') render();
  try {
    const snap = await getDocs(collection(db, 'restaurants'));
    S.restaurants = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      // المفتوح أولاً ثم الأعلى تقييماً — لا نُخفي المغلق بل نُنزله.
      .sort((a, b) => (b.isOpen === false ? -1 : 1) - (a.isOpen === false ? -1 : 1)
        || (b.rating || 0) - (a.rating || 0));
  } catch (e) {
    S.restaurants = [];
  }
  S.loadingRestaurants = false;
  if (S.deepResto) {
    const id = S.deepResto; S.deepResto = null;
    if (S.restaurants.some((r) => r.id === id)) { openResto(id); return; }
    // ملصقٌ مطبوعٌ يبقى على الجدار بعد أن يترك المطعمُ المنصّة: نُنزل
    // العميل على القائمة ونقول له لماذا، بدل شاشةٍ فارغة يظنّها عطلاً.
    S.deepMiss = true;
  }
  if (S.page === 'home') render();
}

/* المرشّحات هي ما يسأل عنه العميل فعلاً قبل أن يطلب: أمفتوحٌ الآن؟ كم
 * يستغرق؟ وكم أقلّ ما يجب أن أطلبه؟ — والأخير أكثر ما يُنهي الطلب عند
 * السلة حين يُكتشف متأخراً. */
const FILTERS = [
  ['all', 'الكل'],
  ['open', 'مفتوح الآن'],
  ['fast', 'الأسرع'],
  ['top', 'الأعلى تقييماً'],
  ['low', 'أقل حد أدنى'],
];
function filterRestaurants(term, f) {
  const t = (term || '').trim();
  let list = t ? S.restaurants.filter((r) =>
    `${r.name || ''} ${r.branchName || ''} ${r.description || ''}`.includes(t)) : [...S.restaurants];
  if (f === 'open') list = list.filter((r) => r.isOpen !== false);
  if (f === 'fast') list.sort((a, b) => (a.estimatedTimeMin || 30) - (b.estimatedTimeMin || 30));
  if (f === 'top') list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  if (f === 'low') list.sort((a, b) => (a.minOrder ?? 20) - (b.minOrder ?? 20));
  return list;
}
/* مطعمٌ لم يقيّمه أحد يحمل 5.0 افتراضيةً في قاعدة البيانات. عرضها نجمةً
 * كاملة يناقض ما نَعِد به في الصفحة الرئيسية: «تقييمات من عملاء طلبوا فعلاً
 * — لا مجاملات». فالجديد يُقال عنه جديد. */
const ratingChip = (r) =>
  (r.ratingCount || 0) > 0 ? `⭐ ${(r.rating ?? 5).toFixed(1)}` : '✨ جديد';

function restoCard(r) {
  const shut = r.isOpen === false;
  return `<article class="rcard ${shut ? 'shut' : ''}" data-resto="${esc(r.id)}">
    <div class="cover">
      ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" alt="" loading="lazy" data-fb="${esc(r.emoji || '🍽️')}">` : esc(r.emoji || '🍽️')}
      ${shut ? '<div class="shutlbl"><span>مغلق الآن</span></div>' : ''}
      <div class="chips">
        <span class="chip star">${ratingChip(r)}</span>
        <span class="chip">⏱️ ${esc(r.estimatedTimeMin || 30)} د</span>
        <span class="chip">أقلّ طلب ${money(r.minOrder ?? 20)}</span>
      </div>
    </div>
    <div class="body">
      <div class="nm">${esc(r.name || 'مطعم')}</div>
      ${r.branchName ? `<div class="br">${esc(r.branchName)}</div>` : ''}
      ${r.description ? `<div class="ds">${esc(r.description)}</div>` : ''}
    </div>
  </article>`;
}
function viewHome() {
  if (S.loadingRestaurants) {
    $('main').innerHTML = '<div class="searchbar"><input disabled placeholder="ابحث عن مطعم…"></div>'
      + Array.from({ length: 3 }, () => `<div class="skcard"><div class="a sk"></div>
        <div class="b"><div class="sk" style="width:55%"></div><div class="sk" style="width:35%"></div></div></div>`).join('');
    return;
  }
  if (!S.restaurants.length) {
    $('main').innerHTML = `<div class="empty"><div class="big">🍽️</div>
      <h3>لا توجد مطاعم متاحة الآن</h3><p>نضيف مطاعم المدينة تباعاً — عد إلينا قريباً.</p></div>`;
    return;
  }
  $('main').innerHTML = `
    ${S.deepMiss ? `<div class="note">المطعم الذي يشير إليه الملصق لم يعد متاحاً على المنصّة.
      هذه بقيّة مطاعمنا.</div>` : ''}
    <div class="searchbar">
      <input type="search" id="q" placeholder="ابحث عن مطعم…" value="${esc(S.q || '')}">
      <div class="filters">${FILTERS.map(([k, l]) =>
        `<button data-filter="${k}" class="${(S.filter || 'all') === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
    <div id="rlist"></div>`;
  const paint = () => {
    const list = filterRestaurants(S.q, S.filter || 'all');
    $('rlist').innerHTML = list.length ? list.map(restoCard).join('')
      : `<div class="empty"><div class="big">🔍</div><h3>لا نتيجة</h3>
         <p>جرّب اسماً آخر أو أزل المرشّح.</p></div>`;
  };
  paint();
  $('q').oninput = (e) => { S.q = e.target.value; paint(); };
  $('main').onclick = (e) => {
    const f = e.target.closest('[data-filter]');
    if (f) {
      S.filter = f.dataset.filter;
      [...document.querySelectorAll('[data-filter]')].forEach((b) =>
        b.classList.toggle('on', b.dataset.filter === S.filter));
      paint(); return;
    }
    const el = e.target.closest('[data-resto]');
    if (el) openResto(el.dataset.resto);
  };
}

async function openResto(id) {
  S.resto = S.restaurants.find((r) => r.id === id) || null;
  S.loadingMenu = true;
  S.menu = { cats: [], items: [] };
  go('resto');
  try {
    const [cats, items] = await Promise.all([
      getDocs(collection(db, 'restaurants', id, 'categories')),
      getDocs(collection(db, 'restaurants', id, 'items')),
    ]);
    S.menu = {
      cats: cats.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0)),
      items: items.docs.map((d) => ({ id: d.id, ...d.data() })),
    };
  } catch (e) { S.menu = { cats: [], items: [] }; }
  S.loadingMenu = false;
  if (S.page === 'resto') render();
}

function viewResto() {
  const r = S.resto;
  if (!r) { go('home'); return; }
  const closed = r.isOpen === false;
  const hero = `
    <div class="rhero">
      ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" alt="" data-fb="${esc(r.emoji || '🍽️')}">` : esc(r.emoji || '🍽️')}
      <div class="txt"><h2>${esc(r.name || '')}</h2>
        ${r.branchName ? `<div class="br">${esc(r.branchName)}</div>` : ''}</div>
    </div>
    <div class="rstats">
      <div><b>${ratingChip(r)}</b><span>${(r.ratingCount || 0) > 0
        ? `${r.ratingCount} تقييم` : 'لم يُقيَّم بعد'}</span></div>
      <div><b>${esc(r.estimatedTimeMin || 30)} د</b><span>وقت التحضير</span></div>
      <div><b>${money(r.minOrder ?? 20)}</b><span>أقلّ طلب</span></div>
    </div>
    ${closed ? `<div class="err" style="margin-top:12px">المطعم مغلق الآن — تصفّح قائمة الطعام، واطلب عند فتحه.</div>` : ''}`;

  if (S.loadingMenu) {
    $('main').innerHTML = hero + Array.from({ length: 4 }, () =>
      `<div class="card"><div class="sk" style="height:52px"></div></div>`).join('');
    return;
  }

  const cats = (S.menu.cats.length ? S.menu.cats : [{ id: null, name: 'قائمة الطعام' }])
    .map((c) => ({ ...c, its: S.menu.items.filter((i) => (c.id === null ? true : i.categoryId === c.id)) }))
    .filter((c) => c.its.length);

  const body = cats.map((c, ci) => `
    <section class="catsec" id="cat${ci}">
      <div class="sec-title">${esc(c.name || 'قسم')}</div>
      <div class="card">${c.its.map((i) => {
        const off = i.isAvailable === false || (i.trackStock && (i.stockQuantity ?? 0) <= 0);
        const inCart = S.cart.find((x) => x.menuItemId === i.id);
        return `<div class="item ${off ? 'off' : ''}" ${off ? '' : `data-open="${esc(i.id)}"`}
                    style="${off ? '' : 'cursor:pointer'}">
          <div class="ic">${i.imageUrl ? `<img src="${esc(i.imageUrl)}" alt="" loading="lazy" data-fb="${esc(i.emoji || '🍔')}">` : esc(i.emoji || '🍔')}</div>
          <div class="grow">
            <div class="nm">${esc(i.name || '')}</div>
            ${i.description ? `<div class="ds">${esc(i.description)}</div>` : ''}
            ${i.kcal ? `<div class="ds">${esc(i.kcal)} سعرة</div>` : ''}
            <div class="pr">${money(i.price)}</div>
          </div>
          ${off ? '<span class="pill closed">غير متوفر</span>'
            : inCart ? `<div class="qty">
                <button data-dec="${esc(i.id)}">−</button><span class="n">${inCart.quantity}</span>
                <button data-inc="${esc(i.id)}">+</button></div>`
            : `<button class="btn sm" data-add="${esc(i.id)}">إضافة</button>`}
        </div>`;
      }).join('')}</div>
    </section>`).join('');

  const tabs = cats.length > 1 ? `<div class="cattabs" id="catTabs">${cats.map((c, ci) =>
    `<button data-cat="${ci}" class="${ci === 0 ? 'on' : ''}">${esc(c.name || 'قسم')}</button>`).join('')}</div>` : '';

  $('main').innerHTML = hero + tabs +
    (body || `<div class="empty"><div class="big">📋</div><h3>لا أصناف منشورة بعد</h3></div>`);

  $('main').onclick = (e) => {
    const tab = e.target.closest('[data-cat]');
    if (tab) {
      const sec = $('cat' + tab.dataset.cat);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // التبويب يُضاء بالنيّة لا بالهندسة: قسمٌ قصير في آخر القائمة قد لا يبلغ
      // منتصف الشاشة مهما مُرِّر (الصفحة تنتهي قبله)، فلو انتظرنا المراقب
      // وحده لضغط العميل تبويباً ورأى غيره مضيئاً.
      document.querySelectorAll('[data-cat]').forEach((b) =>
        b.classList.toggle('on', b === tab));
      S.tabLock = Date.now();
      return;
    }
    // الزرّان يسبقان فتح الورقة: من ضغط + لا يريد ورقةً بل صنفاً أكثر.
    const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'),
      add = e.target.closest('[data-add]');
    if (inc) { changeQty(inc.dataset.inc, +1); return; }
    if (dec) { changeQty(dec.dataset.dec, -1); return; }
    if (add) { openSheet(add.dataset.add); return; }
    const row = e.target.closest('[data-open]');
    if (row) openSheet(row.dataset.open);
  };

  // التبويب النشط يتبع ما تراه العين لا آخر ما ضُغط.
  if (cats.length > 1) {
    const obs = new IntersectionObserver((entries) => {
      // نافذة الرصد الثلث العلوي لا شريطٌ رفيع في المنتصف: الشريط الرفيع
      // يتخطّاه قسمٌ قصير بين لقطتَي تمرير فلا يُضيء تبويبه أبداً.
      if (S.tabLock && Date.now() - S.tabLock < 900) return;  // قفزةٌ جارية بطلب العميل
      const vis = entries.filter((x) => x.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!vis) return;
      const idx = vis.target.id.replace('cat', '');
      document.querySelectorAll('[data-cat]').forEach((b) =>
        b.classList.toggle('on', b.dataset.cat === idx));
    }, { rootMargin: '-15% 0px -55% 0px' });
    cats.forEach((_, ci) => { const el = $('cat' + ci); if (el) obs.observe(el); });
    S.catObs = obs;
  }
}

/* ---------------- ورقة الصنف ----------------
 * الإضافة المباشرة تصلح لصنفٍ لا خيار فيه، لكنها تحرم العميل من رؤية الصورة
 * كاملة واختيار الكمية قبل الالتزام. الورقة تعطيه ذلك بلا مغادرة القائمة. */
function openSheet(itemId) {
  const it = S.menu.items.find((i) => i.id === itemId);
  if (!it) return;
  S.sheet = { item: it, qty: 1 };
  paintSheet();
  requestAnimationFrame(() => {
    $('sheetBg').classList.add('on'); $('sheet').classList.add('on');
  });
}
function closeSheet() {
  $('sheetBg').classList.remove('on'); $('sheet').classList.remove('on');
  S.sheet = null;
}
function paintSheet() {
  const s = S.sheet;
  if (!s) return;
  const i = s.item;
  $('sheet').innerHTML = `
    <div class="grab"></div>
    <div class="pic">${i.imageUrl ? `<img src="${esc(i.imageUrl)}" alt="" data-fb="${esc(i.emoji || '🍔')}">` : esc(i.emoji || '🍔')}</div>
    <div class="in">
      <h3>${esc(i.name || '')}</h3>
      <div class="price">${money(i.price)}</div>
      ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ''}
      ${i.kcal ? `<p class="desc">${esc(i.kcal)} سعرة حرارية</p>` : ''}
      <div class="qrow">
        <button id="shDec" aria-label="أنقص">−</button>
        <span class="n">${s.qty}</span>
        <button id="shInc" aria-label="زد">+</button>
      </div>
      <button class="btn block" id="shAdd">أضف للسلة · ${money((i.price || 0) * s.qty)}</button>
      <button class="btn ghost block" id="shClose" style="margin-top:9px">إغلاق</button>
    </div>`;
  $('shDec').onclick = () => { if (s.qty > 1) { s.qty--; paintSheet(); } };
  $('shInc').onclick = () => { s.qty++; paintSheet(); };
  $('shClose').onclick = closeSheet;
  $('shAdd').onclick = () => { addToCart(i.id, s.qty); closeSheet(); };
}

function addToCart(itemId, qty = 1) {
  const it = S.menu.items.find((i) => i.id === itemId);
  if (!it || !S.resto) return;
  // سلة واحدة لمطعم واحد: الطلب يُسنَد لمطعم بعينه، فخلط مطعمين في سلة
  // واحدة يُنتج طلباً لا يستطيع أي مطعم تحضيره.
  if (S.cartResto && S.cartResto.id !== S.resto.id && S.cart.length) {
    if (!confirm(`سلتك تحتوي أصنافاً من «${S.cartResto.name}». هل تُفرغها وتبدأ من «${S.resto.name}»؟`)) return;
    S.cart = [];
  }
  S.cartResto = { id: S.resto.id, name: S.resto.name, branchName: S.resto.branchName || '' };
  const line = S.cart.find((x) => x.menuItemId === it.id);
  if (line) line.quantity += qty;
  else S.cart.push({ menuItemId: it.id, name: it.name, price: Number(it.price) || 0,
    emoji: it.emoji || '🍔', quantity: qty });
  saveCart(); render();
}
function changeQty(itemId, delta) {
  const line = S.cart.find((x) => x.menuItemId === itemId);
  if (!line) return;
  line.quantity += delta;
  if (line.quantity <= 0) S.cart = S.cart.filter((x) => x.menuItemId !== itemId);
  if (!S.cart.length) S.cartResto = null;
  saveCart(); render();
}

/* ---------------- السلة والطلب ---------------- */
function distanceKm() {
  const r = S.resto && S.cartResto && S.resto.id === S.cartResto.id ? S.resto
    : S.restaurants.find((x) => x.id === (S.cartResto || {}).id);
  if (!r || r.lat == null || r.lng == null || S.addr.lat == null) return null;
  return haversineKm(r.lat, r.lng, S.addr.lat, S.addr.lng);
}

/* ---------------- تحويل الإحداثيات إلى عنوان ----------------
 * يقابل _getAddressFromLatLng في تطبيق العميل (حزمة geocoding هناك،
 * وخدمة OpenStreetMap هنا لأن المتصفح لا يملك مكافئاً محلياً).
 *
 * قاعدتان تحكمانه:
 * ١. **الإخفاق لا يكتب شيئاً في الحقل.** كتابة نصٍّ مثل «تعذّر جلب العنوان»
 *    مكان العنوان تمرّ من أي فحصٍ يكتفي بأن الحقل غير فارغ، فيصل الكابتن
 *    عنوانٌ لا يدلّ على مكان. الصمت هنا أأمن من نصٍّ كاذب.
 * ٢. **لا يمحو ما كتبه العميل بيده.** المكتشَف يملأ الحقل الفارغ أو يستبدل
 *    اكتشافاً سابقاً؛ فإن كان العميل قد كتب تفصيلاً بنفسه عُرض عليه
 *    المكتشَف اقتراحاً يقبله بضغطة.
 */
async function reverseGeocode(lat, lng) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 9000);
  try {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2'
      + `&lat=${lat}&lon=${lng}&zoom=18&accept-language=ar`;
    const res = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } });
    if (!res.ok) return null;
    const d = await res.json();
    const a = (d && d.address) || {};
    // الترتيب من الأدقّ إلى الأعمّ — كما يقرؤه الكابتن: الشارع فالحي فالمدينة.
    // المنطقة الإدارية تُذكر فقط إن غابت المدينة: كابتن يعمل داخل المدينة لا
    // تدلّه «منطقة المدينة المنورة» على شيء، بل تُطيل العنوان وتزحم المفيد.
    const city = a.city || a.town || a.village || a.municipality;
    const parts = [
      a.road || a.pedestrian || a.residential,
      a.neighbourhood || a.suburb || a.quarter || a.city_district,
      city || a.state,
    ].filter(Boolean);
    // أقلّ من جزأين ليس عنواناً يُوصَل إليه — نتركه للعميل بدل أن نملأه بمدينةٍ وحدها.
    return parts.length >= 2 ? [...new Set(parts)].join('، ') : null;
  } catch (e) {
    return null;   // انقطاع أو مهلة أو رفض الخدمة — لا شيء يُكتب
  } finally { clearTimeout(t); }
}

function pickLocation() {
  const b = $('locBtn');
  if (!navigator.geolocation) {
    showOrderErr('متصفحك لا يدعم تحديد الموقع — اكتب عنوانك بالتفصيل وسيتواصل الكابتن معك.');
    return;
  }
  b.disabled = true; b.textContent = '⏳ جارٍ تحديد موقعك…';
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      S.addr.lat = pos.coords.latitude;
      S.addr.lng = pos.coords.longitude;
      S.addr.suggest = null;
      b.textContent = '⏳ جارٍ قراءة العنوان…';
      const found = await reverseGeocode(S.addr.lat, S.addr.lng);
      if (found) {
        const typed = (S.addr.text || '').trim();
        if (!typed || typed === (S.addr.auto || '').trim()) {
          S.addr.text = found;      // الحقل فارغ أو يحمل اكتشافاً سابقاً
          S.addr.auto = found;
        } else {
          S.addr.suggest = found;   // العميل كتب بنفسه — نعرض ولا نمحو
        }
      }
      S.addr.geoFailed = !found;
      render();
    },
    (err) => {
      b.disabled = false;
      showOrderErr(err.code === 1
        ? 'رفض المتصفح إذن الموقع — فعّله من إعدادات الموقع ثم أعد المحاولة.'
        : 'تعذّر تحديد موقعك، حاول مجدداً في مكان مكشوف.');
      b.textContent = '📍 حدّد موقعي على الخريطة';
    },
    { enableHighAccuracy: true, timeout: 15000 },
  );
}
function showOrderErr(msg) {
  const box = $('orderErr');
  if (box) { box.innerHTML = `<div class="err">${esc(msg)}</div>`; box.scrollIntoView({ block: 'center' }); }
}

/* معرّف الطلب: UUID v4 من مولّد المتصفح المعمّي — نفس شكل uuid.v4() في
 * التطبيق، ورقم الطلب أول ستة محارف بحروف كبيرة تماماً كما هناك. */
function uuid4() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

async function placeOrder() {
  if (S.busy) return;
  // البوابة هنا لا عند الباب: الزائر ملأ سلته وعنوانه، وما ينقصه حسابٌ
  // يُنشئه الآن ثم يُتمّ طلبه من حيث وقف.
  if (!S.user) {
    S.addr.text = ($('addr').value || '').trim();   // لا يضيع ما كتبه أثناء الدخول
    showAuth('بقيت خطوة واحدة — ادخل بحسابك لإتمام طلبك', 'cart');
    return;
  }
  const addr = ($('addr').value || '').trim();
  // يُحفظ في الحالة قبل أي إعادة رسم أدناه (قراءة التسعير تُعيد الرسم عند
  // نجاحها) — وإلا عاد الحقل إلى نصٍّ قديم أمام عين العميل وهو يرسل.
  S.addr.text = addr;
  if (addr.length < 8) { showOrderErr('اكتب عنوان التوصيل بتفصيل يكفي الكابتن للوصول.'); return; }
  if (S.addr.lat == null) { showOrderErr('حدّد موقعك أولاً — بدونه لا يعرف الكابتن أين يذهب.'); return; }
  const r = S.restaurants.find((x) => x.id === (S.cartResto || {}).id);
  if (!r) { showOrderErr('تعذّر التعرّف على المطعم — أعد تحميل الصفحة.'); return; }
  // الفحص الحاسم يقرأ المطعم **من الخادم لحظتَه** لا من النسخة المحمَّلة عند
  // فتح الصفحة: قائمة المطاعم تُقرأ مرة واحدة، فلو أغلق المطعم بعدها بساعة
  // بقيت النسخة في الذاكرة تقول «مفتوح» — والزرّ المعطَّل في الواجهة مرسومٌ
  // على تلك النسخة نفسها، فلا يحمي من شيء. قراءةٌ واحدة هنا تحسم.
  /* ونسخة المطعم الطازجة هي أيضاً مصدر نسبة العمولة المختومة أدناه: القاعدة
   * تقارن ما نختمه بنسبة المستند **على الخادم**، فلو غيّر المالك النسبة بعد
   * تحميل الصفحة لرُفض الطلب كلّه برفضٍ لا يفهمه العميل. */
  let restDoc = r;
  try {
    const fresh = await getDoc(doc(db, 'restaurants', r.id));
    if (fresh.exists()) restDoc = { id: r.id, ...fresh.data() };
    if (fresh.exists() && fresh.data().isOpen === false) {
      r.isOpen = false;            // نُحدِّث النسخة فتُصحَّح الشاشة أيضاً
      S.busy = false;
      render();
      showOrderErr('أغلق المطعم للتوّ — لن يصله طلبك. سلتك محفوظة، أرسلها حين يفتح.');
      return;
    }
  } catch (e) { /* تعذّرت القراءة: نمضي بما لدينا بدل منع طلبٍ ربما كان صحيحاً */ }

  /* والتسعير يُعاد قراءته هنا أيضاً: قد يكون الزائر دخل قبل ثوانٍ فلم تصل
   * قراءة الإقلاع بعد، وقد يكون المالك رفع الأجرة منذ دقائق. قراءةٌ واحدة
   * قبل الكتابة أرخص من فاتورةٍ تخالف ما يقرؤه المطعم والكابتن. */
  await loadPricing();

  const km = distanceKm();
  if (km != null && isOutOfRange(km)) { showOrderErr('موقعك خارج نطاق التوصيل.'); return; }

  /* سقف أول طلب نقدي — **مرآةُ واجهةٍ لا حارس**. الحارس الحقيقي في
   * القاعدة، وهذا يوفّر على العميل أن يملأ سلّته ثم يُرفض طلبه برسالةٍ
   * تقنية لا يفهمها. وصفحة الويب نقديةٌ كلها، فالشرط يقع دائماً.
   * (نسخةُ الفحص في `cart_screen.dart:445-452` حرفاً: صفر = بلا سقف،
   * ومن أتمّ توصيلةً ناجحة `cashTrusted` يُرفع عنه.) */
  const cap = SETTINGS.firstCashOrderCap || 0;
  if (cap > 0 && S.user && S.user.cashTrusted !== true && cartTotal() > cap) {
    showOrderErr(`سقف أول طلب نقدي ${money(cap)} — قلّل السلة، `
      + 'وبعد أول توصيلة ناجحة يُرفع السقف عنك.');
    return;
  }

  S.busy = true;
  const b = $('placeBtn'); b.disabled = true; b.textContent = 'جارٍ الإرسال…';

  const orderId = uuid4();
  const orderNumber = orderId.slice(0, 6).toUpperCase();
  const items = S.cart.map((l) => ({ menuItemId: l.menuItemId, name: l.name,
    price: l.price, emoji: l.emoji, quantity: l.quantity }));
  const itemsTotal = cartTotal();
  const driverShare = deliveryFeeFor(km ?? 0);
  const appShare = SETTINGS.fixedDeliveryCommission;
  const now = Timestamp.fromDate(new Date());

  /* شكل المستند مطابق لـ Order.toMap في التطبيق حقلاً بحقل. الحقول المالية
   * تُكتب مرة واحدة عند الإنشاء ولا يعدّلها العميل بعدها (تمنعه القواعد) —
   * ولذلك يجب أن تكون صحيحة من أول كتابة. */
  const payload = {
    restaurantId: r.id,
    restaurantName: r.name || '',
    customerId: S.user.uid,
    customerName: S.user.name || '',
    customerPhone: S.user.phone || '',
    deliveryAddress: addr,
    items,
    status: 'restaurantPending',
    paymentMethod: 'cash',
    isPaid: false,
    createdAt: now,
    updatedAt: null,
    statusChangedAt: now,
    driverId: null, driverName: null, driverPhone: null,
    notes: null,
    driverShare,
    appShare,
    deliveryFee: driverShare + appShare,
    // `itemsTotal` يكتبه `Order.toMap()` في التطبيق ولم تكن هذه الحمولة
    // تكتبه — ثغرة ح٦ في فحص 2026-08-22: قاعدةُ سقف أول طلب نقدي تقرأ
    // قيمة الطلب، فطلبُ الويب يصلها بلا قيمةٍ يُقاس عليها. والانضباط أن
    // تُكتب الحمولتان حقلاً بحقل، وإلا حرست القاعدةُ جانباً وتركت جانباً.
    itemsTotal,
    orderNumber,
    customerRating: null, customerReview: null, driverRating: null,
    isRated: false,
    // النسبة الفعّالة لا ١٥٪ الثابتة: مطعمٌ معفى («مجاني حتى») كان
    // طلبه على الويب يُختم بعمولة كاملة — والقواعد تقبله لأن
    // `commissionPercent` اختياري، فتُجبى منه عمولةٌ أعفاه المالك
    // منها. والحقل نفسه يُختم أدناه كما يفعل التطبيق.
    commissionPercent: effectiveCommissionPercent(restDoc),
    platformCommission: appCommission(itemsTotal, restDoc),
    deliveryLat: S.addr.lat, deliveryLng: S.addr.lng,
    restaurantLat: r.lat ?? null, restaurantLng: r.lng ?? null,
    rejectionReason: null,
    walletUsed: 0,
    driverAcknowledged: true,
    custodyDebited: false,
    discountAmount: 0,
    // تعويض المطعم عن إلغاءٍ بعد التحضير — أضافه مساعد التطبيق (فرع
    // split-customer-app). يُقرأ عنده بقيمةٍ افتراضية صفر، فطلباتي كانت
    // تعمل بدونه؛ لكن الانضباط أن أكتب ما يكتبه حقلاً بحقل. وصفرٌ هو
    // الصحيح دلالةً عند الإنشاء: لا تعويض قبل أن يُحضَّر شيء ويُلغى.
    // (`restaurantHandoverAt` يُكتب عنده بشرط وجود قيمة، فأتركه كما يفعل.)
    restaurantCompensation: 0,
  };

  try {
    await setDoc(doc(db, 'orders', orderId), payload);
    S.cart = []; S.cartResto = null; saveCart();
    S.busy = false;
    // العرض بعد نجاح الطلب لا قبله: لا نشغل العميل بسؤالٍ إداري وهو ينتظر.
    // وفشل الحفظ لا يمسّ الطلب — الطلب تمّ وانتهى.
    const known = addrList().some((a) => (a.address || '').trim() === addr);
    if (!known) {
      const label = prompt('احفظ هذا العنوان لطلباتك القادمة؟ اكتب اسماً له (البيت، العمل…) أو اتركه فارغاً للتجاهل:', 'البيت');
      if (label && label.trim()) {
        try { await saveCurrentAddress(label.trim()); } catch (e) {}
      }
    }
    go('orders');
  } catch (e) {
    S.busy = false;
    b.disabled = false; b.textContent = 'إرسال الطلب';
    showOrderErr(e && e.code === 'permission-denied'
      ? 'رفض الخادم إنشاء الطلب — تأكد أن حسابك حساب عميل، ثم أعد المحاولة.'
      : 'تعذّر إرسال الطلب. تحقّق من اتصالك وأعد المحاولة — لم يُخصم منك شيء.');
  }
}

const stChip = (s) => BAD.includes(s) ? 'bad' : s === 'delivered' ? 'done' : 'live';
const fmtDate = (ts) => {
  const d = ts && ts.toDate ? ts.toDate() : null;
  if (!d) return '';
  return d.toLocaleString('ar-SA', { day: 'numeric', month: 'numeric',
    hour: '2-digit', minute: '2-digit' });
};
const fmtTime = (ts) => {
  const d = ts && ts.toDate ? ts.toDate() : null;
  return d ? d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }) : '';
};

/* الإجمالي يُحسب من حقول المستند لا من نص محفوظ — فلو عدّلت الإدارة سطراً
 * ظهر التعديل هنا كما هو في دفاتر المنصّة. */
function orderTotal(o) {
  const items = (o.items || []).reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
  const fee = (o.driverShare || 0) + (o.appShare || 0);
  return items + fee - (o.discountAmount || 0);
}

function trackHtml(status) {
  const idx = TRACK.findIndex(([, list]) => list.includes(status));
  return `<div class="track">${TRACK.map(([lbl], i) =>
    `<div class="st ${i <= idx ? 'done' : ''}"><div class="dot"></div>${lbl}</div>`).join('')}</div>`;
}

/* ---------------- التتبّع الحيّ ----------------
 * موقع الكابتن مقروء للعميل (قواعد drivers تسمح بذلك لكل مسجَّل دخوله)،
 * فما تَعِد به الصفحة الرئيسية — «موقع مندوبك أولاً بأول» — قابلٌ للوفاء هنا.
 *
 * ولا خريطة: لا لعجزٍ بل لأن بلاطات الخرائط تحميلٌ ثقيل على شبكة جوّال
 * ضعيفة، والمعلومة التي يريدها المنتظر ليست شكل الشوارع بل **كم بقي**.
 * ما نعرضه محسوبٌ من إحداثيات حقيقية لا رسمٌ إيحائي. */
function listenDriver(driverId) {
  if (S.driverUnsub) { S.driverUnsub(); S.driverUnsub = null; }
  S.driverDoc = null;
  if (!driverId) return;
  S.driverUnsub = onSnapshot(doc(db, 'drivers', driverId),
    (d) => {
      S.driverDoc = d.exists() ? d.data() : null;
      if (S.page === 'order') render();
    },
    () => { /* تعذّرت القراءة — تبقى الشاشة بلا مسافة، ولا تنكسر */ });
}

/* سرعة المدينة داخل الأحياء أقرب إلى ٢٥ كم/س منها إلى سرعة الطريق. والناتج
 * يُعرض مدىً لا رقماً واحداً: وعدٌ بدقيقة بعينها يُخلَف، ومدىً يُحترم. */
function etaText(remainingKm) {
  const mins = Math.max(2, Math.round((remainingKm / 25) * 60));
  const lo = Math.max(2, Math.round(mins / 5) * 5);
  return `${lo}–${lo + 5} دقيقة`;
}

function trackingCard(o) {
  const d = S.driverDoc;
  const hasDriverLoc = d && d.lat != null && d.lng != null;
  const toCustomer = hasDriverLoc && o.deliveryLat != null
    ? haversineKm(d.lat, d.lng, o.deliveryLat, o.deliveryLng) : null;
  const legTotal = o.restaurantLat != null && o.deliveryLat != null
    ? haversineKm(o.restaurantLat, o.restaurantLng, o.deliveryLat, o.deliveryLng) : null;
  const enRoute = ['pickedUp', 'onTheWay'].includes(o.status);
  // نسبة القطع من المطعم إليك — تُقصّ بين ٥٪ و٩٥٪ فلا يلتصق الرمز بطرف.
  let pct = null;
  if (enRoute && toCustomer != null && legTotal > 0) {
    pct = Math.min(95, Math.max(5, (1 - toCustomer / legTotal) * 100));
  }
  const HERO = {
    created: ['📨', 'وصل طلبك', 'نُرسله للمطعم الآن'],
    restaurantPending: ['⏳', 'بانتظار قبول المطعم', 'عادةً خلال دقائق قليلة'],
    restaurantAccepted: ['✅', 'قَبِل المطعم طلبك', 'يبدأ التحضير الآن'],
    preparing: ['👨‍🍳', 'طلبك قيد التحضير', 'رائحته تفوح من المطبخ'],
    readyForPickup: ['🥡', 'طلبك جاهز', 'ننتظر الكابتن ليستلمه'],
    searchingDriver: ['🔎', 'نبحث عن كابتن قريب', 'لحظات ويُسنَد طلبك'],
    driverAssigned: ['🛵', 'أُسنِد طلبك لكابتن', 'في طريقه إلى المطعم'],
    pickedUp: ['📦', 'استلم الكابتن طلبك', 'انطلق نحوك'],
    onTheWay: ['🛵', 'الكابتن في الطريق إليك', 'استعدّ لاستلام طلبك'],
  };
  const h = HERO[o.status] || ['🧾', STATUS_AR[o.status] || o.status, ''];
  return `
    <div class="thero">
      <div class="ic">${h[0]}</div>
      <h2>${h[1]}</h2>
      <p>${h[2]}</p>
      ${enRoute && toCustomer != null ? `<div class="eta">
        <b>${etaText(toCustomer)}</b><span>يبعد عنك ${toCustomer.toFixed(1)} كم</span></div>` : ''}
      ${pct != null ? `<div class="route">
        <div class="line"><div class="done" style="width:${pct}%"></div>
          <span class="rider" style="inset-inline-start:${pct}%">🛵</span></div>
        <div class="ends"><span>🍽️ المطعم</span><span>منزلك 🏠</span></div>
      </div>` : ''}
      ${trackHtml(o.status)}
      <div class="upd">آخر تحديث ${fmtTime(o.statusChangedAt || o.createdAt)}</div>
    </div>`;
}

/* ---------------- التقييم بعد التسليم ----------------
 * منقول عن rateOrder و updateDriverRating و updateRestaurantRating في
 * التطبيق: المتوسط يُقرَّب لخانة عشرية واحدة، **والمطعم بلا تقييمات سابقة
 * يبدأ من التقييم الأول نفسه** لا من متوسطٍ مع الـ5.0 الافتراضية التي لم
 * يمنحها أحد. لو خالفتُ هذا لاختلف متوسط المطعم بحسب من قيّمه: من التطبيق
 * أم من الموقع.
 *
 * وكان هنا سطرٌ يقول «والقواعد تسمح بهذا كلّه بلا تعديل» — صحيحاً يوم
 * كُتب (2026-08-12) وكاذباً منذ تشديد 2026-08-20. القواعد اليوم تشترط
 * علامةَ تقييمٍ ذرّية، والعقد مطبَّقٌ في `bumpRating` أدناه. */
function starsHtml(name, value) {
  return `<div class="stars" data-stars="${name}">${[1, 2, 3, 4, 5].map((n) =>
    `<button type="button" data-star="${n}" class="${n <= value ? 'on' : ''}">★</button>`).join('')}</div>`;
}
/* التقييم **دفعةٌ ذرّية**، لا كتابةً مفردة.
 *
 * شُدِّدت القاعدة (2026-08-20، ثغرة تكرار التقييم): زيادةُ العدّاد لا تُقبل
 * إلا مقرونةً بإنشاء «علامة تقييم» `ratings/{orderId}` **في الدفعة نفسها**،
 * وبأن يحمل التحديث `ratingOrderId` وألّا يمسّ حقلاً رابعاً. وهذه الصفحة
 * كُتبت قبل التشديد فبقيت تكتب كتابةً مفردة — فكان **كل تقييمٍ يُرسل من
 * الموقع يُرفض**، ويُبتلع في `catch` صامت، والطلب مختومٌ «مُقيَّم» فلا
 * يُسأل العميل ثانيةً. فمتوسّطات المطاعم والكباتن كانت تعكس مستخدمي
 * التطبيق وحدهم، ومطعمٌ يخدم عملاء الويب يبقى «جديداً» أبداً.
 *
 * العقد منقولٌ حرفياً عن `rateOrder` في `firebase_service.dart:3670-3700`
 * كي لا يفترق الجانبان ثانيةً. */
async function bumpRating(batch, base, kind, orderId, uid, newRating) {
  const snap = await getDoc(base);
  if (!snap.exists()) return false;
  const d = snap.data();
  const count = Number(d.ratingCount) || 0;
  const avg = count <= 0 ? newRating
    : ((Number(d.rating) || 0) * count + newRating) / (count + 1);
  // العلامة أولاً: القاعدة تفحص `existsAfter` عليها قبل قبول الزيادة.
  batch.set(doc(db, kind, base.id, 'ratings', orderId), {
    stars: newRating, customerId: uid, createdAt: serverTimestamp(),
  });
  // ثلاثة حقول لا رابع: القاعدة `hasOnly(['rating','ratingCount','ratingOrderId'])`.
  batch.update(base, {
    rating: Number(avg.toFixed(1)),
    ratingCount: count + 1,
    ratingOrderId: orderId,
  });
  return true;
}
async function submitRating(o) {
  const r = S.rate || {};
  if (!r.restaurant) { alert('اختر تقييماً للمطعم أولاً'); return; }
  const btn = $('rateSend'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const review = ($('rateReview').value || '').trim();
  try {
    await updateDoc(doc(db, 'orders', o.id), {
      customerRating: r.restaurant,
      driverRating: r.driver || r.restaurant,
      isRated: true,
      ...(review ? { customerReview: review } : {}),
    });
    // المتوسّطات بعد ثبوت التقييم على الطلب. ولا `catch` صامت بعد اليوم:
    // ابتلاعُ الخطأ هو ما أخفى سقوطَ كل تقييمات الموقع شهراً كاملاً — فما
    // يفشل يُكتب في الكونسول ليُرى.
    const b = writeBatch(db);
    let any = false;
    if (o.restaurantId) {
      any = await bumpRating(b, doc(db, 'restaurants', o.restaurantId),
        'restaurants', o.id, auth.currentUser.uid, r.restaurant) || any;
    }
    if (o.driverId) {
      any = await bumpRating(b, doc(db, 'drivers', o.driverId),
        'drivers', o.id, auth.currentUser.uid, r.driver || r.restaurant) || any;
    }
    if (any) {
      try { await b.commit(); }
      catch (e) { console.error('تعذّر تحديث متوسّط التقييم:', e); }
    }
    S.rate = null;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'إرسال التقييم';
    alert('تعذّر إرسال التقييم، حاول مجدداً.');
  }
}
function rateCard(o) {
  const r = S.rate || {};
  return `<div class="sec-title">قيّم تجربتك</div>
    <div class="card">
      <p class="muted" style="margin-bottom:10px">تقييمك يساعد غيرك على الاختيار — ويصل للمطعم والكابتن.</p>
      <div class="rrow"><span>🍽️ ${esc(o.restaurantName || 'المطعم')}</span>
        ${starsHtml('restaurant', r.restaurant || 0)}</div>
      ${o.driverName ? `<div class="rrow"><span>🛵 ${esc(o.driverName)}</span>
        ${starsHtml('driver', r.driver || 0)}</div>` : ''}
      <div class="field" style="margin:12px 0 10px">
        <textarea id="rateReview" rows="2" placeholder="ملاحظة للمطعم أو الكابتن (اختياري)"></textarea></div>
      <button class="btn block" id="rateSend">إرسال التقييم</button>
    </div>`;
}

/* ---------------- العناوين المحفوظة ----------------
 * الحقل `savedAddresses` موجود في مستند المستخدم منذ البداية ولم يُستعمل
 * على الويب. العميل المتكرّر كان يعيد كتابة عنوانه وتحديد موقعه في كل طلب.
 * والقواعد تسمح لصاحب المستند بتعديله ما لم يمسّ الدور أو التفعيل أو يزد
 * رصيده — وهذا ليس منها. */
const addrList = () => (S.user && Array.isArray(S.user.savedAddresses)) ? S.user.savedAddresses : [];
async function saveAddresses(list) {
  await updateDoc(doc(db, 'users', S.user.uid), { savedAddresses: list });
  S.user.savedAddresses = list;
}
async function saveCurrentAddress(label) {
  const entry = { label, address: S.addr.text.trim(), lat: S.addr.lat, lng: S.addr.lng };
  // العنوان نفسه لا يُحفظ مرتين — يُستبدل بأحدث إحداثياته.
  const list = addrList().filter((a) => (a.address || '').trim() !== entry.address);
  list.unshift(entry);
  await saveAddresses(list.slice(0, 6));   // ستة تكفي بيتاً وعملاً وأهلاً
}

/* نصوص المطاعم والأصناف يكتبها بشر في لوحة التحكم — تُهرَّب دائماً قبل
 * الحقن في HTML، فاسم صنفٍ فيه وسم لا يصير شيفرة تعمل في متصفح العميل. */
/* صورةٌ لم تُحمَّل — رابطٌ ميت، أو حجبتها سياسة المحتوى لأنها من مضيفٍ
 * غريب — كانت تترك أيقونة «صورة مكسورة» في وجه العميل. والبديل موجودٌ
 * أصلاً في البطاقة نفسها: الرمز التعبيري. وحدث `error` لا يصعد، فيُلتقط
 * في مرحلة الالتقاط على المستند بمستمعٍ واحد يكفي كل الصور. */
document.addEventListener('error', (e) => {
  const el = e.target;
  if (!el || el.tagName !== 'IMG' || !el.dataset.fb) return;
  const span = document.createElement('span');
  span.textContent = el.dataset.fb;
  el.replaceWith(span);
}, true);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
