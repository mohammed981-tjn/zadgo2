<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050D1C">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; connect-src 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/zadgo-logo-gold.png">
  <title>الصفحة غير موجودة — زادقو ZadGo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { min-height: 100dvh; background: linear-gradient(168deg, #132C56 0%, #0B1E3D 46%, #050D1C 100%);
      color: #f2f5fb; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box img { width: min(300px, 70vw); margin-bottom: 28px; }
    .code { font-size: 1rem; letter-spacing: .4em; color: #FFB903; font-weight: 700; margin-bottom: 10px; }
    h1 { font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 800; margin-bottom: 12px; }
    p { color: #9aa7bd; line-height: 2; margin-bottom: 30px; }
    a.home { display: inline-block; background: #FFB903; color: #050D1C; font-weight: 800;
      border-radius: 999px; padding: 14px 44px; text-decoration: none; font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/images/zadgo-logo.png" alt="ZadGo زادقو">
    <div class="code">404</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>ربما تغيّر الرابط أو كُتب بخطأ إملائي.<br>كل ما تبحث عنه تجده من الصفحة الرئيسية.</p>
    <a class="home" href="/">العودة للرئيسية</a>
  </div>
</body>
</html>
