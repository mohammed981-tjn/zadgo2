# قواعد التحليل الساكن.
#
# كانت flutter_lints معلَنة في pubspec بلا هذا الملف — والحزمة وحدها لا
# تفعل شيئاً، فلم تكن أي قاعدة تسري فعلياً.
#
# هذه أول تفعيلة، فهي متحفّظة عمداً: لا قاعدة تُرفَع إلى error قبل أن
# نرى ما تُنتجه على شيفرة قائمة بـ22 ألف سطر. CI يشغّل analyze بـ
# --no-fatal-warnings --no-fatal-infos، فالملاحظات تظهر ولا تُسقط البناء.
# نشدّد تدريجياً بعد قراءة أول تقرير.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # withOpacity مهجورة في Flutter الأحدث، ومستخدمة في مئات المواضع هنا.
    # الترقية دفعة مستقلة، وحتى ذلك الحين لا نُغرق التقرير بها.
    deprecated_member_use: ignore

linter:
  rules:
    # الودجات الخاصة بملفها لا تحتاج مفاتيح — القاعدة تُنتج ضجيجاً بلا فائدة.
    use_key_in_widget_constructors: false
    # التعليقات هنا عربية تشرح «لماذا»، وقاعدة صيغة التعليق الإنجليزية
    # (نقطة في آخر الجملة) لا معنى لها في هذا السياق.
    slash_for_doc_comments: false
