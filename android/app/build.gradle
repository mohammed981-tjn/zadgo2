plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
    hasReleaseSigning = keystoreProperties.getProperty('storeFile') &&
            keystoreProperties.getProperty('storePassword') &&
            keystoreProperties.getProperty('keyAlias') &&
            keystoreProperties.getProperty('keyPassword')
} else {
    keystoreProperties.setProperty('storeFile', System.getenv('ZADGO_KEYSTORE_FILE') ?: '')
    keystoreProperties.setProperty('storePassword', System.getenv('ZADGO_KEYSTORE_PASSWORD') ?: '')
    keystoreProperties.setProperty('keyAlias', System.getenv('ZADGO_KEY_ALIAS') ?: '')
    keystoreProperties.setProperty('keyPassword', System.getenv('ZADGO_KEY_PASSWORD') ?: '')
    hasReleaseSigning = keystoreProperties.getProperty('storeFile') &&
            keystoreProperties.getProperty('storePassword') &&
            keystoreProperties.getProperty('keyAlias') &&
            keystoreProperties.getProperty('keyPassword')
}

// ✅ يجب تعريف flutter { } قبل أي استخدام لـ flutter.xxx داخل بلوك
// android { } التالي (مثل flutter.ndkVersion) — كان معرَّفاً في آخر
// الملف سابقاً، ما جعل flutter.ndkVersion يُقرأ قبل أن يُعرَّف الكائن
// نفسه، فيفشل Gradle بصمت في حقن الـ "flutter" extension بشكل صحيح على
// المشروع الفرعي بأكمله — وهذا بالضبط ما كان يظهر كخطأ غامض في حزم مثل
// geolocator_android رغم أن المشكلة لا علاقة لها بإصدار أي حزمة.
flutter { source '../..' }

android {
    namespace "com.zadam.delivery"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId "com.zadam.zadgo"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    flavorDimensions "app"
    productFlavors {
        full {
            dimension "app"
            resValue "string", "app_name", "ZadGo"
        }
        customer {
            dimension "app"
            applicationIdSuffix ".customer"
            resValue "string", "app_name", "ZadGo عميل"
        }
        driver {
            dimension "app"
            applicationIdSuffix ".driver"
            resValue "string", "app_name", "ZadGo سائق"
        }
        restaurant {
            dimension "app"
            applicationIdSuffix ".restaurant"
            resValue "string", "app_name", "ZadGo مطعم"
        }
        admin {
            dimension "app"
            applicationIdSuffix ".admin"
            resValue "string", "app_name", "ZadGo إدارة"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            // رفع ملف الخرائط (mapping) معطَّل عمداً: التصغير مُطفأ أصلاً
            // فلا أسماء مُبهَمة تحتاج فكّاً، وتركه مفعَّلاً يجعل كل بناء
            // متوقّفاً على نداء شبكة لخوادم Firebase — فشلُه يُسقط البناء
            // كلّه لأجل خطوة تحسينٍ لا نحتاجها. آثار Dart تصل كاملة بدونه.
            firebaseCrashlytics { mappingFileUploadEnabled false }
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
}