pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(settingsDir, "local.properties")
        if (propertiesFile.exists()) {
            propertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null) { throw new GradleException("Flutter SDK not found.") }
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // ترقية 8.3.2 ← 8.6.1 (2026-08-13): القيد الذي أسقط بناء أمس — إصدارات
    // CameraX الحديثة (1.5+) تشترط AGP 8.6، واضطُررنا لتثبيت mobile_scanner
    // على ترقيعة أقدم بسببه. الترقية تفكّ القيد قبل أن يعود اضطراراً.
    // Gradle wrapper عندنا 8.9 سلفاً (الشرط 8.7+) وJDK 17 — لا تغيير فيهما.
    id "com.android.application" version "8.6.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
    id "com.google.gms.google-services" version "4.4.0" apply false
    // تفعيل Crashlytics على أندرويد يحتاج إضافة Gradle بجانب حزمة Dart:
    // هي التي تربط رموز الانهيار الأصلية بالتقرير. الإصدار 3.x يشترط
    // AGP 8.1+ وعندنا 8.3.2.
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
}

include ":app"